<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 러브트리 | Lovetree</title>
    <link rel="stylesheet" href="css/editor.css?v=20260415-6">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
</head>
<body>
    <div class="noise-overlay"></div>
    
    <header class="nav-bar">
        <div class="headline" style="font-size: 1.5rem; font-weight: 900; color: var(--on-surface); letter-spacing: -0.04em; cursor: pointer;" onclick="location.href='index.html'">Lovetree</div>
        
            <nav class="main-nav">
                <div class="nav-links">
                    <a href="index.html">소개</a>
                    <a href="search.html">둘러보기</a>
                    <a href="editor.html" class="active">내 러브트리</a>
                </div>

            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="lang-toggle">
                    <button class="lang-btn active">KR</button>
                    <button class="lang-btn">EN</button>
                </div>
                <div id="auth-nav"><a href="login.html" class="btn-round btn-outline" style="text-decoration: none; padding: 8px 20px; font-size: 14px;">로그인</a></div>
            </div>
        </nav>
    </header>

    <div class="editor-layout">
        <aside class="sidebar">
            <div class="tool-group">
                <h3>도구</h3>
                <div class="tool-item active">
                    <span class="material-symbols-outlined">account_tree</span>
                    <span>트리 보기</span>
                </div>
<div class="tool-item">
<span class="material-symbols-outlined">timeline</span>
<span>타임라인</span>
</div>
            </div>

            <div class="tool-group" style="margin-top: auto;">
                <h3>추가</h3>
                <div class="tool-item" id="addMemoryBtn">
                    <span class="material-symbols-outlined" style="background: var(--primary); color: white;">add</span>
                    <span>영상 추가</span>
                </div>
            </div>
        </aside>

        <main class="canvas-area" id="canvasArea">
            <svg class="canvas-svg" id="canvasSvg"></svg>
            <!-- JS dynamic content -->
        </main>

        <aside class="detail-panel" id="detailPanel">
            <div class="panel-header">
                <h3 class="headline" style="font-size: 1.5rem;">기억 상세</h3>
                <button class="icon-btn"><span class="material-symbols-outlined">more_horiz</span></button>
            </div>
            
            <div class="detail-content">
                <div class="detail-video">
                    <img id="detailImg" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJb2reehtYkk1tSupKcTenf09sFrI1MN_2H_orLdE8A1rOAlc27BWm62BVBav5qtwxTUJ7ctbr2bDNmU2EfruV9ajOc0QCzABvXJ5-qWXAeR8GOQumFqygnon2pN6L7Wc3UJvG-f9dh26hzO_bnWAoTverOtXlPKc4AqL95xSgqIwuVjm5Pb_eQ8gJI5kv4se7YvCHY5v3jZ5m1n6OzaavO3FKOfXk35Bs0O-w4R19eHXM2fn2Lr1bS2uizoWLcKYYZOKGHH6COFc" alt="Preview">
                    <div class="play-overlay"><span class="material-symbols-outlined">play_arrow</span></div>
                </div>

                <div class="detail-info-group">
                    <label>기억한 날</label>
                    <p id="detailDateText">2024.03.14</p>
                </div>

                <div class="detail-info-group">
                    <label>감정 태그</label>
                    <div class="tags-container">
                        <span class="tag tag-primary">강렬한</span>
                        <span class="tag tag-secondary">환희</span>
                    </div>
                </div>

                <div class="detail-info-group">
                    <label>감정 메모</label>
                    <div class="diary-note">
                        "마지막 앙코르 곡이 울려 퍼질 때, 그 순간의 공기와 팬들의 함성 소리가 아직도 생생해."
                    </div>
                </div>
            </div>
            
            <div class="panel-footer">
                <button class="btn-round btn-primary" style="width: 100%;">내 러브트리에 기록하기</button>
            </div>
        </aside>
    </div>

    <script src="js/mock-data.js?v=20260415-8"></script>
    <script src="js/postgres-client.js?v=20260415-9"></script>
    <script src="js/editor.js?v=20260415-10"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="js/firebase-config.js?v=20260415-6"></script>
    <script src="js/auth.js?v=20260415-11"></script>
</body>
</html>
