name: CI E2E Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      LOVEBUD_URL: http://127.0.0.1:8888

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Start Netlify dev
        run: |
          nohup netlify dev --port 8888 > netlify-dev.log 2>&1 &
          echo $! > netlify-dev.pid

      - name: Wait for server
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS "$LOVEBUD_URL" > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in time"
          cat netlify-dev.log || true
          exit 1

      - name: Run E2E smoke subset
        run: npm run test:e2e:ci

      - name: Print Netlify dev log on failure
        if: failure()
        run: cat netlify-dev.log || true

      - name: Stop Netlify dev
        if: always()
        run: |
          if [ -f netlify-dev.pid ]; then
            kill "$(cat netlify-dev.pid)" || true
          fi