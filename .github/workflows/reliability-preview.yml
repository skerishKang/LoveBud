name: Reliability Preview Rehearsal

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reliability-preview-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22.13
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0

      - name: Run hermetic reliability Preview rehearsal
        run: node --test tests/reliability-preview/*.test.cjs
