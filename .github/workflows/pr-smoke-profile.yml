name: PR Smoke Profile

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-smoke-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Run smoke tests
        run: node --test tests/smoke/*.test.cjs

  profile-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Run route tests
        run: node --test tests/routes/*.test.cjs

  profile-contract-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run contract files independently
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -uo pipefail
          mapfile -t files < <(find tests/contracts -maxdepth 1 -type f -name '*.test.cjs' -print | sort)
          selected=()
          for i in "${!files[@]}"; do
            if (( i % 4 == SHARD )); then
              selected+=("${files[$i]}")
            fi
          done

          printf 'contract file-profile shard %s: %s files\n' "$SHARD" "${#selected[@]}"
          test "${#selected[@]}" -gt 0 || exit 2

          profile_file="$RUNNER_TEMP/contract-profile-shard-${SHARD}.tsv"
          printf 'record\tshard\tfile\tstatus\texit\telapsed_ms\n' > "$profile_file"
          for file in "${selected[@]}"; do
            printf 'SELECTED\t%s\t%s\t\t\t\n' "$SHARD" "$file" >> "$profile_file"
          done

          {
            printf '### Contract file profile — shard %s\n\n' "$SHARD"
            printf 'Selected files: **%s**\n\n' "${#selected[@]}"
            printf '| file | status | exit | elapsed_ms |\n'
            printf '|---|---:|---:|---:|\n'
          } >> "$GITHUB_STEP_SUMMARY"

          failures=0
          for file in "${selected[@]}"; do
            echo "::group::$file"
            printf 'CONTRACT_FILE_PROFILE_START shard=%s file=%s\n' "$SHARD" "$file"
            started_ms=$(date +%s%3N)
            set +e
            timeout --signal=TERM --kill-after=5s 60s node --test "$file"
            code=$?
            set -e
            ended_ms=$(date +%s%3N)
            elapsed_ms=$((ended_ms - started_ms))

            if (( code == 0 )); then
              status=PASS
            elif (( code == 124 || code == 137 )); then
              status=TIMEOUT
              failures=$((failures + 1))
            else
              status="EXIT_${code}"
              failures=$((failures + 1))
            fi

            printf 'CONTRACT_FILE_PROFILE shard=%s file=%s status=%s exit=%s elapsed_ms=%s\n' \
              "$SHARD" "$file" "$status" "$code" "$elapsed_ms"
            printf 'RESULT\t%s\t%s\t%s\t%s\t%s\n' \
              "$SHARD" "$file" "$status" "$code" "$elapsed_ms" >> "$profile_file"
            printf '| `%s` | %s | %s | %s |\n' \
              "$file" "$status" "$code" "$elapsed_ms" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

          printf 'CONTRACT_FILE_PROFILE_SUMMARY shard=%s files=%s failures=%s\n' \
            "$SHARD" "${#selected[@]}" "$failures"
          printf '\nFailures: **%s**\n' "$failures" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
      - name: Upload contract profile results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-profile-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/contract-profile-shard-${{ matrix.shard }}.tsv
          if-no-files-found: error
          retention-days: 7
