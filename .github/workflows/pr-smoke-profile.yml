name: PR Smoke Profile

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-smoke-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Run smoke tests
        run: node --test tests/smoke/*.test.cjs

  profile-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Run route tests
        run: node --test tests/routes/*.test.cjs

  profile-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Run contract tests
        run: node --test tests/contracts/*.test.cjs
