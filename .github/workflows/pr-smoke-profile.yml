name: PR Smoke Profile

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-smoke-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Run smoke tests
        run: node --test tests/smoke/*.test.cjs

  profile-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Run route tests
        run: node --test tests/routes/*.test.cjs

  profile-contracts-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Run contract shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t files < <(find tests/contracts -maxdepth 1 -type f -name '*.test.cjs' -print | sort)
          selected=()
          for i in "${!files[@]}"; do
            if (( i % 4 == SHARD )); then
              selected+=("${files[$i]}")
            fi
          done
          printf 'contract shard %s: %s files\n' "$SHARD" "${#selected[@]}"
          printf '%s\n' "${selected[@]}"
          test "${#selected[@]}" -gt 0
          node --test "${selected[@]}"
