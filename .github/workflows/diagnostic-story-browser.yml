name: Diagnostic Full Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/diagnostic-story-browser.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full smoke and capture output
        id: full_smoke
        shell: bash
        run: |
          set +e
          npm test > full-smoke.log 2>&1
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: full-smoke-log
          path: full-smoke.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve diagnostic result
        run: |
          echo "Full smoke exit status: ${{ steps.full_smoke.outputs.status }}"
