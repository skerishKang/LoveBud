name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify-static:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build check
        run: npm run build

      - name: Smoke test
        run: npm test

      - name: Verify
        run: npm run verify
