name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-static:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build check
        run: npm run build

      - name: Smoke test
        run: node scripts/ci-smoke-runner.cjs

      - name: Verify
        run: npm run verify

  db-impact:
    runs-on: ubuntu-latest
    outputs:
      run-db: ${{ steps.classify.outputs.run-db }}

    steps:
      - name: Checkout PR head for DB impact classification
        id: checkout
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Classify DB impact
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          run_db=true

          if [[ "${EVENT_NAME}" == "pull_request" && "${CHECKOUT_OUTCOME}" == "success" ]]; then
            if changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" 2>/dev/null)"; then
              if [[ -n "${changed_files}" ]]; then
                if decision="$(printf '%s\n' "${changed_files}" | node scripts/ci-db-impact-classifier.cjs 2>/dev/null)" &&
                   [[ "${decision}" == "true" || "${decision}" == "false" ]]; then
                  run_db="${decision}"
                fi
              fi
            fi
          fi

          echo "run-db=${run_db}" >> "${GITHUB_OUTPUT}"
          echo "DB impact decision: run-db=${run_db}"

  db-engine-tree-comments:
    needs: db-impact
    if: >-
      ${{ always() && !cancelled() && (needs.db-impact.result != 'success' || needs.db-impact.outputs.run-db == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17.4-bookworm
        env:
          POSTGRES_USER: lovebud_ci
          # Ephemeral synthetic password: expression-only job-derived value.
          POSTGRES_PASSWORD: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: lovebud_ci_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovebud_ci -d lovebud_ci_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      LB_TEST_PGHOST: 127.0.0.1
      LB_TEST_PGPORT: "5432"
      LB_TEST_PGUSER: lovebud_ci
      LB_TEST_PGPASSWORD: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      LB_TEST_PGADMIN_DB: lovebud_ci_admin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Assert PostgreSQL server version 17.4
        env:
          PGPASSWORD: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
        run: |
          VER=$(psql -h 127.0.0.1 -p 5432 -U lovebud_ci -d lovebud_ci_admin -tAc "SHOW server_version_num;")
          echo "server_version_num=${VER}"
          test "${VER}" = "170004"

      - name: Run tree_comments DB engine tests
        run: npm run test:db-engine:tree-comments

