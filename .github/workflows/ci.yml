name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-static:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build check
        run: npm run build

      - name: Smoke test
        run: node scripts/ci-smoke-runner.cjs

      - name: Verify
        run: npm run verify

  db-engine-tree-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17.4-bookworm
        env:
          POSTGRES_USER: lovebud_ci
          # Ephemeral synthetic password: expression-only job-derived value.
          POSTGRES_PASSWORD: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: lovebud_ci_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovebud_ci -d lovebud_ci_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      LB_TEST_PGHOST: 127.0.0.1
      LB_TEST_PGPORT: "5432"
      LB_TEST_PGUSER: lovebud_ci
      LB_TEST_PGPASSWORD: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      LB_TEST_PGADMIN_DB: lovebud_ci_admin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Assert PostgreSQL server version 17.4
        env:
          PGPASSWORD: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
        run: |
          VER=$(psql -h 127.0.0.1 -p 5432 -U lovebud_ci -d lovebud_ci_admin -tAc "SHOW server_version_num;")
          echo "server_version_num=${VER}"
          test "${VER}" = "170004"

      - name: Run tree_comments DB engine tests
        run: npm run test:db-engine:tree-comments

