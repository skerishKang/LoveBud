name: Branch Authority Gate

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: branch-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run branch authority governance contracts
        run: >
          node --test
          tests/contracts/test-layer-classification-contract.test.cjs
          tests/contracts/test-runner-reachability-contract.test.cjs
          tests/contracts/db-schema-change-inventory-contract.test.cjs
          tests/contracts/ci-test-group-registry-contract.test.cjs
          tests/contracts/test-suite-count-authority-contract.test.cjs
          tests/contracts/cloudflare-supplied-url-smoke-contract.test.cjs
