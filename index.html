<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovetree | 나만의 러브트리</title>
    <link rel="stylesheet" href="css/global.css?v=20260417-31">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
     <style>
         /* Remove .app-container card styling - use open layout like app pages */
         .landing-wrapper {
             min-height: 100vh;
             display: flex;
             flex-direction: column;
         }

         .hero-section {
             flex: 1;
             display: flex;
             align-items: center;
             justify-content: center;
             padding: 120px 48px 80px;
             max-width: 1280px;
             margin: 0 auto;
             width: 100%;
             position: relative;
         }

         .hero-content {
             max-width: 640px;
             z-index: 2;
             display: flex;
             flex-direction: column;
             align-items: center;
             text-align: center;
         }

         .hero-visual {
             position: absolute;
             right: 5%;
             top: 50%;
             transform: translateY(-50%);
             width: 45%;
             max-width: 500px;
             z-index: 1;
         }

         .hero-title {
             font-size: 3.5rem;
             line-height: 1.15;
             color: var(--on-surface);
             margin-bottom: 1.5rem;
             font-weight: 900;
         }

         .hero-title span {
             color: var(--primary);
         }

         .hero-desc {
             font-size: 1.15rem;
             color: var(--on-surface-variant);
             margin-bottom: 2.5rem;
             line-height: 1.6;
         }

         .memory-card-mini {
             background: white;
             border-radius: 1.2rem;
             padding: 12px;
             box-shadow: 0 20px 50px rgba(0,0,0,0.08);
             width: 220px;
             position: absolute;
             z-index: 20;
             transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
         }

         .memory-card-mini:hover {
             transform: scale(1.08) rotate(2deg);
             box-shadow: 0 30px 60px rgba(0,0,0,0.12);
         }

         /* Feature cards section - use same spacing as app */
         .features-section {
             padding: 80px 48px;
             max-width: 1280px;
             margin: 0 auto;
             width: 100%;
         }

         .features-grid {
             display: grid;
             grid-template-columns: repeat(4, 1fr);
             gap: 24px;
         }

         .feature-card {
             background: white;
             padding: 2rem;
             border-radius: 2.5rem;
             display: flex;
             align-items: center;
             gap: 20px;
             border: 1px solid rgba(0,0,0,0.03);
             box-shadow: 0 10px 30px rgba(0,0,0,0.02);
             transition: all 0.3s;
         }

         .feature-card:hover {
             transform: translateY(-8px);
             box-shadow: 0 20px 40px rgba(144, 73, 81, 0.08);
             border-color: var(--outline-variant);
         }

         .feature-icon {
             width: 56px;
             height: 56px;
             border-radius: 16px;
             display: flex;
             align-items: center;
             justify-content: center;
             font-size: 24px;
             flex-shrink: 0;
         }

         .hero-badge {
             display: inline-block;
             background: rgba(144, 73, 81, 0.08);
             color: var(--primary);
             padding: 6px 16px;
             border-radius: 99px;
             font-size: 12px;
             font-weight: 800;
             margin-bottom: 24px;
             letter-spacing: 0.02em;
         }

         .hero-cta-group {
             display: flex;
             flex-wrap: wrap;
             justify-content: center;
             gap: 16px;
             width: 100%;
         }

         .mini-tree-card {
             top: 12%;
             right: 2%;
             padding: 14px;
             border-radius: 1.5rem;
             background: rgba(255, 255, 255, 0.96);
             backdrop-filter: blur(10px);
         }

         .mini-tree-canvas {
             position: relative;
             height: 150px;
             border-radius: 1rem;
             background: radial-gradient(circle at top, rgba(255,255,255,0.9), rgba(255,245,246,0.88) 44%, rgba(246, 249, 241, 0.96) 100%);
             border: 1px solid rgba(144, 73, 81, 0.08);
             overflow: hidden;
         }

         .mini-tree-ground {
             position: absolute;
             left: 16px;
             right: 16px;
             bottom: 14px;
             height: 18px;
             border-radius: 999px;
             background: linear-gradient(90deg, rgba(147, 175, 126, 0.2), rgba(122, 139, 110, 0.38), rgba(147, 175, 126, 0.2));
         }

         .mini-tree-trunk {
             position: absolute;
             left: 50%;
             bottom: 24px;
             width: 12px;
             height: 66px;
             transform: translateX(-50%);
             border-radius: 999px;
             background: linear-gradient(180deg, #c18b83, #904951);
             box-shadow: 0 8px 18px rgba(144, 73, 81, 0.18);
         }

         .mini-tree-branch {
             position: absolute;
             height: 5px;
             border-radius: 999px;
             background: linear-gradient(90deg, #c18b83, #aa646d);
             transform-origin: left center;
         }

         .mini-tree-branch.branch-left-top {
             width: 50px;
             left: 50%;
             bottom: 72px;
             transform: translateX(-6px) rotate(-36deg);
         }

         .mini-tree-branch.branch-right-top {
             width: 54px;
             left: 50%;
             bottom: 78px;
             transform: translateX(4px) rotate(30deg);
         }

         .mini-tree-branch.branch-left-bottom {
             width: 42px;
             left: 50%;
             bottom: 52px;
             transform: translateX(-6px) rotate(-18deg);
         }

         .mini-tree-node {
             position: absolute;
             width: 34px;
             height: 34px;
             border-radius: 50%;
             display: flex;
             align-items: center;
             justify-content: center;
             font-size: 16px;
             background: rgba(255, 255, 255, 0.95);
             border: 1px solid rgba(144, 73, 81, 0.12);
             box-shadow: 0 10px 20px rgba(75, 64, 57, 0.08);
         }

         .mini-tree-node.node-root {
             left: 50%;
             bottom: 16px;
             transform: translateX(-50%);
             background: linear-gradient(135deg, #fff1f2, #ffffff);
         }

         .mini-tree-node.node-left-top {
             left: 56px;
             top: 30px;
         }

         .mini-tree-node.node-right-top {
             right: 44px;
             top: 22px;
         }

         .mini-tree-node.node-left-bottom {
             left: 36px;
             top: 76px;
         }

         .mini-tree-summary {
             display: flex;
             justify-content: space-between;
             align-items: center;
             margin-top: 12px;
             font-size: 11px;
             color: var(--on-surface-variant);
             font-weight: 700;
         }

         .mini-tree-tag {
             padding: 5px 10px;
             border-radius: 999px;
             background: rgba(144, 73, 81, 0.08);
             color: var(--primary);
         }

          /* Mobile adjustments */
          @media (max-width: 1024px) {
              .features-grid {
                  grid-template-columns: repeat(2, 1fr);
              }
          }

          @media (max-width: 768px) {
              .hero-section {
                  flex-direction: column;
                  padding: 100px 24px 60px;
                  text-align: center;
              }

              .hero-content {
                  max-width: 100%;
              }

              .hero-visual {
                  position: relative;
                  right: auto;
                  top: auto;
                  transform: none;
                  width: 100%;
                  max-width: 400px;
                  margin-top: 40px;
              }

              .hero-title {
                  font-size: 2.5rem;
              }

              .features-grid {
                  grid-template-columns: 1fr;
              }

              /* Stabilize memory card positions on mobile - center them */
              .hero-visual .memory-card-mini {
                  left: 50% !important;
                  right: auto !important;
                  transform: translateX(-50%) !important;
              }

              /* Mobile: Show smaller tree, hide some floating cards */
              @media (max-width: 768px) {
                  .love-tree-svg {
                      max-height: 350px;
                  }
                  .hero-float-card:nth-child(3) {
                      display: none; /* Hide one card on mobile */
                  }
              }

              .hero-visual .memory-card-mini:first-child {
                  top: 10% !important;
                  transform: translateX(-50%) !important;
              }

              .hero-visual .memory-card-mini:nth-child(2) {
                  display: none;
              }
          }
     </style>
</head>
<body class="bokeh-bg">
    <div class="noise-overlay"></div>
    
    <div class="landing-wrapper">
        <!-- Shared Header -->
        <div id="shared-header"></div>

        <!-- Main Hero Section -->
        <section class="hero-section">
            <div class="hero-content">
                <div class="hero-badge" data-i18n="home.badge">💝 나만의 러브트리</div>
                <h1 class="hero-title" data-i18n="home.heroTitle">사랑하는 것의<br><span>모든 순간이 하나의 나무가 된다</span></h1>
                <p class="hero-desc" data-i18n="home.heroSubtitle">
                    입덕의 첫 설렘, 가장 감동했던 그 장면, 그리고 지금 이 순간까지.
                    당신이 느낀 감정의 결을 남기고, 하나의 나무로 완성하세요.
                </p>
                <div class="hero-cta-group">
                    <a href="pages/login.html?redirect=my-trees.html" class="btn-round btn-primary" style="text-decoration: none;" data-i18n="home.cta.start">내 러브트리 시작하기</a>
                    <a href="pages/search.html" class="btn-round btn-outline" style="text-decoration: none;" data-i18n="home.cta.browse">다른 트리 둘러보기</a>
                </div>
            </div>

            <div class="hero-visual">
                <!-- 러브트리 성장 시각화 -->
                <svg class="love-tree-svg" viewBox="0 0 500 600" style="position: absolute; width: 100%; height: 100%; overflow: visible;">
                    <!-- 정의: 그라데이션 및 필터 -->
                    <defs>
                        <linearGradient id="trunkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#904951;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#b86b73;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#904951;stop-opacity:1" />
                        </linearGradient>
                        <linearGradient id="branchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#c97b83;stop-opacity:0.9" />
                            <stop offset="100%" style="stop-color:#904951;stop-opacity:0.7" />
                        </linearGradient>
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
                            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#904951" flood-opacity="0.15"/>
                        </filter>
                    </defs>

                    <!-- 메인 줄기 (성장하는 중앙 줄기) -->
                    <path d="M 250 580 Q 245 450 250 380 Q 255 300 240 220 Q 235 180 250 140" 
                          stroke="url(#trunkGradient)" stroke-width="12" fill="none" stroke-linecap="round"/>
                    
                    <!-- 곡선 가지들 -->
                    <path d="M 250 380 Q 180 350 140 300 Q 110 260 120 220" 
                          stroke="url(#branchGradient)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9"/>
                    <path d="M 250 320 Q 320 290 360 250 Q 390 220 380 180" 
                          stroke="url(#branchGradient)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>
                    <path d="M 240 260 Q 190 240 160 200 Q 140 170 150 140" 
                          stroke="url(#branchGradient)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
                    <path d="M 250 200 Q 300 180 340 160 Q 370 140 360 110" 
                          stroke="url(#branchGradient)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
                    <path d="M 245 160 Q 210 140 190 110 Q 175 85 185 60" 
                          stroke="url(#branchGradient)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75"/>

                    <!-- 기억 노드 (메모리 카드 아이콘) -->
                    <g filter="url(#softShadow)">
                        <!-- 노드 1: 뿌리 근처 첫 기억 -->
                        <rect x="200" y="420" width="60" height="45" rx="8" fill="white" stroke="#e8e0e0" stroke-width="1"/>
                        <rect x="205" y="425" width="50" height="30" rx="4" fill="#fff0f1"/>
                        <circle cx="230" cy="440" r="8" fill="#904951" opacity="0.3"/>
                        <text x="230" y="444" text-anchor="middle" fill="#904951" font-size="8">▶</text>
                        
                        <!-- 노드 2: 왼쪽 가지 -->
                        <rect x="100" y="200" width="55" height="40" rx="7" fill="white" stroke="#e8e0e0" stroke-width="1"/>
                        <rect x="104" y="204" width="47" height="25" rx="3" fill="#f0f4ff"/>
                        <circle cx="127" cy="216" r="6" fill="#6b7db8" opacity="0.4"/>
                        
                        <!-- 노드 3: 오른쪽 가지 -->
                        <rect x="360" y="160" width="55" height="40" rx="7" fill="white" stroke="#e8e0e0" stroke-width="1"/>
                        <rect x="364" y="164" width="47" height="25" rx="3" fill="#f0fff4"/>
                        <circle cx="387" cy="176" r="6" fill="#6bb88a" opacity="0.4"/>
                        
                        <!-- 노드 4: 상단 새싹 -->
                        <rect x="165" y="50" width="50" height="38" rx="6" fill="white" stroke="#e8e0e0" stroke-width="1"/>
                        <rect x="169" y="54" width="42" height="22" rx="3" fill="#fff9f0"/>
                        <circle cx="190" cy="65" r="5" fill="#b89a6b" opacity="0.4"/>
                    </g>

                    <!-- 감정 태그 (떠다니는 느낌) -->
                    <g opacity="0.9">
                        <rect x="280" y="280" width="50" height="22" rx="11" fill="#fff0f1" stroke="#e8d0d3" stroke-width="1"/>
                        <text x="305" y="294" text-anchor="middle" fill="#904951" font-size="10" font-weight="600">행복</text>
                        
                        <rect x="130" y="320" width="45" height="20" rx="10" fill="#f0f4ff" stroke="#d0d8e8" stroke-width="1"/>
                        <text x="152" y="334" text-anchor="middle" fill="#6b7db8" font-size="9" font-weight="600">설렘</text>
                        
                        <rect x="320" y="380" width="55" height="22" rx="11" fill="#f0fff4" stroke="#d0e8d5" stroke-width="1"/>
                        <text x="347" y="394" text-anchor="middle" fill="#6bb88a" font-size="10" font-weight="600">성장</text>
                        
                        <rect x="70" y="150" width="48" height="20" rx="10" fill="#fff9f0" stroke="#e8e0d0" stroke-width="1"/>
                        <text x="94" y="164" text-anchor="middle" fill="#8a7d6b" font-size="9" font-weight="600">추억</text>
                    </g>

                    <!-- 성장 표시 (새싹, 잎사귀) -->
                    <g filter="url(#glow)">
                        <!-- 상단 새싹 -->
                        <ellipse cx="250" cy="125" rx="12" ry="18" fill="#90c97b" opacity="0.6"/>
                        <ellipse cx="250" cy="120" rx="8" ry="12" fill="#a8d98f" opacity="0.8"/>
                        
                        <!-- 작은 잎사귀들 -->
                        <ellipse cx="185" cy="60" rx="6" ry="10" fill="#90c97b" opacity="0.5" transform="rotate(-30 185 60)"/>
                        <ellipse cx="360" cy="110" rx="5" ry="8" fill="#90c97b" opacity="0.5" transform="rotate(30 360 110)"/>
                        <ellipse cx="150" cy="140" rx="5" ry="8" fill="#90c97b" opacity="0.4" transform="rotate(-20 150 140)"/>
                    </g>

                    <!-- 연결선 (기억과 가지를 잇는 실) -->
                    <path d="M 230 420 Q 230 400 240 380" stroke="#d0c0c0" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
                    <path d="M 127 240 Q 130 230 140 220" stroke="#d0c0c0" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
                    <path d="M 387 200 Q 385 190 380 180" stroke="#d0c0c0" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
                    <path d="M 190 88 Q 188 75 185 60" stroke="#d0c0c0" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

                    <!-- 뿌리 애니메이션 힌트 (점선 원) -->
                    <ellipse cx="250" cy="560" rx="40" ry="15" fill="none" stroke="#904951" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>
                </svg>

                <!-- 플로팅 미니 트리 카드 -->
                <div class="memory-card-mini mini-tree-card hero-float-card" style="animation: float 6s ease-in-out infinite;">
                    <div class="mini-tree-canvas">
                        <div class="mini-tree-ground"></div>
                        <div class="mini-tree-trunk"></div>
                        <div class="mini-tree-branch branch-left-top"></div>
                        <div class="mini-tree-branch branch-right-top"></div>
                        <div class="mini-tree-branch branch-left-bottom"></div>
                        <div class="mini-tree-node node-left-top">💝</div>
                        <div class="mini-tree-node node-right-top">✨</div>
                        <div class="mini-tree-node node-left-bottom">🌿</div>
                        <div class="mini-tree-node node-root">🌱</div>
                    </div>
                    <div class="mini-tree-summary">
                        <span class="mini-tree-tag">감정 4개</span>
                        <span>나만의 트리</span>
                    </div>
                </div>

                <div class="memory-card-mini hero-float-card" style="top: 56%; left: 6%; transform: rotate(-4deg); animation: float 7s ease-in-out infinite 1s;">
                    <div style="width:100%; height:90px; background: linear-gradient(135deg, #fdf7ef 0%, #fff3de 100%); border-radius: 0.8rem; display:flex; align-items:center; justify-content:center;">
                        <span style="font-size: 24px;">🫶</span>
                    </div>
                    <div style="position: absolute; bottom: 4px; left: 4px; right: 4px; background: rgba(201,168,124,0.92); color: white; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 700;">첫 설렘</div>
                </div>

                <!-- 플로팅 애니메이션 CSS -->
                <style>
                    @keyframes float {
                        0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
                        50% { transform: translateY(-10px) rotate(var(--rot, 0deg)); }
                    }
                    .hero-float-card:nth-child(2) { --rot: 3deg; }
                    .hero-float-card:nth-child(3) { --rot: -4deg; }
                </style>
            </div>
        </section>

<!-- CTA Section -->
<section class="features-section" style="border-top: 1px solid var(--outline-variant);">
  <p style="text-align: center; color: var(--on-surface-variant); font-size: 1rem; margin-bottom: 2rem;" data-i18n="home.intro">
    더 알고 싶으세요?
  </p>
  <div style="display: flex; gap: 16px; justify-content: center;">
    <a href="pages/intro.html" class="btn-round btn-outline" style="text-decoration: none; background: white;" data-i18n="nav.intro">LoveTree 소개 보기</a>
    <a href="pages/search.html" class="btn-round btn-outline" style="text-decoration: none;" data-i18n="home.cta.browse">둘러보기</a>
  </div>
</section>
