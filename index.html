<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveTree | 나만의 러브트리</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23fff4ee'/%3E%3Cpath d='M32 49V25' stroke='%23904951' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 29c-9-1-16-7-17-16 9 1 16 7 17 16Z' fill='%23e58a96'/%3E%3Cpath d='M32 29c9-1 16-7 17-16-9 1-16 7-17 16Z' fill='%2397c978'/%3E%3Ccircle cx='32' cy='18' r='5' fill='%23f2c36b'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/global.css?v=20260417-31">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
     <style>
         /* Remove .app-container card styling - use open layout like app pages */
         .landing-wrapper {
             min-height: 100vh;
             display: flex;
             flex-direction: column;
         }

.hero-section {
             flex: 1;
             display: flex;
             align-items: center;
             justify-content: center;
             min-height: calc(100vh - 72px);
             padding: 82px 48px 64px;
             background: radial-gradient(circle at 18% 18%, rgba(255, 214, 194, 0.72), transparent 32%),
                         radial-gradient(circle at 76% 24%, rgba(244, 185, 195, 0.46), transparent 30%),
                         linear-gradient(135deg, #fff7f0 0%, #fff1ea 46%, #f9e7e3 100%);
             background-size: cover;
             background-position: center;
             position: relative;
         }

        .hero-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0.16) 0%,
                rgba(255,255,255,0.08) 40%,
                rgba(255,255,255,0.02) 100%
            );
            pointer-events: none;
        }

.hero-content {
             max-width: 690px;
             z-index: 2;
             display: flex;
             flex-direction: column;
             align-items: flex-start;
             gap: 16px;
             position: relative;
             margin-right: min(32vw, 420px);
         }

         .hero-visual {
             position: absolute;
             right: 5%;
             top: 50%;
             transform: translateY(-50%);
             width: 41%;
             max-width: 500px;
             z-index: 1;
             pointer-events: none;
             user-select: none;
         }

.hero-title {
             max-width: 720px;
             font-size: clamp(3.15rem, 5.3vw, 4.8rem);
             line-height: 1.08;
             color: var(--on-surface);
             font-family: var(--font-heading);
             letter-spacing: 0;
             font-weight: 900;
             text-shadow: 0 1px 10px rgba(255,255,255,0.2);
         }

         .hero-title .title-line {
             display: block;
         }

         .hero-title .title-accent {
             color: var(--primary);
         }

         .hero-desc {
             max-width: 590px;
             font-size: 1.15rem;
             color: var(--on-surface-variant);
             margin: 0;
             line-height: 1.62;
         }

         .memory-card-mini {
             background: white;
             border-radius: 1.2rem;
             padding: 12px;
             box-shadow: 0 20px 50px rgba(0,0,0,0.08);
             width: 220px;
             position: absolute;
             z-index: 20;
             transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
             pointer-events: none;
         }

         .memory-card-mini:hover {
             transform: scale(1.04) rotate(1deg);
             box-shadow: 0 30px 60px rgba(0,0,0,0.12);
         }

         /* Feature cards section - use same spacing as app */
         .features-section {
             padding: 80px 48px;
             max-width: 1280px;
             margin: 0 auto;
             width: 100%;
         }

         .features-grid {
             display: grid;
             grid-template-columns: repeat(4, 1fr);
             gap: 24px;
         }

         .feature-card {
             background: white;
             padding: 2rem;
             border-radius: 2.5rem;
             display: flex;
             align-items: center;
             gap: 20px;
             border: 1px solid rgba(0,0,0,0.03);
             box-shadow: 0 10px 30px rgba(0,0,0,0.02);
             transition: all 0.3s;
         }

         .feature-card:hover {
             transform: translateY(-8px);
             box-shadow: 0 20px 40px rgba(144, 73, 81, 0.08);
             border-color: var(--outline-variant);
         }

         .feature-icon {
             width: 56px;
             height: 56px;
             border-radius: 16px;
             display: flex;
             align-items: center;
             justify-content: center;
             font-size: 24px;
             flex-shrink: 0;
         }

         .hero-badge {
             display: inline-block;
             background: rgba(144, 73, 81, 0.07);
             color: var(--primary);
             padding: 6px 16px;
             border-radius: 99px;
             font-size: 12px;
             font-weight: 800;
             margin-bottom: 4px;
             letter-spacing: 0.02em;
         }

         .hero-kicker {
             margin: 0;
             max-width: 560px;
             font-size: 0.94rem;
             line-height: 1.55;
             color: var(--primary);
             font-weight: 700;
         }

         .hero-cta-group {
             display: flex;
             flex-wrap: wrap;
             justify-content: flex-start;
             gap: 16px;
             width: 100%;
             margin-top: 2px;
         }

         .hero-cta-btn {
             min-height: 56px;
             padding: 0 32px;
             border-radius: 999px;
             display: inline-flex;
             align-items: center;
             justify-content: center;
             text-decoration: none;
             font-size: 1rem;
             font-weight: 700;
             line-height: 1;
             white-space: nowrap;
             text-align: center;
         }

         .hero-cta-btn.btn-outline {
             opacity: 1;
         }

         .hero-flow {
             display: flex;
             flex-wrap: wrap;
             justify-content: flex-start;
             gap: 10px;
             margin: 2px 0 0;
             width: 100%;
         }

         .hero-flow-step {
             display: inline-flex;
             align-items: center;
             gap: 8px;
             padding: 7px 13px;
             border-radius: 999px;
             background: rgba(255,255,255,0.62);
             border: 1px solid rgba(144, 73, 81, 0.06);
             color: var(--on-surface-variant);
             font-size: 0.82rem;
             font-weight: 700;
             box-shadow: 0 8px 20px rgba(75, 64, 57, 0.03);
         }

         .hero-flow-step-index {
             display: inline-flex;
             align-items: center;
             justify-content: center;
             width: 22px;
             height: 22px;
             border-radius: 999px;
             background: rgba(144, 73, 81, 0.1);
             color: var(--primary);
             font-size: 0.74rem;
             font-weight: 900;
             line-height: 1;
             flex-shrink: 0;
         }

         .hero-flow-step-text {
             display: inline-flex;
             align-items: center;
             line-height: 1.2;
         }

         .hero-support-copy {
             margin: 0;
             max-width: 500px;
             font-size: 0.88rem;
             line-height: 1.6;
             color: var(--on-surface-variant);
         }

         .hero-support-note {
             margin: -2px 0 2px;
             display: inline-flex;
             align-items: center;
             gap: 8px;
             min-height: 32px;
             padding: 0 14px;
             border-radius: 999px;
             background: rgba(255,255,255,0.58);
             border: 1px solid rgba(144, 73, 81, 0.08);
             color: var(--primary);
             font-size: 0.86rem;
             font-weight: 700;
             line-height: 1.4;
             box-shadow: 0 8px 20px rgba(75, 64, 57, 0.03);
         }

         .hero-support-note-emoji {
             font-size: 0.95rem;
             line-height: 1;
         }

         .mini-tree-card {
             top: 18%;
             right: 5%;
             width: 260px;
             padding: 16px;
             border-radius: 1.5rem;
             background: rgba(255, 255, 255, 0.96);
             backdrop-filter: blur(10px);
             box-shadow: 0 26px 70px rgba(75, 64, 57, 0.12);
         }

         .love-tree-svg {
             position: absolute;
             width: 100%;
             height: 100%;
             overflow: visible;
             opacity: 0.9;
         }

         .mini-tree-canvas {
             position: relative;
             height: 180px;
             border-radius: 1rem;
             background: radial-gradient(circle at top, rgba(255,255,255,0.9), rgba(255,245,246,0.88) 44%, rgba(246, 249, 241, 0.96) 100%);
             border: 1px solid rgba(144, 73, 81, 0.08);
             overflow: hidden;
         }

         .mini-tree-ground {
             position: absolute;
             left: 16px;
             right: 16px;
             bottom: 14px;
             height: 18px;
             border-radius: 999px;
             background: linear-gradient(90deg, rgba(147, 175, 126, 0.2), rgba(122, 139, 110, 0.38), rgba(147, 175, 126, 0.2));
         }

         .mini-tree-trunk {
             position: absolute;
             left: 50%;
             bottom: 24px;
             width: 13px;
             height: 82px;
             transform: translateX(-50%);
             border-radius: 999px;
             background: linear-gradient(180deg, #c18b83, #904951);
             box-shadow: 0 8px 18px rgba(144, 73, 81, 0.18);
         }

         .mini-tree-branch {
             position: absolute;
             height: 5px;
             border-radius: 999px;
             background: linear-gradient(90deg, #c18b83, #aa646d);
             transform-origin: left center;
         }

         .mini-tree-branch.branch-left-top {
             width: 62px;
             left: 50%;
             bottom: 88px;
             transform: translateX(-6px) rotate(-36deg);
         }

         .mini-tree-branch.branch-right-top {
             width: 68px;
             left: 50%;
             bottom: 96px;
             transform: translateX(4px) rotate(30deg);
         }

         .mini-tree-branch.branch-left-bottom {
             width: 54px;
             left: 50%;
             bottom: 64px;
             transform: translateX(-6px) rotate(-18deg);
         }

         .mini-tree-node {
             position: absolute;
             width: 34px;
             height: 34px;
             border-radius: 50%;
             display: flex;
             align-items: center;
             justify-content: center;
             font-size: 16px;
             background: rgba(255, 255, 255, 0.95);
             border: 1px solid rgba(144, 73, 81, 0.12);
             box-shadow: 0 10px 20px rgba(75, 64, 57, 0.08);
         }

         .mini-tree-node.node-root {
             left: 50%;
             bottom: 16px;
             transform: translateX(-50%);
             background: linear-gradient(135deg, #fff1f2, #ffffff);
         }

         .mini-tree-node.node-left-top {
             left: 58px;
             top: 24px;
         }

         .mini-tree-node.node-right-top {
             right: 40px;
             top: 18px;
         }

         .mini-tree-node.node-left-bottom {
             left: 38px;
             top: 88px;
         }

         .mini-tree-note {
             position: absolute;
             display: inline-flex;
             align-items: center;
             min-height: 24px;
             padding: 0 9px;
             border-radius: 999px;
             background: rgba(255, 255, 255, 0.82);
             border: 1px solid rgba(144, 73, 81, 0.08);
             color: var(--primary);
             font-size: 10px;
             font-weight: 800;
             box-shadow: 0 8px 18px rgba(75, 64, 57, 0.06);
         }

         .mini-tree-note.note-first {
             left: 74px;
             bottom: 18px;
         }

         .mini-tree-note.note-grow {
             right: 18px;
             top: 76px;
             color: #6b7f58;
         }

         .mini-tree-summary {
             display: flex;
             justify-content: space-between;
             align-items: center;
             margin-top: 12px;
             font-size: 11px;
             color: var(--on-surface-variant);
             font-weight: 700;
         }

         .mini-tree-tag {
             padding: 5px 10px;
             border-radius: 999px;
             background: rgba(144, 73, 81, 0.08);
             color: var(--primary);
         }

          /* Mobile adjustments */
          @media (max-width: 1024px) {
              .features-grid {
                  grid-template-columns: repeat(2, 1fr);
              }
          }

          @media (max-width: 768px) {
              .hero-section {
                  flex-direction: column;
                  padding: 100px 24px 60px;
                  text-align: center;
              }

              .hero-content {
                  max-width: 100%;
                  margin-right: 0;
                  align-items: center;
              }

              .hero-visual {
                  position: relative;
                  right: auto;
                  top: auto;
                  transform: none;
                  width: 100%;
                  max-width: 400px;
                  margin-top: 28px;
              }

              .hero-title {
                  font-size: 2.5rem;
              }

              .features-grid {
                  grid-template-columns: 1fr;
              }

              .love-tree-svg {
                  max-height: 350px;
              }

              .hero-visual .memory-card-mini {
                  left: 50% !important;
                  right: auto !important;
                  top: 12% !important;
                  transform: translateX(-50%) !important;
              }

              .hero-cta-btn {
                  width: 100%;
                  max-width: 320px;
              }

              .hero-flow,
              .hero-cta-group {
                  justify-content: center;
              }

              .hero-support-note {
                  justify-content: center;
                  text-align: center;
              }
          }
     </style>
</head>
<body class="bokeh-bg">
    <div class="noise-overlay"></div>
    
    <div class="landing-wrapper">

                <h1 class="hero-title" data-i18n="home.heroTitle" data-i18n-html>사랑하는 것의<br><span>모든 순간이 하나의 나무가 된다</span></h1>
                <p class="hero-desc" data-i18n="home.heroSubtitle">
                    입덕의 첫 설렘, 가장 감동했던 그 장면, 그리고 지금 이 순간까지.
                    당신이 느낀 감정의 결을 남기고, 하나의 나무로 완성하세요.
                </p>
                <p class="hero-support-note">
                    <span class="hero-support-note-emoji" aria-hidden="true">🌱</span>
                    <span>러브트리는 좋아하는 것의 감정을 기록하는 공간입니다</span>

                <div class="hero-flow" aria-label="시작 흐름 안내">
                    <span class="hero-flow-step"><span class="hero-flow-step-index">1</span><span class="hero-flow-step-text" data-i18n="home.flow.one">로그인하고</span></span>
                    <span class="hero-flow-step"><span class="hero-flow-step-index">2</span><span class="hero-flow-step-text" data-i18n="home.flow.two">첫 순간 남기기</span></span>
                    <span class="hero-flow-step"><span class="hero-flow-step-index">3</span><span class="hero-flow-step-text" data-i18n="home.flow.three">내 트리로 이어가기</span></span>
                </div>
                <div class="hero-cta-group">
                    <a href="pages/login.html?redirect=my-trees.html" class="btn-round btn-primary hero-cta-btn" data-i18n="home.cta.start">나의 첫 러브트리 만들기</a>
                    <a href="pages/search.html" class="btn-round btn-outline hero-cta-btn" data-i18n="home.cta.browse">예시 트리 보기</a>
                </div>
                <p class="hero-support-copy" data-i18n="home.supportCopy">
                    로그인 후 바로 내 트리에서 시작할 수 있어요. 예시 트리는 둘러보기에서 먼저 볼 수 있어요.
                </p>
            </div>

            <div class="hero-visual" aria-hidden="true">

                <svg class="love-tree-svg" viewBox="0 0 500 600">
                    <!-- 정의: 그라데이션 및 필터 -->

                            <stop offset="0%" style="stop-color:#904951;stop-opacity:1" />
