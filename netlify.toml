# LEGACY ARTIFACT - NOT ACTIVE RUNTIME
# This file is retained for historical Netlify Functions reference only.
# Current active runtime: Cloudflare Pages Functions -> Modal.
# Official production entry: https://lovebud.pages.dev/
# Do not add new backend routes or feature policy here unless Netlify runtime is explicitly reactivated by CTO.
# See docs/ops/OPERATIONS.md for the current runtime hierarchy.

[build]
command = ""
publish = "."
env_file = ".env"

[functions]
directory = "netlify/functions"

# ── API Routes (must come BEFORE SPA fallback) ────────────────────────────────

# Trees
[[redirects]]
from = "/api/trees"
to = "/.netlify/functions/trees"
status = 200

[[redirects]]
from = "/api/trees/:treeId"
to = "/.netlify/functions/tree-detail"
status = 200

# Memories
[[redirects]]
from = "/api/memories"
to = "/.netlify/functions/memories"
status = 200

[[redirects]]
from = "/api/memories/:memoryId"
to = "/.netlify/functions/memory-detail"
status = 200

# Community
[[redirects]]
from = "/api/community/trees"
to = "/.netlify/functions/community-trees"
status = 200

[[redirects]]
from = "/api/community/memories"
to = "/.netlify/functions/community-memories"
status = 200

# ── Static page aliases (root -> /pages) ────────────────────────────────────
[[redirects]]
from = "/intro.html"
to = "/pages/intro.html"
status = 200

[[redirects]]
from = "/login.html"
to = "/pages/login.html"
status = 200

[[redirects]]
from = "/search.html"
to = "/pages/search.html"
status = 200

[[redirects]]
from = "/detail.html"
to = "/pages/detail.html"
status = 200

[[redirects]]
from = "/editor.html"
to = "/pages/editor.html"
status = 200

[[redirects]]
from = "/my-trees.html"
to = "/pages/my-trees.html"
status = 200

# ── Static multipage app: no global SPA fallback ─────────────────────────────
# LoveBud currently serves explicit HTML pages under /pages.
# Invalid paths should surface as 404s instead of silently falling back to /index.html.
