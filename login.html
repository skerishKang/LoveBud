<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | Lovetree</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" />
    <style>
        .login-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-card {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 64px;
            border-radius: 3rem;
            box-shadow: 0 40px 100px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .login-btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: white;
            border: 1px solid var(--outline-variant);
            padding: 16px;
            border-radius: 1.25rem;
            font-weight: 700;
            font-family: var(--font-heading);
            cursor: pointer;
            margin-bottom: 24px;
            transition: all 0.3s;
        }

        .login-btn-google:hover { 
            background: #f8f9fa; 
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #aaa;
            font-size: 11px;
            font-weight: 800;
            margin: 32px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .login-divider::before, .login-divider::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background: var(--outline-variant);
        }

        .badge-group {
            margin-top: 48px;
            padding-top: 32px;
            border-top: 1px solid var(--outline-variant);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .badge {
            font-size: 11px;
            font-weight: 800;
            padding: 6px 14px;
            background: var(--surface-container-low);
            color: var(--on-surface-variant);
            border-radius: 99px;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bokeh-bg">
    <div class="noise-overlay"></div>
    
    <div class="login-shell">
        <div class="login-card">
            <div class="serif" style="font-size: 2.2rem; font-weight: 950; color: var(--on-surface); margin-bottom: 12px; font-family: var(--font-heading); letter-spacing: -0.05em;">Lovetree</div>
            <h1 class="headline" style="font-size: 1.5rem; color: var(--primary); margin-bottom: 16px; font-weight: 800;">다시, 기록할 시간</h1>
            <p style="color: var(--on-surface-variant); margin-bottom: 48px; font-size: 1rem; line-height: 1.6; font-weight: 400;">
                흩어진 순간들을 모아 하나의 나무로 완성하세요.<br>
                로그인하면 모든 기록이 안전하게 보관됩니다.
            </p>

            <button class="login-btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/btn_google_light_normal_ios.svg" alt="Google" style="width: 20px;">
                구글 계정으로 시작하기
            </button>

            <div class="login-divider">또는 이메일 계속</div>

            <button class="btn-round btn-outline" style="width: 100%; border-radius: 1.25rem; padding: 16px; font-size: 15px;">
                이메일 주소로 계속하기
            </button>

            <div class="badge-group">
                <span class="badge">기억의 영구 보존</span>
                <span class="badge">트리 동기화</span>
                <span class="badge">비밀 기록 관리</span>
            </div>

            <a href="index.html" style="display: block; margin-top: 40px; color: var(--on-surface-variant); font-size: 13px; text-decoration: none; font-weight: 700; opacity: 0.6; transition: opacity 0.3s;">
                나중에 기록할게요 (홈으로)
            </a>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
