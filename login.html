<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | Lovetree</title>
    <link rel="stylesheet" href="css/global.css?v=20260415-7">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" />
    <style>
        .login-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 120px 48px 80px;
        }

        .login-card {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 64px;
            border-radius: 3rem;
            box-shadow: 0 40px 100px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .login-btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: white;
            border: 1px solid var(--outline-variant);
            padding: 16px;
            border-radius: 1.25rem;
            font-weight: 700;
            font-family: var(--font-heading);
            cursor: pointer;
            margin-bottom: 24px;
            transition: all 0.3s;
        }

        .login-btn-google:hover { 
            background: #f8f9fa; 
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #aaa;
            font-size: 11px;
            font-weight: 800;
            margin: 32px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .login-divider::before, .login-divider::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background: var(--outline-variant);
        }

        .badge-group {
            margin-top: 48px;
            padding-top: 32px;
            border-top: 1px solid var(--outline-variant);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .badge {
            font-size: 11px;
            font-weight: 800;
            padding: 6px 14px;
            background: var(--surface-container-low);
            color: var(--on-surface-variant);
            border-radius: 99px;
            text-transform: uppercase;
        }

        /* User dropdown menu */
        .user-dropdown {
            position: relative;
            display: inline-block;
        }

        .user-dropdown-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 99px;
            transition: all 0.2s;
        }

        .user-dropdown-trigger:hover {
            background: var(--surface-container-low);
        }

        .user-dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            border: 1px solid var(--outline-variant);
            min-width: 200px;
            z-index: 1000;
            display: none;
            overflow: hidden;
        }

        .user-dropdown-menu.show {
            display: block;
        }

        .user-dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--on-surface);
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            width: 100%;
            text-align: left;
            border: none;
            background: none;
        }

        .user-dropdown-item:hover {
            background: var(--surface-container-low);
        }

        .user-dropdown-item .material-symbols-outlined {
            font-size: 18px;
            color: var(--on-surface-variant);
        }

        .dropdown-divider {
            height: 1px;
            background: var(--outline-variant);
            margin: 4px 0;
        }

        @media (max-width: 768px) {
            .login-shell {
                padding: 24px;
            }

            .login-card {
                padding: 40px 24px;
            }
        }
    </style>
</head>
<body class="bokeh-bg">
    <div class="noise-overlay"></div>
    
    <!-- Unified Header (match app pages) -->
    <header class="nav-bar">
        <div class="headline" style="font-size: 1.5rem; font-weight: 900; color: var(--on-surface); letter-spacing: -0.04em; cursor: pointer;" onclick="location.href='index.html'">Lovetree</div>
        
        <nav class="main-nav">
                <div class="nav-links">
                    <a href="index.html">소개</a>
                    <a href="search.html">둘러보기</a>
                    <a href="editor.html">내 러브트리</a>
                </div>

            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="lang-toggle">
                    <button class="lang-btn active">KR</button>
                    <button class="lang-btn">EN</button>
                </div>
                <!-- User menu / login button will be injected here by auth.js -->
                <div id="auth-nav-container"></div>
            </div>
        </nav>
    </header>

    <div class="login-shell">
        <div class="login-card">
            <div class="serif" style="font-size: 2.2rem; font-weight: 950; color: var(--on-surface); margin-bottom: 12px; font-family: var(--font-heading); letter-spacing: -0.05em;">Lovetree</div>
            <h1 class="headline" style="font-size: 1.5rem; color: var(--primary); margin-bottom: 16px; font-weight: 800;">당신의 감정 나무를 시작하세요</h1>
            <p style="color: var(--on-surface-variant); margin-bottom: 48px; font-size: 1rem; line-height: 1.6; font-weight: 400;">
                처음 사랑에 빠진 순간부터, 팬이 되어가는 모든 경로를<br>
                영상과 메모로 연결해 기록하세요.
            </p>

            <button id="login-btn-google" class="login-btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/btn_google_light_normal_ios.svg" alt="Google" style="width: 20px;">
                Google로 시작하기
            </button>

            <div class="login-divider">또는 이메일로 시작하기</div>

            <button id="login-btn-email" class="btn-round btn-outline" style="width: 100%; border-radius: 1.25rem; padding: 16px; font-size: 15px;">
                이메일로 시작하기
            </button>

            <div class="badge-group">
                <span class="badge">첫 순간 기록</span>
                <span class="badge">감정 나무 성장</span>
                <span class="badge">안전한 보관</span>
            </div>

            <a href="index.html" style="display: block; margin-top: 40px; color: var(--on-surface-variant); font-size: 13px; text-decoration: none; font-weight: 700; opacity: 0.6; transition: opacity 0.3s;">
                나중에 시작하기
            </a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="js/firebase-config.js?v=20260415-7"></script>

    <!-- Email Auth Modal -->
    <div id="email-auth-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:white;border-radius:2rem;padding:48px;max-width:420px;width:90%;text-align:center;position:relative;">
    <button id="email-auth-close" style="position:absolute;top:16px;right:20px;background:none;border:none;font-size:24px;cursor:pointer;color:#aaa;">&times;</button>
    <h2 id="email-auth-title" style="font-size:1.4rem;font-weight:900;margin-bottom:8px;">이메일로 로그인</h2>
    <p id="email-auth-helper" style="color:#888;margin-bottom:24px;font-size:0.9rem;">이미 만든 이메일 계정으로 로그인합니다</p>
<form id="email-auth-form" style="text-align:left;">
<div style="margin-bottom:16px;">
<label style="font-size:12px;font-weight:700;color:#666;display:block;margin-bottom:6px;">이메일 주소</label>
<input type="email" id="email-auth-email" placeholder="example@mail.com" required style="width:100%;padding:12px 16px;border:1px solid #e0e0e0;border-radius:0.75rem;font-size:1rem;box-sizing:border-box;">
</div>
<div style="margin-bottom:24px;">
<label style="font-size:12px;font-weight:700;color:#666;display:block;margin-bottom:6px;">비밀번호</label>
<input type="password" id="email-auth-password" placeholder="••••••" required style="width:100%;padding:12px 16px;border:1px solid #e0e0e0;border-radius:0.75rem;font-size:1rem;box-sizing:border-box;">
</div>
<button type="submit" id="email-auth-submit" style="width:100%;padding:14px;background:var(--primary);color:white;border:none;border-radius:1rem;font-weight:700;font-size:1rem;cursor:pointer;">로그인</button>
</form>
<button id="email-auth-toggle" style="margin-top:20px;background:none;border:none;color:var(--primary);font-weight:700;font-size:0.9rem;cursor:pointer;text-decoration:underline;">계정이 없나요? 회원가입으로 전환</button>
</div>
</div>

    <script src="js/auth.js?v=20260415-12"></script>
</body>
</html>
