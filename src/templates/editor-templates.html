<!-- Editor HTML - Static Templates Extraction -->
<!-- Extracted from editor.html for slimming -->

<!-- Moment Card Template -->
<template id="moment-card-template">
  <div class="moment-card memory-node" data-node-id="">
    <div class="moment-header">
      <span class="moment-title"></span>
      <button class="moment-menu-btn">⋮</button>
    </div>
    <div class="moment-content">
      <img class="moment-thumbnail" src="" alt="" style="display:none">
      <div class="moment-memo"></div>
    </div>
  </div>
</template>

<!-- Tree Node Template -->
<template id="tree-node-template">
  <div class="tree-node" data-node-id="">
    <div class="node-content">
      <span class="node-title"></span>
      <span class="node-children-count"></span>
    </div>
    <div class="node-children"></div>
  </div>
</template>

<!-- Context Menu Template -->
<template id="context-menu-template">
  <div class="context-menu" style="display:none">
    <button data-action="edit">Edit</button>
    <button data-action="delete">Delete</button>
    <button data-action="duplicate">Duplicate</button>
  </div>
</template>
