# Issue #4148 / #4082 — NONPROD reliability-preview Wrangler contract (source publication only).
#
# SOURCE PUBLICATION ONLY. Publishing this file does NOT deploy a Worker, does
# NOT activate Cron, does NOT provision a Durable Object namespace, does NOT
# create a Slack webhook, and does NOT place any secret value.
#
# Current Cloudflare Wrangler lifecycle contract for a new SQLite Durable
# Object: declare it via [env.<name>.exports.<ClassName>] with storage="sqlite"
# and bind it via [[env.<name>.durable_objects.bindings]]. Legacy
# [[env.<name>.migrations]] are intentionally NOT used together with exports
# (exports and migrations are mutually exclusive; a config carrying both is
# rejected at validation). A first deployment of the live exports entry
# provisions the namespace. Current Cloudflare semantics also reject
# `wrangler versions upload` when `exports` entries are present: lifecycle
# changes must be applied through `wrangler deploy`.
#
# #4225 correction — provider resource creation and Cron attachment remain
# SEPARATE owner gates. A normal `wrangler deploy` applies the config's Cron
# state, so the checked-in base NONPROD config MUST explicitly declare
# `crons = []`. Omitting `triggers`/`crons` is not equivalent: undefined leaves
# previously deployed Cron Triggers in place. The future */5 schedule may only
# be attached after a separate owner approval and must not be committed as the
# base deployment state.
#
# Corrected Provider Preview ladder:
#
#   1. source validation ............ focused tests + pinned-Wrangler
#                                     `deploy --dry-run --outdir <temp>` only
#   2. disabled Provider deploy ..... owner-approved `wrangler deploy` using
#                                     this config; SQLite DO lifecycle may be
#                                     provisioned, but `crons = []`, read-only
#                                     sentinel OFF, alert OFF, no Production DB
#                                     credential, no synthetic capability
#   3. disabled Provider evidence ... prove Worker/DO initialization, fetch 404,
#                                     and zero read capability while sentinel OFF
#   4. Cron attachment .............. separate owner-approved trigger/config
#                                     change to `*/5 * * * *`; never implied by
#                                     stage 2
#   5. read-only sentinel ........... separate approval for
#                                     RELIABILITY_READ_ONLY_SENTINEL_ENABLED=true
#   6. alert delivery ............... separate provider/secret approval plus
#                                     RELIABILITY_ALERT_DELIVERY_ENABLED=true
#   7. Production ................... explicit owner/Web-CTO authority only
#
# Do NOT use `wrangler versions upload` for this `exports`-based configuration.
# Release provenance remains externally injected through
# RELIABILITY_PREVIEW_RELEASE_SHA (exact 40-hex full deployed revision) and
# invalid provenance fails closed before any capability use.
#
# Refs #4148/#4149. Refs #4082. Refs #4175. Refs #4225.
# Refs #3461 — Keep OPEN. Refs #1882 — Keep OPEN.

name = "lovebud"
main = "reliability-preview-worker.mjs"
compatibility_date = "2025-05-01"

[env.reliability-preview]
# Dedicated NONPROD Worker identity. Explicitly named so the deployed Worker is
# exactly "lovebud-reliability-preview" (no duplicated suffix), independent of
# the top-level name + environment-key append rule.
name = "lovebud-reliability-preview"

# Dedicated SQLite Durable Object, declared with the current exports model.
[env.reliability-preview.exports.ReliabilityPreviewStore]
type = "durable-object"
storage = "sqlite"

# Environment-specific binding to the SQLite Durable Object class.
[[env.reliability-preview.durable_objects.bindings]]
name = "RELIABILITY_PREVIEW_STORE"
class_name = "ReliabilityPreviewStore"

# Fail-closed base Provider deployment state (#4225). A normal Wrangler deploy
# replaces Cron Triggers with this array, so explicit [] guarantees the initial
# disabled NONPROD Worker/DO deployment cannot silently attach a schedule.
# The future `*/5 * * * *` Cron requires a separate owner-approved mutation.
[env.reliability-preview.triggers]
crons = []

# Workers Logs observability (current schema: [observability] enabled +
# optional head_sampling_rate 0..1, default 1). DECLARATION ONLY — it takes
# effect only if/when a separately approved deployment occurs.
[env.reliability-preview.observability]
enabled = true
head_sampling_rate = 1
