<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | Lovetree</title>
    <link rel="stylesheet" href="../css/global.css?v=20260415-10">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" />
    <style>
        .login-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 120px 48px 80px;
        }

        .login-card {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 64px;
            border-radius: 3rem;
            box-shadow: 0 40px 100px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .login-btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: white;
            border: 1px solid var(--outline-variant);
            padding: 16px;
            border-radius: 1.25rem;
            font-weight: 700;
            font-family: var(--font-heading);
            cursor: pointer;
            margin-bottom: 24px;
            transition: all 0.3s;
        }

        .login-btn-google:hover { 
            background: #f8f9fa; 
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--on-surface-variant);
            opacity: 0.6;
            font-size: 11px;
            font-weight: 800;
            margin: 32px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .login-divider::before, .login-divider::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background: var(--outline-variant);
        }

        .badge-group {
            margin-top: 48px;
            padding-top: 32px;
            border-top: 1px solid var(--outline-variant);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .badge {
            font-size: 11px;
            font-weight: 800;
            padding: 6px 14px;
            background: var(--surface-container-low);
            color: var(--on-surface-variant);
            border-radius: 99px;
            text-transform: uppercase;
        }

        /* User dropdown menu */
        .user-dropdown {
            position: relative;
            display: inline-block;
        }

        .user-dropdown-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 99px;
            transition: all 0.2s;
        }

        .user-dropdown-trigger:hover {
            background: var(--surface-container-low);
        }

        .user-dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            border: 1px solid var(--outline-variant);
            min-width: 200px;
            z-index: 1000;
            display: none;
            overflow: hidden;
        }

        .user-dropdown-menu.show {
            display: block;
        }

        .user-dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--on-surface);
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            width: 100%;
            text-align: left;
            border: none;
            background: none;
        }

        .user-dropdown-item:hover {
            background: var(--surface-container-low);
        }

        .user-dropdown-item .material-symbols-outlined {
            font-size: 18px;
            color: var(--on-surface-variant);
        }

        .dropdown-divider {
            height: 1px;
            background: var(--outline-variant);
            margin: 4px 0;
        }

        @media (max-width: 768px) {
            .login-shell {
                padding: 24px;
            }

            .login-card {
                padding: 40px 24px;
            }
        }
    </style>
</head>
<body class="bokeh-bg">
    <div class="noise-overlay"></div>
    
    <!-- Shared Header -->
    <div id="shared-header"></div>

    <div class="login-shell">
        <div class="login-card">
            <!-- Redirect notice: shown when user came from auth-gated page -->
            <div id="redirect-notice" style="display:none; background:rgba(144,73,81,0.08); border:1px solid rgba(144,73,81,0.15); border-radius:1rem; padding:20px; margin-bottom:32px; text-align:left;">
                <div style="display:flex; align-items:flex-start; gap:12px;">
                    <span style="font-size:20px; flex-shrink:0;">🔒</span>
                    <div>
                        <div style="font-weight:800; color:var(--primary); font-size:14px; margin-bottom:4px;" data-i18n="redirect_notice_title">내 러브트리를 이용하려면 로그인이 필요합니다</div>
                        <div style="color:var(--on-surface-variant); font-size:13px; line-height:1.5;" data-i18n="redirect_notice_desc">로그인 후 자동으로 이동합니다</div>
                    </div>
                </div>
            </div>
            
            <div class="serif" style="font-size: 2.2rem; font-weight: 950; color: var(--on-surface); margin-bottom: 12px; font-family: var(--font-heading); letter-spacing: -0.05em;">Lovetree</div>
            <h1 class="headline" style="font-size: 1.5rem; color: var(--primary); margin-bottom: 16px; font-weight: 800;" data-i18n="login_title">당신의 감정 나무를 시작하세요</h1>
            <p style="color: var(--on-surface-variant); margin-bottom: 48px; font-size: 1rem; line-height: 1.6; font-weight: 400;" data-i18n="login_desc">
                처음 사랑에 빠진 순간부터, 팬이 되어가는 모든 경로를<br>
                영상과 메모로 연결해 기록하세요.
            </p>

            <button id="login-btn-google" class="login-btn-google">
                <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" style="width: 20px; height: 20px;">
                    <path fill="#4285F4" d="M45.12,24.5c0-2.46-0.2-4.84-0.64-7.12l-14.54,0c0.24,1.08,0.4,2.2,0.4,3.4c0,5.6-3.8,10.8-10.8,10.8l-8.72,0c-6.48,0-11.76-5.28-11.76-11.76c0-6.4,5.2-11.64,11.64-11.64c2.96,0,5.56,1.12,7.6,2.96l6.24-6.16C29.32,6.56,24.36,5.72,19.04,5.72c-9.36,0-17.52,6.76-17.52,16.08c0,9.28,8.16,16.08,17.52,16.08c6.8,0,11.52-3.28,14.36-7.96c0.76,0.08,1.56,0.12,2.4,0.12C42.4,29.92,45.12,27.56,45.12,24.5z"/>
                    <path fill="#34A853" d="M19.12,44.36c6.56,0,12.16-2.44,16.24-6.56l-7.68-5.92C25.24,34.8,22.52,36,19.12,36c-6.08,0-10.8-4.16-12.48-9.76l-7.76,0C3.48,31.96,10.64,44.36,19.12,44.36z"/>
                    <path fill="#FBBC05" d="M9.84,26.68c-1.56-2.92-2.4-6.08-2.4-9.48c0-3.4,0.84-6.56,2.4-9.48L3.2,12.08C1.24,16.52,0.04,21.48,0.04,26.32C0.04,31.16,1.24,36.12,3.2,40.56L9.84,26.68z"/>
                    <path fill="#EA4335" d="M19.12,12.32c4.76,0,8.24,1.92,10.04,3.56l7.24-7.16C34.76,5.92,29.32,4.8,23.72,4.8c-7.4,0-14,4.4-17.6,10.96l7.76,6.44C15.48,16.84,18.32,12.32,19.12,12.32z"/>
                </svg>
                <span data-i18n="google_login">Google로 시작하기</span>
            </button>

            <div class="login-divider" data-i18n="or_email">또는 이메일로 시작하기</div>

            <button id="login-btn-email" class="btn-round btn-outline" style="width: 100%; border-radius: 1.25rem; padding: 16px; font-size: 15px;" data-i18n="email_login">
                이메일로 시작하기
            </button>

            <div class="badge-group">
                <span class="badge" data-i18n="badge_first_moment">첫 순간 기록</span>
                <span class="badge" data-i18n="badge_tree_grow">감정 나무 성장</span>
                <span class="badge" data-i18n="badge_safe">안전한 보관</span>
            </div>

            <a href="index.html" style="display: block; margin-top: 40px; color: var(--on-surface-variant); font-size: 13px; text-decoration: none; font-weight: 700; opacity: 0.6; transition: opacity 0.3s;" data-i18n="later">
                나중에 시작하기
            </a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="../js/firebase-config.js?v=20260417-31"></script>

    <!-- Email Auth Modal -->
    <div id="email-auth-modal" role="dialog" aria-modal="true" aria-labelledby="email-auth-title" aria-describedby="email-auth-helper" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:white;border-radius:2rem;padding:48px;max-width:420px;width:90%;text-align:center;position:relative;">
    <button id="email-auth-close" aria-label="모달 닫기" style="position:absolute;top:16px;right:20px;background:none;border:none;font-size:24px;cursor:pointer;color:var(--on-surface-variant);opacity:0.6;">&times;</button>
    <h2 id="email-auth-title" style="font-size:1.4rem;font-weight:900;margin-bottom:8px;" data-i18n="email_modal_title_login">이메일로 로그인</h2>
    <p id="email-auth-helper" style="color:var(--on-surface-variant);margin-bottom:24px;font-size:0.9rem;" data-i18n="email_modal_desc_login">이미 만든 이메일 계정으로 로그인합니다</p>
<form id="email-auth-form" style="text-align:left;" novalidate>
<div style="margin-bottom:16px;">
    <label for="email-auth-email" style="display:block;margin-bottom:6px;font-weight:700;font-size:0.85rem;" data-i18n="email_label">이메일</label>
    <input type="email" id="email-auth-email" required style="width:100%;padding:12px;border:1px solid var(--outline-variant);border-radius:0.75rem;font-size:1rem;">
</div>
<div style="margin-bottom:20px;">
    <label for="email-auth-password" style="display:block;margin-bottom:6px;font-weight:700;font-size:0.85rem;" data-i18n="password_label">비밀번호</label>
    <input type="password" id="email-auth-password" required style="width:100%;padding:12px;border:1px solid var(--outline-variant);border-radius:0.75rem;font-size:1rem;">
</div>
<button type="submit" id="email-auth-submit" style="width:100%;padding:14px;background:var(--primary);color:white;border:none;border-radius:1rem;font-weight:700;font-size:1rem;cursor:pointer;" data-i18n="login_btn">로그인</button>
</form>
<button id="email-auth-toggle" style="margin-top:20px;background:none;border:none;color:var(--primary);font-weight:700;font-size:0.9rem;cursor:pointer;text-decoration:underline;" data-i18n="switch_to_signup">계정이 없나요? 회원가입으로 전환</button>
</div>
</div>

    <script src="../js/i18n.js?v=20260417-31"></script>
    <script src="../js/shared-header.js?v=20260417-31"></script>
    <script src="../js/auth.js?v=20260417-31"></script>
    <script>
        // i18n 초기화 및 헤더 렌더링
        renderSharedHeader();
        
        // Show redirect notice if user came from auth-gated page
        (function() {
            var params = new URLSearchParams(window.location.search);
            var redirect = params.get('redirect');
            if (redirect) {
                var noticeEl = document.getElementById('redirect-notice');
                if (noticeEl) {
                    noticeEl.style.display = 'block';
                }
            }
        })();
        
        // 저장된 언어 불러와 적용
        document.addEventListener('DOMContentLoaded', function() {
            if (window.applyI18n) window.applyI18n();
            
            // 저장된 언어로 드롭다운 상태 동기화
            var currentLang = window.getCurrentLang ? window.getCurrentLang() : 'ko';
            var langBtn = document.querySelector('.lang-option[data-lang="' + (currentLang === 'ko' ? 'KR' : 'EN') + '"]');
            if (langBtn) {
                document.querySelectorAll('.lang-option').forEach(function(o) { o.classList.remove('active'); });
                langBtn.classList.add('active');
            }
        });
        
        // 언어 변경 시 재적용
        if (window.onLangChange) {
            window.onLangChange(function(lang) {
                if (window.applyI18n) window.applyI18n();
            });
        }
        
        // 모달 로그인/회원가입 토글 시 번역 키 교체
        var emailToggleBtn = document.getElementById('email-auth-toggle');
        if (emailToggleBtn) {
            emailToggleBtn.addEventListener('click', function() {
                setTimeout(function() {
                    var isSignup = EMAIL_AUTH_MODE === 'signup';
                    var titleEl = document.getElementById('email-auth-title');
                    var helperEl = document.getElementById('email-auth-helper');
                    var submitBtn = document.getElementById('email-auth-submit');
                    var toggleBtn = document.getElementById('email-auth-toggle');
                    
                    if (titleEl) titleEl.setAttribute('data-i18n', isSignup ? 'email_modal_title_signup' : 'email_modal_title_login');
                    if (helperEl) helperEl.setAttribute('data-i18n', isSignup ? 'email_modal_desc_signup' : 'email_modal_desc_login');
                    if (submitBtn) submitBtn.setAttribute('data-i18n', isSignup ? 'signup_btn' : 'login_btn');
                    if (toggleBtn) toggleBtn.setAttribute('data-i18n', isSignup ? 'switch_to_login' : 'switch_to_signup');
                    
                    if (window.applyI18n) window.applyI18n();
                }, 50);
            });
        }
    </script>
</body>
</html>
