<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 트리 | LoveTree v3</title>
    <link rel="stylesheet" href="../../css/gemini-v3/index.css">
    <style>
        .my-trees-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: calc(850px - 90px);
            overflow: hidden;
        }

        /* Profile Sidebar */
        .profile-v3-sidebar {
            background: #FDF9F5;
            padding: 60px 40px;
            border-right: 1px solid rgba(179, 126, 111, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: var(--gv3-shadow-paper);
        }

        .profile-name {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .profile-stats {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            width: 100%;
        }

        .stat-card {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: var(--gv3-shadow-paper);
        }

        .stat-value { font-size: 22px; font-weight: 900; color: var(--gv3-primary); }
        .stat-label { font-size: 11px; opacity: 0.5; font-weight: 800; margin-top: 5px; }

        /* Tree Grid Area */
        .trees-grid-area {
            padding: 60px;
            overflow-y: auto;
        }

        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 45px;
        }

        .trees-grid-v3 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 40px;
        }

        .tree-cover-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--gv3-shadow-paper);
            transition: all 0.4s var(--gv3-ease-out);
            cursor: pointer;
            position: relative;
        }

        .tree-cover-card:hover { transform: translateY(-10px); box-shadow: var(--gv3-shadow-deep); }

        .cover-visual {
            width: 100%;
            aspect-ratio: 1;
            background: #FDF9F5;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            overflow: hidden;
        }

        .cover-visual img { width: 100%; height: 100%; object-fit: cover; }

        .tree-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 900; margin-bottom: 10px; }
        .tree-count { font-size: 12px; opacity: 0.5; font-weight: 700; }

        .add-tree-card {
            border: 2px dashed #F0EAE8;
            background: transparent;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--gv3-text-muted);
        }
        .add-tree-card:hover { border-color: var(--gv3-primary); }
    </style>
</head>
<body>
    <div class="canvas-v3">
        <header class="header-v3">
            <a href="index.html" class="logo-v3">LoveTree</a>
            <nav class="nav-v3">
                <a href="index.html" class="v3-nav-link">첫 화면</a>
                <a href="search.html" class="v3-nav-link">둘러보기</a>
                <a href="my-trees.html" class="v3-nav-link" style="opacity: 1;">나의 트리</a>
            </nav>
            <a href="../login.html" class="btn-v3 btn-primary" style="padding: 10px 30px; font-size: 14px;">로그아웃</a>
        </header>

        <div class="my-trees-layout">
            <aside class="profile-v3-sidebar">
                <div class="profile-img">🌸</div>
                <h2 class="profile-name">LoveBud</h2>
                <p style="font-size: 14px; color: var(--gv3-text-muted);">@lovebud_official</p>
                
                <div class="profile-stats">
                    <div class="stat-card">
                        <div class="stat-value">6</div>
                        <div class="stat-label">TREES</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">42</div>
                        <div class="stat-label">MOMENTS</div>
                    </div>
                </div>

                <div style="margin-top: auto; width: 100%;">
                    <a href="search.html" class="btn-v3" style="width: 100%; border: 1.5px solid #F0EAE8; font-size: 13px;">둘러보기</a>
                </div>
            </aside>

            <main class="trees-grid-area">
                <div class="grid-header">
                    <h1 class="profile-name" style="font-size: 32px;">나의 트리에 오신 걸 환영합니다</h1>
                    <a href="#" class="btn-v3 btn-primary" style="padding: 12px 25px; font-size: 13px;">+ 새 트리 만들기</a>
                </div>

                <div class="trees-grid-v3">
                    <article class="tree-cover-card" onclick="location.href='detail.html'">
                        <div class="cover-visual">
                            <img src="https://images.unsplash.com/photo-1542332213-9b5a5a3fad35?auto=format&fit=crop&q=80&w=400" alt="Cover">
                        </div>
                        <h3 class="tree-title">보랏빛 순간</h3>
                        <p class="tree-count">12개의 순간 · 7일 전 업데이트</p>
                    </article>

                    <article class="tree-cover-card">
                        <div class="cover-visual">
                            <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&q=80&w=400" alt="Cover">
                        </div>
                        <h3 class="tree-title">빛나던 무대</h3>
                        <p class="tree-count">8개의 순간 · 2주 전 업데이트</p>
                    </article>

                    <article class="tree-cover-card add-tree-card">
                        <div style="font-size: 40px; margin-bottom: 15px; opacity: 0.3;">➕</div>
                        <p style="font-size: 14px; font-weight: 700; opacity: 0.5;">새로운 기록 시작하기</p>
                    </article>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
