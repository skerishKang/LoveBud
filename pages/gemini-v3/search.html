<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>둘러보기 | LoveTree v3</title>
    <link rel="stylesheet" href="../../css/gemini-v3/index.css">
    <link rel="stylesheet" href="../../css/gemini-v3/search.css">
</head>
<body>
    <div class="canvas-v3">
        <header class="header-v3" style="border-bottom: 1px solid rgba(179, 126, 111, 0.05);">
            <a href="index.html" class="logo-v3">LoveTree</a>
            <nav class="nav-v3">
                <a href="index.html" class="nav-link-v3">첫 화면</a>
                <a href="intro.html" class="nav-link-v3">LoveTree 소개</a>
                <a href="search.html" class="nav-link-v3">둘러보기</a>
                <a href="../my-trees.html" class="nav-link-v3">나의 트리</a>
            </nav>
            <a href="../login.html" class="btn-v3" style="padding: 10px 24px; border: 1.5px solid #B37E6F; color: #B37E6F;">로그인</a>
        </header>

        <div class="search-v3-layout">
            <main class="browse-v3-area">
                <header>
                    <h1 class="title-v3" style="font-size: 36px; margin-bottom: 35px;">감상의 기록들</h1>
                    <div class="search-v3-bar">
                        <input type="text" class="search-v3-input" placeholder="어떤 순간을 찾고 계신가요?">
                    </div>
                </header>

                <div class="exhibition-v3-grid">
                    <article class="exhibition-v3-card" onclick="location.href='detail.html'">
                        <div class="card-visual-v3">
                            <img src="https://images.unsplash.com/photo-1542332213-9b5a5a3fad35?auto=format&fit=crop&q=80&w=400" alt="Tree">
                        </div>
                        <h3 class="card-title-v3">보랏빛으로 남은 순간들</h3>
                        <p class="card-desc-v3">이름도 모르던 그날의 직캠부터 시작된, 나의 7년이 담긴 보랏빛 지도입니다.</p>
                        <div class="v3-card-footer" style="display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid rgba(179, 126, 111, 0.1);">
                            <span style="font-size: 11px; font-weight: 800; color: #B37E6F; letter-spacing: 1px;">#BTS</span>
                            <span style="font-size: 11px; font-weight: 700; opacity: 0.4;">12 MOMENTS</span>
                        </div>
                    </article>

                    <article class="exhibition-v3-card">
                        <div class="card-visual-v3">
                            <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&q=80&w=400" alt="Tree">
                        </div>
                        <h3 class="card-title-v3">우리가 사랑한 새로운 계절</h3>
                        <p class="card-desc-v3">새로운 계절처럼 다가온 그녀들의 첫 데뷔 무대를 기록합니다.</p>
                        <div class="v3-card-footer" style="display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid rgba(179, 126, 111, 0.1);">
                            <span style="font-size: 11px; font-weight: 800; color: #B37E6F; letter-spacing: 1px;">#NEWJEANS</span>
                            <span style="font-size: 11px; font-weight: 700; opacity: 0.4;">8 MOMENTS</span>
                        </div>
                    </article>
                </div>
            </main>

            <aside class="hub-v3-sidebar">
                <div class="hub-v3-empty">
                    <div class="hub-v3-icon">✨</div>
                    <h2 class="hub-v3-title">감상 허브</h2>
                    <p class="hub-v3-desc">왼쪽에서 트리를 선택해 보세요.<br>대표 순간과 감정의 경로가 이곳에 열립니다.</p>
                </div>
            </aside>
        </div>
    </div>
</body>
</html>
