<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>순간의 기록 | LoveTree v3</title>
    <link rel="stylesheet" href="../../css/gemini-v3/index.css">
    <link rel="stylesheet" href="../../css/gemini-v3/detail.css">
</head>
<body>
    <div class="canvas-v3">
        <header class="header-v3">
            <a href="index.html" class="logo-v3">LoveTree</a>
            <nav class="nav-v3">
                <a href="index.html" class="nav-link-v3">첫 화면</a>
                <a href="intro.html" class="nav-link-v3">LoveTree 소개</a>
                <a href="search.html" class="nav-link-v3">둘러보기</a>
                <a href="../my-trees.html" class="nav-link-v3">나의 트리</a>
            </nav>
            <a href="../login.html" class="btn-v3" style="padding: 10px 24px; border: 1.5px solid #B37E6F; color: #B37E6F;">로그인</a>
        </header>

        <div class="detail-v3-layout">
            <nav style="padding: 20px 55px;">
                <a href="search.html" style="text-decoration: none; color: var(--gv3-text-muted); font-size: 14px; font-weight: 700;">← 감상 허브로 돌아가기</a>
            </nav>

            <section class="media-v3-stage">
                <img src="https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&q=80&w=1200" alt="Moment">
                <div class="play-v3-btn">▶</div>
            </section>

            <main class="narrative-v3">
                <header class="meta-v3-info">
                    <span class="date-v3-label">April 12, 2026</span>
                    <h1 class="moment-v3-title">이름도 모르던 그 영상</h1>
                </header>

                <article class="memo-v3-paper">
                    <div class="memo-v3-text">
                        처음엔 그냥 유튜브 알고리즘에 떠서 우연히 클릭했어요. <br>
                        무대 위에서 저렇게 행복하게 웃는 사람이 누구지? 하는 호기심이 생겼던 순간입니다. <br>
                        그 웃음 하나가 제 일상의 풍경을 이렇게나 바꿀 줄은 몰랐어요. <br>
                        앞으로 이 트리가 어떻게 자라날지, 저도 참 기대가 됩니다.
                    </div>
                </article>
            </main>

            <section style="padding: 0 55px 120px; text-align: center;">
                <span class="eyebrow-v3" style="margin-bottom: 40px;">Connected Memories</span>
                <div style="display: flex; gap: 30px; justify-content: center;">
                    <div class="node-v3" style="position: relative; left: 0; top: 0; transform: rotate(-2deg);">
                        <div class="tape-v3"></div>
                        <div class="node-img-v3" style="background-image: url('https://images.unsplash.com/photo-1493225255756-d9584f8606e9?auto=format&fit=crop&q=80&w=200'); background-size: cover;"></div>
                        <div class="node-cap-v3">첫 설렘의 순간</div>
                    </div>
                    <div class="node-v3" style="position: relative; left: 0; top: 0; transform: rotate(3deg);">
                        <div class="tape-v3" style="transform: translateX(-50%) rotate(2deg);"></div>
                        <div class="node-img-v3" style="background-image: url('https://images.unsplash.com/photo-1514525253361-bee8718a340b?auto=format&fit=crop&q=80&w=200'); background-size: cover;"></div>
                        <div class="node-cap-v3">밤새 보던 직캠</div>
                    </div>
                </div>
            </section>
        </div>

        <div class="action-v3-hub">
            <a href="#" class="action-v3-item">
                <span class="action-v3-icon">🕊️</span>
                <span>공감하기</span>
            </a>
            <a href="#" class="action-v3-item">
                <span class="action-v3-icon">🌙</span>
                <span>감상평</span>
            </a>
            <a href="#" class="action-v3-item">
                <span class="action-v3-icon">✨</span>
                <span>공유</span>
            </a>
        </div>
    </div>
</body>
</html>
