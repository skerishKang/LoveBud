<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>순간의 기록 | LoveTree v3</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/gemini-v3/index.css">
    <link rel="stylesheet" href="../../css/gemini-v3/detail.css">
</head>
<body>
    <div class="v3-canvas">
        <header class="v3-header">
            <a href="index.html" class="v3-logo">LoveTree</a>
            <nav class="v3-nav">
                <a href="index.html" class="v3-nav-link">첫 화면</a>
                <a href="intro.html" class="v3-nav-link">LoveTree 소개</a>
                <a href="search.html" class="v3-nav-link">둘러보기</a>
                <a href="../my-trees.html" class="v3-nav-link">나의 트리</a>
            </nav>
            <div class="v3-header-actions">
                <a href="../login.html" class="v3-btn-pill v3-btn-outline">로그인</a>
            </div>
        </header>

        <div class="v3-detail-layout">
            <section class="v3-media-section">
                <div class="v3-play-trigger">▶</div>
            </section>

            <main class="v3-narrative">
                <header class="v3-detail-header">
                    <span class="v3-detail-date">April 12, 2026</span>
                    <h1 class="v3-detail-title">이름도 모르던 그 영상</h1>
                </header>

                <article class="v3-diary-paper">
                    <div class="v3-diary-text">
                        처음엔 그냥 유튜브 알고리즘에 떠서 우연히 클릭했어요. <br>
                        무대 위에서 저렇게 행복하게 웃는 사람이 누구지? 하는 호기심이 생겼던 순간입니다. <br>
                        그 웃음 하나가 제 일상의 풍경을 이렇게나 바꿀 줄은 몰랐어요. <br>
                        앞으로 이 트리가 어떻게 자라날지, 저도 참 기대가 됩니다.
                    </div>
                </article>
            </main>

            <section class="v3-flow-section">
                <h3 class="v3-flow-title">이어진 마음의 조각들</h3>
                <div class="v3-polaroid-scroll">
                    <article class="v3-polaroid" style="position: relative; left: 0; top: 0; transform: rotate(-2deg);">
                        <div class="v3-pol-img" style="background: #FDF1F0;"></div>
                        <div class="v3-pol-cap">첫 설렘의 순간</div>
                    </article>
                    <article class="v3-polaroid" style="position: relative; left: 0; top: 0; transform: rotate(3deg);">
                        <div class="v3-pol-img" style="background: #F5F7FA;"></div>
                        <div class="v3-pol-cap">밤새 보던 직캠</div>
                    </article>
                    <article class="v3-polaroid" style="position: relative; left: 0; top: 0; transform: rotate(-1deg);">
                        <div class="v3-pol-img" style="background: #F0F4F0;"></div>
                        <div class="v3-pol-cap">잊지 못할 가사</div>
                    </article>
                </div>
            </section>
        </div>

        <div class="v3-action-hub">
            <a href="#" class="v3-action-item">
                <span class="v3-action-icon">🕊️</span>
                <span>공감</span>
            </a>
            <a href="#" class="v3-action-item">
                <span class="v3-action-icon">🌙</span>
                <span>감상평</span>
            </a>
            <a href="#" class="v3-action-item">
                <span class="v3-action-icon">✨</span>
                <span>공유</span>
            </a>
        </div>
    </div>

</html>
