<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveTree v3 | 좋아하는 순간이 자라나는 밤</title>
    <link rel="stylesheet" href="../../css/gemini-v3/index.css">
</head>
<body>
    <div class="canvas-v3">
        <!-- Floating Petals -->
        <div class="petal-v3" style="left: 15%; animation-delay: 0s;"></div>
        <div class="petal-v3" style="left: 35%; animation-delay: 4s;"></div>
        <div class="petal-v3" style="left: 65%; animation-delay: 2s;"></div>
        <div class="petal-v3" style="left: 85%; animation-delay: 6s;"></div>

        <header class="header-v3">
            <a href="index.html" class="logo-v3">LoveTree</a>
            <nav class="nav-v3">
                <a href="index.html" class="nav-link-v3">첫 화면</a>
                <a href="intro.html" class="nav-link-v3">LoveTree 소개</a>
                <a href="search.html" class="nav-link-v3">둘러보기</a>
                <a href="../my-trees.html" class="nav-link-v3">나의 트리</a>
            </nav>
            <a href="../login.html" class="btn-v3" style="padding: 10px 24px; border: 1.5px solid #B37E6F; color: #B37E6F;">로그인</a>
        </header>

        <main class="hero-v3">
            <div class="hero-copy-v3">
                <span class="eyebrow-v3">The Journey of Love</span>
                <h1 class="title-v3">
                    흩어진 기억을<br>
                    <span>빛나는 트리</span>로<br>
                    천천히 이어가세요
                </h1>
                <p class="subtitle-v3">
                    누군가에게 반했던 그 찰나의 순간부터,<br>
                    서서히 깊어진 마음의 발자취를 하나의 아름다운 지도로 남겨보세요.
                </p>
                <div class="actions-v3">
                    <a href="../my-trees.html" class="btn-v3 btn-primary-v3">나의 트리 시작하기</a>
                </div>
            </div>

            <div class="visual-v3">
                <!-- Glowing SVG Tree with Organic Curves -->
                <svg class="tree-svg-v3" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <!-- Main Branch -->
                    <path class="tree-path-v3" filter="url(#glow)" d="M100 300 Q 250 300, 300 200 T 500 150" />
                    <path class="tree-path-v3" filter="url(#glow)" d="M100 300 Q 250 300, 300 400 T 500 450" />
                    <path class="tree-path-v3" filter="url(#glow)" d="M500 150 Q 650 150, 750 300" />
                    <path class="tree-path-v3" filter="url(#glow)" d="M500 450 Q 650 450, 750 300" />
                </svg>

                <!-- Sparkles -->
                <span class="sparkle-v3" style="left: 20%; top: 35%;">✦</span>
                <span class="sparkle-v3" style="left: 75%; top: 25%;">✦</span>
                <span class="sparkle-v3" style="left: 55%; top: 75%;">✦</span>

                <!-- Memory Nodes -->
                <div class="node-v3 n1">
                    <div class="tape-v3"></div>
                    <div class="node-img-v3" style="background-image: url('https://images.unsplash.com/photo-1493225255756-d9584f8606e9?auto=format&fit=crop&q=80&w=200'); background-size: cover;"></div>
                    <div class="node-cap-v3">첫 설렘의 순간</div>
                </div>

                <div class="node-v3 n2">
                    <div class="tape-v3" style="transform: translateX(-50%) rotate(2deg);"></div>
                    <div class="node-img-v3" style="background-image: url('https://images.unsplash.com/photo-1514525253361-bee8718a340b?auto=format&fit=crop&q=80&w=200'); background-size: cover;"></div>
                    <div class="node-cap-v3">밤새 보던 직캠</div>
                </div>

                <div class="node-v3 n3">
                    <div class="tape-v3" style="transform: translateX(-50%) rotate(-5deg);"></div>
                    <div class="node-img-v3" style="background-image: url('https://images.unsplash.com/photo-1459749411177-042180ce673c?auto=format&fit=crop&q=80&w=200'); background-size: cover;"></div>
                    <div class="node-cap-v3">잊지 못할 가사</div>
                </div>

                <div class="node-v3 n4">
                    <div class="tape-v3"></div>
                    <div class="node-img-v3" style="background-image: url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&q=80&w=200'); background-size: cover;"></div>
                    <div class="node-cap-v3">우리의 성장</div>
                </div>
            </div>
        </main>

        <footer style="padding: 25px 55px; text-align: center; font-size: 11px; color: var(--gv3-text-muted); opacity: 0.5; z-index: 10;">
            <p>© 2026 LoveTree gemini-v3 · Premium Archive for Fans</p>
        </footer>
    </div>
</body>
</html>
