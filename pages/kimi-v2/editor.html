<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>트리 에디터 - LoveTree</title>
  <link rel="stylesheet" href="../../assets/css/kimi-v2/editor.css">
</head>
<body>
  <div class="editor-container">
    <!-- 헤더 -->
    <header class="editor-header">
      <div class="header-left">
        <button class="btn-back" onclick="history.back()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M5 12L12 19M5 12L12 5"/>
          </svg>
        </button>
        <input type="text" class="tree-title-input" placeholder="제목 없는 트리" value="">
      </div>
      <div class="header-right">
        <button class="btn-icon" title="미리보기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <button class="btn-icon" title="설정">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button class="btn-save">저장</button>
      </div>
    </header>
    
    <!-- 메인 에디터 -->
    <main class="editor-main">
      <!-- 사이드바: 노드 목록 -->
      <aside class="editor-sidebar">
        <div class="sidebar-header">
          <h3>순간 목록</h3>
          <button class="btn-add-node" title="순간 추가">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
        <div class="node-list">
          <div class="empty-state">
            <div class="empty-icon">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
            </div>
            <p>첫 순간을 추가해보세요</p>
            <button class="btn-empty-action">사진/영상 추가</button>
          </div>
        </div>
      </aside>
      
      <!-- 캔버스 영역 -->
      <section class="editor-canvas">
        <div class="canvas-empty">
          <div class="canvas-tree-visual">
            <svg viewBox="0 0 200 240" class="tree-svg">
              <ellipse cx="100" cy="220" rx="60" ry="15" fill="#2d2d44"/>
              <rect x="95" y="180" width="10" height="40" fill="#4a4a6a" rx="2"/>
              <ellipse cx="100" cy="175" rx="8" ry="12" fill="#a855f7"/>
              <ellipse cx="92" cy="178" rx="6" ry="9" fill="#c084fc"/>
              <ellipse cx="108" cy="178" rx="6" ry="9" fill="#c084fc"/>
            </svg>
          </div>
          <p class="canvas-hint">왼쪽에서 순간을 추가하거나<br>여기를 클릭하여 시작하세요</p>
        </div>
      </section>
      
      <!-- 사이드바: 상세 편집 -->
      <aside class="editor-panel">
        <div class="panel-tabs">
          <button class="tab active">속성</button>
          <button class="tab">스타일</button>
        </div>
        <div class="panel-content">
          <div class="empty-panel">
            <p>노드를 선택하여<br>편집하세요</p>
          </div>
        </div>
      </aside>
    </main>
    
    <!-- 하단 툴바 -->
    <footer class="editor-toolbar">
      <div class="toolbar-left">
        <button class="tool-btn active" title="선택">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
          </svg>
        </button>
        <button class="tool-btn" title="연결">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </button>
      </div>
      <div class="toolbar-right">
        <button class="tool-btn" title="줌 아웃">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            <line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </button>
        <span class="zoom-level">100%</span>
        <button class="tool-btn" title="줌 인">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            <line x1="11" y1="8" x2="11" y2="14"/>
            <line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>
</body>
</html>
