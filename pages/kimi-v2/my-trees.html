<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 트리 - LoveTree</title>
  <link rel="stylesheet" href="../../assets/css/kimi-v2/my-trees.css">
</head>
<body>
  <div class="trees-container">
    <!-- 헤더 -->
    <header class="trees-header">
      <div class="header-top">
        <h1 class="page-title">내 트리</h1>
        <button class="btn-icon" title="설정">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
      
      <!-- 통계 카드 -->
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-number">3</span>
          <span class="stat-label">전체 트리</span>
        </div>
        <div class="stat-card">
          <span class="stat-number">24</span>
          <span class="stat-label">저장된 순간</span>
        </div>
        <div class="stat-card highlight">
          <span class="stat-number">1</span>
          <span class="stat-label">공개 트리</span>
        </div>
      </div>
    </header>
    
    <!-- 트리 목록 -->
    <main class="trees-main">
      <div class="section-header">
        <h2 class="section-title">나의 러브트리</h2>
        <button class="btn-new-tree" onclick="location.href='editor.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          새 트리
        </button>
      </div>
      
      <div class="trees-grid">
        <div class="tree-card">
          <div class="tree-thumb">
            <div class="tree-preview">
              <svg viewBox="0 0 100 100" class="mini-tree">
                <ellipse cx="50" cy="90" rx="25" ry="6" fill="#2d2d44"/>
                <rect x="47" y="60" width="6" height="30" fill="#4a4a6a" rx="1"/>
                <ellipse cx="35" cy="50" rx="12" ry="16" fill="#a855f7"/>
                <ellipse cx="65" cy="45" rx="14" ry="18" fill="#c084fc"/>
                <ellipse cx="50" cy="30" rx="16" ry="22" fill="#e879f9"/>
              </svg>
            </div>
            <div class="tree-overlay">
              <span class="visibility-badge public">공개</span>
            </div>
          </div>
          <div class="tree-info">
            <h3 class="tree-name">우리의 1년</h3>
            <p class="tree-meta">24개 순간 • 2주 전</p>
            <div class="tree-tags">
              <span class="tag">#연애</span>
              <span class="tag">#추억</span>
            </div>
          </div>
        </div>
        
        <div class="tree-card">
          <div class="tree-thumb">
            <div class="tree-preview">
              <svg viewBox="0 0 100 100" class="mini-tree">
                <ellipse cx="50" cy="90" rx="25" ry="6" fill="#2d2d44"/>
                <rect x="47" y="65" width="6" height="25" fill="#4a4a6a" rx="1"/>
                <ellipse cx="50" cy="55" rx="10" ry="14" fill="#a855f7"/>
                <ellipse cx="40" cy="60" rx="8" ry="11" fill="#c084fc"/>
                <ellipse cx="60" cy="60" rx="8" ry="11" fill="#c084fc"/>
              </svg>
            </div>
            <div class="tree-overlay">
              <span class="visibility-badge private">비공개</span>
            </div>
          </div>
          <div class="tree-info">
            <h3 class="tree-name">제주 여행</h3>
            <p class="tree-meta">8개 순간 • 1개월 전</p>
            <div class="tree-tags">
              <span class="tag">#여행</span>
              <span class="tag">#제주</span>
            </div>
          </div>
        </div>
        
        <div class="tree-card">
          <div class="tree-thumb">
            <div class="tree-preview empty">
              <svg viewBox="0 0 100 100" class="mini-tree">
                <ellipse cx="50" cy="90" rx="20" ry="5" fill="#2d2d44"/>
                <rect x="48" y="75" width="4" height="15" fill="#4a4a6a" rx="1"/>
                <ellipse cx="50" cy="72" rx="5" ry="7" fill="#a855f7"/>
                <ellipse cx="46" cy="74" rx="4" ry="5" fill="#c084fc"/>
                <ellipse cx="54" cy="74" rx="4" ry="5" fill="#c084fc"/>
              </svg>
            </div>
            <div class="tree-overlay">
              <span class="visibility-badge private">비공개</span>
            </div>
          </div>
          <div class="tree-info">
            <h3 class="tree-name">새로운 트리</h3>
            <p class="tree-meta">0개 순간 • 방금</p>
            <div class="tree-tags">
              <span class="tag empty">태그 없음</span>
            </div>
          </div>
        </div>
      </div>
    </main>
    
    <!-- 하단 네비 -->
    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>홈</span>
      </a>
      <a href="search.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <span>검색</span>
      </a>
      <button class="nav-item nav-add" onclick="location.href='editor.html'">
        <div class="add-circle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
        <span>만들기</span>
      </button>
      <a href="my-trees.html" class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <span>내 트리</span>
      </a>
      <a href="settings.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>설정</span>
      </a>
    </nav>
  </div>
</body>
</html>
