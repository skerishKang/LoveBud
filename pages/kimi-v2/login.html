<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - LoveTree</title>
  <link rel="stylesheet" href="../../assets/css/kimi-v2/login.css">
</head>
<body>
  <div class="login-container">
    <div class="bg-gradient"></div>
    
    <main class="login-main">
      <!-- 뒤로가기 -->
      <button class="btn-back" onclick="history.back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      
      <!-- 로고 -->
      <div class="login-header">
        <h1 class="logo">LoveTree</h1>
        <p class="tagline">당신의 순간을 나무에 새기다</p>
      </div>
      
      <!-- 로그인 폼 -->
      <div class="login-form">
        <h2 class="form-title">시작하기</h2>
        
        <!-- 소셜 로그인 -->
        <div class="social-login">
          <button class="btn-social btn-google">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Google로 시작하기
          </button>
          
          <button class="btn-social btn-kakao">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#000">
              <path d="M12 2C6.48 2 2 5.9 2 10.7c0 2.88 1.86 5.43 4.66 6.83l-.95 3.63c-.1.38.32.68.64.45l4.35-2.96c.55.08 1.12.13 1.7.13 5.52 0 10-3.9 10-8.7S17.52 2 12 2z"/>
            </svg>
            카카오로 시작하기
          </button>
        </div>
        
        <!-- 구분선 -->
        <div class="divider">
          <span>또는</span>
        </div>
        
        <!-- 이메일 로그인 -->
        <form class="email-form">
          <div class="input-group">
            <label for="email">이메일</label>
            <input type="email" id="email" placeholder="example@email.com" required>
          </div>
          
          <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>
          
          <button type="submit" class="btn-submit">로그인</button>
        </form>
        
        <!-- 링크 -->
        <div class="form-links">
          <a href="#" class="link">비밀번호 찾기</a>
          <span class="dot">•</span>
          <a href="#" class="link highlight">회원가입</a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
