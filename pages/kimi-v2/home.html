<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveTree - 홈</title>
  <link rel="stylesheet" href="../../assets/css/kimi-v2/home.css">
</head>
<body>
  <div class="home-container">
    <!-- 헤더 -->
    <header class="home-header">
      <div class="header-content">
        <h1 class="logo">LoveTree</h1>
        <div class="header-actions">
          <button class="btn-icon" title="검색">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.35-4.35"/>
            </svg>
          </button>
          <button class="btn-icon" title="내 트리">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
          </button>
        </div>
      </div>
    </header>
    
    <main class="home-main">
      <!-- 히어로 섹션 -->
      <section class="hero-section">
        <div class="hero-content">
          <h2 class="hero-title">
            순간을 담아<br>
            <span class="highlight">나무를 키우세요</span>
          </h2>
          <p class="hero-desc">
            사진, 영상, 음악을 하나의 이야기로 엮어<br>
            당신만의 러브트리를 만들어보세요
          </p>
          <button class="btn-cta" onclick="location.href='editor.html'">
            트리 만들기
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
        <div class="hero-visual">
          <div class="hero-tree">
            <svg viewBox="0 0 200 240" class="tree-svg">
              <ellipse cx="100" cy="220" rx="70" ry="15" fill="#2d2d44"/>
              <rect x="94" y="160" width="12" height="60" fill="#4a4a6a" rx="3"/>
              <ellipse cx="70" cy="140" rx="20" ry="28" fill="#a855f7"/>
              <ellipse cx="130" cy="130" rx="22" ry="30" fill="#c084fc"/>
              <ellipse cx="100" cy="100" rx="25" ry="35" fill="#e879f9"/>
              <ellipse cx="85" cy="120" rx="15" ry="22" fill="#f0abfc"/>
              <ellipse cx="115" cy="115" rx="16" ry="24" fill="#a855f7"/>
            </svg>
          </div>
        </div>
      </section>
      
      <!-- 기능 카드 -->
      <section class="features-section">
        <h3 class="section-title">러브트리로 할 수 있는 것</h3>
        <div class="features-grid">
          <div class="feature-card">
            <div class="feature-icon icon-memory">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
            </div>
            <h4>순간 저장</h4>
            <p>사진과 영상으로 소중한 순간을 보관하세요</p>
          </div>
          
          <div class="feature-card">
            <div class="feature-icon icon-connect">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
              </svg>
            </div>
            <h4>이어지는 기억</h4>
            <p>여러 순간을 하나의 스토리로 연결하세요</p>
          </div>
          
          <div class="feature-card">
            <div class="feature-icon icon-share">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="18" cy="5" r="3"/>
                <circle cx="6" cy="12" r="3"/>
                <circle cx="18" cy="19" r="3"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
              </svg>
            </div>
            <h4>공유하기</h4>
            <p>완성된 트리를 친구들과 공유하세요</p>
          </div>
        </div>
      </section>
      
      <!-- 공개 트리 미리보기 -->
      <section class="preview-section">
        <div class="section-header">
          <h3 class="section-title">커뮤니티의 트리</h3>
          <a href="search.html" class="link-more">더보기</a>
        </div>
        <div class="preview-grid">
          <div class="preview-card">
            <div class="preview-thumb"></div>
            <div class="preview-info">
              <h4>첫 데이트</h4>
              <span class="preview-count">12개의 순간</span>
            </div>
          </div>
          <div class="preview-card">
            <div class="preview-thumb"></div>
            <div class="preview-info">
              <h4>여행 이야기</h4>
              <span class="preview-count">8개의 순간</span>
            </div>
          </div>
          <div class="preview-card">
            <div class="preview-thumb"></div>
            <div class="preview-info">
              <h4>우리의 1년</h4>
              <span class="preview-count">24개의 순간</span>
            </div>
          </div>
        </div>
      </section>
    </main>
    
    <!-- 하단 네비 -->
    <nav class="bottom-nav">
      <a href="home.html" class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>홈</span>
      </a>
      <a href="search.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <span>검색</span>
      </a>
      <button class="nav-item nav-add" onclick="location.href='editor.html'">
        <div class="add-circle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
        <span>만들기</span>
      </button>
      <a href="my-trees.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <span>내 트리</span>
      </a>
      <a href="settings.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>설정</span>
      </a>
    </nav>
  </div>
</body>
</html>
