<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>검색 - LoveTree</title>
  <link rel="stylesheet" href="../../assets/css/kimi-v2/search.css">
</head>
<body>
  <div class="search-container">
    <!-- 헤더 검색바 -->
    <header class="search-header">
      <div class="search-bar">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="search-input" placeholder="트리, 순간, 태그 검색...">
        <button class="btn-clear" title="지우기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </header>
    
    <main class="search-main">
      <!-- 추천 태그 -->
      <section class="tags-section">
        <h2 class="section-title">인기 태그</h2>
        <div class="tags-cloud">
          <button class="tag-chip">#연애</button>
          <button class="tag-chip">#여행</button>
          <button class="tag-chip">#추억</button>
          <button class="tag-chip">#데이트</button>
          <button class="tag-chip">#기념일</button>
          <button class="tag-chip">#선물</button>
          <button class="tag-chip">#생일</button>
          <button class="tag-chip">#프로포즈</button>
        </div>
      </section>
      
      <!-- 공개 트리 목록 -->
      <section class="results-section">
        <div class="section-header">
          <h2 class="section-title">커뮤니티 트리</h2>
          <div class="filter-tabs">
            <button class="filter-tab active">최신</button>
            <button class="filter-tab">인기</button>
          </div>
        </div>
        
        <div class="results-grid">
          <div class="result-card">
            <div class="card-thumb">
              <div class="thumb-placeholder">
                <svg viewBox="0 0 80 80" class="mini-tree">
                  <ellipse cx="40" cy="72" rx="20" ry="5" fill="#2d2d44"/>
                  <rect x="37" y="48" width="6" height="24" fill="#4a4a6a" rx="1"/>
                  <ellipse cx="28" cy="40" rx="10" ry="13" fill="#a855f7"/>
                  <ellipse cx="52" cy="36" rx="11" ry="14" fill="#c084fc"/>
                  <ellipse cx="40" cy="24" rx="13" ry="17" fill="#e879f9"/>
                </svg>
              </div>
            </div>
            <div class="card-info">
              <h3 class="card-title">첫 데이트</h3>
              <p class="card-author">by LoveUser</p>
              <div class="card-stats">
                <span class="stat">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  1.2k
                </span>
                <span class="stat">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                  </svg>
                  86
                </span>
              </div>
            </div>
          </div>
          
          <div class="result-card">
            <div class="card-thumb">
              <div class="thumb-placeholder">
                <svg viewBox="0 0 80 80" class="mini-tree">
                  <ellipse cx="40" cy="72" rx="18" ry="4" fill="#2d2d44"/>
                  <rect x="38" y="52" width="4" height="20" fill="#4a4a6a" rx="1"/>
                  <ellipse cx="32" cy="44" rx="8" ry="11" fill="#a855f7"/>
                  <ellipse cx="48" cy="40" rx="9" ry="12" fill="#c084fc"/>
                  <ellipse cx="40" cy="28" rx="10" ry="14" fill="#e879f9"/>
                </svg>
              </div>
            </div>
            <div class="card-info">
              <h3 class="card-title">감성 카페 투어</h3>
              <p class="card-author">by CafeLover</p>
              <div class="card-stats">
                <span class="stat">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  856
                </span>
                <span class="stat">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                  </svg>
                  42
                </span>
              </div>
            </div>
          </div>
          
          <div class="result-card">
            <div class="card-thumb">
              <div class="thumb-placeholder">
                <svg viewBox="0 0 80 80" class="mini-tree">
                  <ellipse cx="40" cy="72" rx="22" ry="5" fill="#2d2d44"/>
                  <rect x="37" y="44" width="6" height="28" fill="#4a4a6a" rx="1"/>
                  <ellipse cx="25" cy="36" rx="11" ry="14" fill="#a855f7"/>
                  <ellipse cx="55" cy="32" rx="12" ry="15" fill="#c084fc"/>
                  <ellipse cx="40" cy="20" rx="14" ry="18" fill="#e879f9"/>
                  <ellipse cx="32" cy="30" rx="9" ry="12" fill="#f0abfc"/>
                  <ellipse cx="48" cy="28" rx="10" ry="13" fill="#a855f7"/>
                </svg>
              </div>
            </div>
            <div class="card-info">
              <h3 class="card-title">우리의 여행</h3>
              <p class="card-author">by Traveler</p>
              <div class="card-stats">
                <span class="stat">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  2.1k
                </span>
                <span class="stat">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                  </svg>
                  156
                </span>
              </div>
            </div>
          </div>
          
          <div class="result-card">
            <div class="card-thumb">
              <div class="thumb-placeholder">
                <svg viewBox="0 0 80 80" class="mini-tree">
                  <ellipse cx="40" cy="72" rx="16" ry="4" fill="#2d2d44"/>
                  <rect x="38" y="56" width="4" height="16" fill="#4a4a6a" rx="1"/>
                  <ellipse cx="34" cy="50" rx="7" ry="9" fill="#a855f7"/>
                  <ellipse cx="46" cy="48" rx="8" ry="10" fill="#c084fc"/>
                  <ellipse cx="40" cy="38" rx="9" ry="12" fill="#e879f9"/>
                </svg>
              </div>
            </div>
            <div class="card-info">
              <h3 class="card-title">기념일 기록</h3>
              <p class="card-author">by Anniversary</p>
              <div class="card-stats">
                <span class="stat">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  567
                </span>
                <span class="stat">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                  </svg>
                  28
                </span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    
    <!-- 하단 네비 -->
    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>홈</span>
      </a>
      <a href="search.html" class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <span>검색</span>
      </a>
      <button class="nav-item nav-add" onclick="location.href='editor.html'">
        <div class="add-circle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
        <span>만들기</span>
      </button>
      <a href="my-trees.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <span>내 트리</span>
      </a>
      <a href="settings.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>설정</span>
      </a>
    </nav>
  </div>
</body>
</html>
