<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoveTree - GPT v2 Editor</title>
  <link rel="stylesheet" href="../../css/gpt-v2/common.css" />
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">❀</div><div class="brand-copy"><strong>러브트리</strong><span>LoveTree</span></div></div>
      <nav class="main-nav">
        <a href="./home.html">첫 화면</a>
        <a href="./intro.html">LoveTree 소개 보기</a>
        <a href="./browse.html">둘러보기</a>
        <a href="./start.html" class="active">내 러브트리 시작하기</a>
      </nav>
      <div class="user-pill"><div class="avatar"></div><span>우리의 하루</span></div>
    </header>

    <main class="grid-editor">
      <aside class="sidebar">
        <div class="eyebrow">✿ Our LoveTree</div>
        <h2 class="display" style="font-size:28px;">우리의 러브트리 ♡</h2>
        <p class="lead" style="font-size:16px;">비공개 러브트리 초안입니다.</p>
        <a href="#" class="btn btn-secondary" style="margin-top:16px;">트리 한눈에 보기</a>
      </aside>

      <section class="canvas tree-canvas">
        <div class="tree-trunk"></div>
        <article class="tree-memory" style="left:170px; top:70px;">
          <div class="photo photo-couple"></div>
          <h4>처음 사랑하게 된 무대</h4>
          <p>우리의 이야기가 시작된 그 순간.</p>
        </article>
        <article class="tree-memory" style="right:140px; top:90px; width:220px; transform:rotate(-2deg);">
          <div class="photo photo-home-2" style="height:138px;"></div>
          <h4 style="font-size:18px;">다시 듣게 되는 노래</h4>
          <p>이 노래만 들으면 그때가 떠올라.</p>
        </article>
        <article class="tree-memory" style="left:430px; top:476px; width:220px;">
          <div class="photo photo-room" style="height:150px;"></div>
          <h4 style="font-size:18px;">오늘도 위로가 된 장면</h4>
          <p>지친 하루 끝에 따뜻했던 장면.</p>
        </article>
      </section>

      <aside class="composer">
        <div class="section-title">지금 이어가는 순간</div>
        <div class="input">YouTube 링크를 붙여넣어 주세요</div>
        <div class="textarea" style="margin-top:14px;">이 순간에 대한 간단한 메모를 남겨보세요</div>
        <div class="btn-row">
          <a href="#" class="btn btn-primary">이 순간 저장하기</a>
        </div>
      </aside>
    </main>
  </div>
</body>
</html>
