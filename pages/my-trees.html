<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 러브트리 | LoveTree</title>
  <link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="../css/global.css?v=20260415-10">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
  <style>
    .my-trees-layout { min-height: 100vh; display: flex; flex-direction: column; }
    body.my-trees-auth-pending .my-trees-content { visibility: hidden; }
    .my-trees-content { flex: 1; width: 100%; max-width: var(--page-work-max); margin: 0 auto; padding: 48px 48px 64px; }
    
    .dashboard-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 48px;
      align-items: start;
    }

    .dashboard-sidebar {
      position: sticky;
      top: 100px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .my-trees-header { display: flex; flex-direction: column; gap: 12px; }
    .header-content { flex: 1; min-width: 0; max-width: 440px; }
    .my-trees-header h1 { font-size: 2.2rem; font-weight: 900; color: var(--on-surface); margin-bottom: 6px; letter-spacing: -0.03em; }
    .my-trees-header p { color: var(--on-surface-variant); max-width: 420px; margin: 0; font-size: 0.95rem; line-height: 1.5; }
    .trees-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .tree-card { display: block; position: relative; background: white; border-radius: 28px; padding: 0; box-shadow: var(--shadow-whisper); border: 1px solid var(--outline-variant); overflow: hidden; cursor: pointer; transition: border-color 0.12s ease, box-shadow 0.12s ease; text-decoration: none; color: inherit; }
    .tree-card:hover { box-shadow: 0 20px 50px rgba(144, 73, 81, 0.12); border-color: var(--primary-soft); }
    .tree-card-thumb { width: 100%; height: 184px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 18px; }
    .tree-card-thumb-glow { position: absolute; inset: auto auto 18px 18px; width: 128px; height: 128px; border-radius: 50%; filter: blur(10px); }
    .tree-card-thumb-initial { position: absolute; top: 16px; left: 16px; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; background: rgba(255,255,255,0.72); border: 1px solid rgba(255,255,255,0.55); backdrop-filter: blur(6px); z-index: 2; }
    .tree-card-thumb-topline { position: absolute; top: 16px; right: 16px; z-index: 2; }
    .tree-card-thumb-art { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .tree-card-thumb svg { width: 84%; height: 84%; opacity: 0.95; }
    .tree-card-thumb-image { width: calc(100% + 36px); height: calc(100% + 36px); margin: -18px; object-fit: cover; display: block; }
    .tree-card-text-visual { width: calc(100% - 20px); min-height: 126px; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 16px 18px; border-radius: 24px; border: 1px solid; box-shadow: 0 14px 34px rgba(75, 64, 57, 0.07); backdrop-filter: blur(10px); }
    .tree-card-text-kicker { font-size: 10px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; }
    .tree-card-text-title { font-size: 1rem; font-weight: 800; line-height: 1.4; color: var(--on-surface); word-break: keep-all; }
    .tree-card-text-memo { font-size: 12px; line-height: 1.55; color: var(--on-surface-variant); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; }
    .tree-card-thumb-caption { position: absolute; left: 16px; right: 16px; bottom: 14px; padding: 10px 12px; border-radius: 999px; background: rgba(255,255,255,0.78); backdrop-filter: blur(8px); font-size: 12px; font-weight: 700; color: var(--on-surface); text-align: center; }
    .tree-card-info { padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 8px; }
    .tree-card-title-row { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; }
    .tree-card-title { font-size: 1.04rem; font-weight: 700; color: var(--on-surface); line-height: 1.3; flex: 1; }
    .tree-card-count-pill, .tree-card-moment-badge { display: inline-flex; align-items: center; justify-content: center; padding: 6px 10px; border-radius: 999px; background: rgba(144, 73, 81, 0.10); color: var(--primary); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .tree-card-subcopy { font-size: 12px; color: var(--on-surface-variant); line-height: 1.45; }
    .tree-card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.85rem; color: var(--on-surface-variant); }
    .tree-card-date { font-size: 12px; }
    .tree-card-visibility { display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--surface-container-low); }
    .tree-card-visibility.public { background: rgba(122, 139, 110, 0.1); color: var(--secondary); }
    .tree-card-visibility.private { background: rgba(144, 73, 81, 0.08); color: var(--primary); }
    .empty-state { text-align: center; padding: 64px 32px; background: white; border-radius: 2rem; border: 1px solid var(--outline-variant); box-shadow: var(--shadow-whisper); max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
    .empty-state-icon { font-size: 64px; margin-bottom: 24px; display: block; }
    .empty-state h2 { font-size: 1.5rem; font-weight: 800; color: var(--on-surface); margin-bottom: 12px; }
    .empty-state p { color: var(--on-surface-variant); font-size: 1rem; line-height: 1.6; margin-bottom: 32px; max-width: 400px; margin-left: auto; margin-right: auto; }
    .btn-create-tree { display: inline-flex; align-items: center; gap: 8px; padding: 14px 32px; background: var(--primary); color: white; border-radius: 99px; font-weight: 700; font-size: 15px; font-family: var(--font-heading); text-decoration: none; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(144, 73, 81, 0.2); transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1); }
    .btn-create-tree:hover { background: var(--primary-vibrant); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(144, 73, 81, 0.3); }
    .error-state { text-align: center; padding: 80px 40px; background: white; border-radius: 2rem; border: 1px solid rgba(198, 40, 40, 0.2); box-shadow: var(--shadow-whisper); display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .error-state-icon { font-size: 64px; margin-bottom: 8px; display: block; color: #c62828; }
    .error-state h2 { font-size: 1.5rem; font-weight: 800; color: var(--on-surface); margin-bottom: 8px; }
    .error-state p { color: var(--on-surface-variant); font-size: 1rem; line-height: 1.6; margin-bottom: 24px; max-width: 400px; margin-left: auto; margin-right: auto; }
    .btn-header-create:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-header-create { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; background: linear-gradient(135deg, #ff6b9d 0%, #e85a7a 100%); color: white; border: none; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 2px 8px rgba(232, 90, 122, 0.3); white-space: nowrap; flex-shrink: 0; }
    .btn-header-create:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(232, 90, 122, 0.4); }
    .btn-header-create:active { transform: translateY(0); }
    .manage-summary-bar { display: flex; flex-direction: column; gap: 24px; padding: 24px; background: white; border-radius: 24px; border: 1px solid var(--outline-variant); box-shadow: var(--shadow-whisper); }
    .manage-summary-main { display: flex; flex-direction: column; gap: 16px; font-size: 14px; }
    .summary-separator { display: none; }
    .summary-sort-control { width: 100%; margin-top: 8px; }
    .manage-summary-selected,
    .tree-card-manage-row { display: none !important; }
    .tree-card-menu { position: absolute; right: 14px; bottom: 14px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(62, 52, 47, 0.08); border-radius: 50%; cursor: pointer; opacity: 1; transition: opacity 0.2s ease, background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease; z-index: 10; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08); }
    .tree-card:hover .tree-card-menu { transform: translateY(-1px); }
    .tree-card-menu:hover { background: rgba(255, 255, 255, 1); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12); }
    .tree-card-dropdown { position: absolute; right: 14px; bottom: 58px; background: white; border-radius: 12px; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16); min-width: 148px; padding: 6px 0; z-index: 20; display: none; }
    .tree-card-dropdown.show { display: block; }
    .dropdown-item { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 13px; color: var(--on-surface); cursor: pointer; transition: background 0.15s ease; }
    .dropdown-item:hover { background: var(--surface-variant); }
    .dropdown-item.delete { color: #c62828; }
    .create-tree-modal-backdrop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(53, 40, 38, 0.34); backdrop-filter: blur(8px); z-index: 1200; }
    .create-tree-modal-backdrop.show { display: flex; }
    .create-tree-modal { width: min(100%, 520px); background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,248,249,0.98)); border: 1px solid rgba(144, 73, 81, 0.12); border-radius: 28px; box-shadow: 0 30px 70px rgba(75, 64, 57, 0.18); padding: 28px; }
    .create-tree-modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .create-tree-modal-kicker { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 12px; border-radius: 999px; background: rgba(144, 73, 81, 0.08); color: var(--primary); font-size: 12px; font-weight: 900; margin-bottom: 12px; }
    .create-tree-modal-title { font-size: 1.5rem; font-weight: 900; line-height: 1.2; color: var(--on-surface); letter-spacing: -0.02em; margin: 0 0 8px; }
    .create-tree-modal-desc { margin: 0; color: var(--on-surface-variant); font-size: 0.95rem; line-height: 1.6; }
    .create-tree-modal-close { width: 40px; height: 40px; border: none; border-radius: 50%; background: rgba(255,255,255,0.84); color: var(--on-surface-variant); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.18s ease; }
    .create-tree-modal-close:hover { background: white; color: var(--on-surface); }
    .create-tree-modal-form { display: flex; flex-direction: column; gap: 18px; }
    .create-tree-field { display: flex; flex-direction: column; gap: 10px; }
    .create-tree-label { font-size: 13px; font-weight: 800; color: var(--on-surface); }
    .create-tree-input { width: 100%; border: 1px solid rgba(144, 73, 81, 0.14); border-radius: 18px; padding: 15px 16px; font-size: 15px; font-family: var(--font-body); background: rgba(255,255,255,0.94); color: var(--on-surface); outline: none; transition: border-color 0.18s ease, box-shadow 0.18s ease; }
    .create-tree-input:focus { border-color: rgba(144, 73, 81, 0.28); box-shadow: 0 0 0 4px rgba(144, 73, 81, 0.08); }
    .create-tree-input[aria-invalid="true"] { border-color: rgba(198, 40, 40, 0.42); }
    .create-tree-help { font-size: 12px; color: var(--on-surface-variant); line-height: 1.5; }
    .create-tree-error { min-height: 18px; font-size: 12px; color: #b71c1c; }
    .create-tree-visibility { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .create-tree-visibility-option { position: relative; }
    .create-tree-visibility-option input { position: absolute; opacity: 0; pointer-events: none; }
    .create-tree-visibility-card { display: flex; flex-direction: column; gap: 8px; padding: 16px 16px 14px; border-radius: 20px; border: 1px solid rgba(144, 73, 81, 0.12); background: rgba(255,255,255,0.88); cursor: pointer; transition: all 0.18s ease; min-height: 112px; }
    .create-tree-visibility-card:hover { border-color: rgba(144, 73, 81, 0.2); transform: translateY(-1px); }
    .create-tree-visibility-option input:checked + .create-tree-visibility-card { border-color: rgba(144, 73, 81, 0.28); background: rgba(255, 246, 247, 0.98); box-shadow: 0 10px 24px rgba(144, 73, 81, 0.08); }
    .create-tree-visibility-top { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; color: var(--on-surface); }
    .create-tree-visibility-desc { font-size: 12px; line-height: 1.55; color: var(--on-surface-variant); }
    .create-tree-modal-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 4px; }
    .create-tree-modal-btn { border: none; border-radius: 999px; padding: 12px 18px; font-size: 14px; font-weight: 800; cursor: pointer; transition: all 0.18s ease; }
    .create-tree-modal-btn.secondary { background: rgba(255,255,255,0.86); color: var(--on-surface); border: 1px solid rgba(144, 73, 81, 0.1); }
    .create-tree-modal-btn.primary { background: linear-gradient(135deg, #ff6b9d 0%, #e85a7a 100%); color: white; box-shadow: 0 10px 24px rgba(232, 90, 122, 0.24); }
    .create-tree-modal-btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; box-shadow: none; }
    @media (max-width: 1024px) {
      .my-trees-content { padding: 40px 28px 56px; }
      .trees-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    }
    @media (max-width: 768px) {
      .my-trees-content { padding: 28px 20px 44px; }
      .my-trees-header { flex-direction: column; align-items: stretch; gap: 12px; margin-bottom: 18px; }
      .header-content { max-width: none; }
      .my-trees-header h1 { font-size: 1.8rem; }
      .my-trees-header p { max-width: none; font-size: 0.92rem; }
      .btn-header-create { width: 100%; justify-content: center; }
      .trees-grid { grid-template-columns: 1fr; }
      .empty-state { padding: 60px 24px; }
      .tree-card-menu { opacity: 1; }
      .manage-summary-bar { padding: 14px 14px 12px; margin-bottom: 14px; }
      .manage-summary-main { gap: 10px; align-items: center; }
      .summary-separator, .summary-aux-item { display: none !important; }
      #sortTreesSelect.summary-sort-control { margin-left: auto; max-width: 132px; }
      .tree-card-thumb { height: 176px; }
      .create-tree-modal-backdrop { padding: 16px; }
      .create-tree-modal { padding: 22px 20px; border-radius: 24px; }
      .create-tree-visibility { grid-template-columns: 1fr; }
      .create-tree-modal-actions { flex-direction: column-reverse; }
      .create-tree-modal-btn { width: 100%; justify-content: center; }
    }
    @media (max-width: 420px) {
      .tree-card-date { display: none; }
    }
  </style>
</head>
<body class="bokeh-bg my-trees-auth-pending">
  <div class="noise-overlay"></div>
  <div class="my-trees-layout">
    <div id="shared-header"></div>
    <main class="my-trees-content">
      <div class="dashboard-grid">
        <aside class="dashboard-sidebar">
          <div class="my-trees-header">
            <div class="header-content">
              <h1 id="myTreesPageTitle">🌳 내 러브트리</h1>
              <p id="myTreesPageDesc">다시 열고 이어가는 내 러브트리</p>
            </div>
            <button class="btn-header-create" id="headerCreateTreeBtn" style="width: 100%; margin-top: 12px;"><span class="material-symbols-outlined">add</span><span id="headerCreateTreeBtnLabel">새 트리</span></button>
          </div>

          <div class="manage-summary-bar" id="manageSummaryBar" style="display:none;">
            <div class="manage-summary-main">
              <div class="summary-primary-stat" style="display:flex;align-items:center;gap:8px;"><span class="material-symbols-outlined" style="color:var(--primary);font-size:20px;">account_tree</span><span style="font-weight:700;color:var(--on-surface);"><span id="totalTreesCount">0</span><span id="summaryTotalSuffix">개의 트리</span></span></div>
              <div class="summary-aux-item" style="display:flex;align-items:center;gap:10px;"><span class="material-symbols-outlined" style="color:#4caf50;font-size:18px;">public</span><span id="publicTreesCount" style="color:var(--on-surface-variant); font-weight: 600;">0</span> <span id="summaryPublicLabel" style="font-size: 12px; opacity: 0.8;">공개</span></div>
              <div class="summary-aux-item" style="display:flex;align-items:center;gap:10px;"><span class="material-symbols-outlined" style="color:#757575;font-size:18px;">lock</span><span id="privateTreesCount" style="color:var(--on-surface-variant); font-weight: 600;">0</span> <span id="summaryPrivateLabel" style="font-size: 12px; opacity: 0.8;">비공개</span></div>
              <div class="summary-aux-item" style="display:flex;align-items:center;gap:10px;"><span class="material-symbols-outlined" style="color:var(--primary-soft);font-size:18px;">favorite</span><span id="totalMomentsCount" style="color:var(--on-surface-variant); font-weight: 600;">0</span> <span id="summaryMomentsSuffix" style="font-size: 12px; opacity: 0.8;">순간들</span></div>
              
              <div style="margin-top: 8px; border-top: 1px solid var(--outline-variant); padding-top: 16px;">
                <label style="font-size: 11px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 8px;">정렬 설정</label>
                <select id="sortTreesSelect" class="summary-sort-control" style="padding:10px 12px;border-radius:12px;border:1px solid var(--outline-variant);font-size:13px;cursor:pointer;background:white;width:100%;">
                  <option id="sortRecentOption" value="recent">최근 수정순</option>
                  <option id="sortOldestOption" value="oldest">생성순</option>
                  <option id="sortNameOption" value="name">이름순</option>
                </select>
              </div>
            </div>

            <div class="manage-summary-selected" style="margin-top: 12px;">
              <div class="manage-selected-copy">
                <div class="manage-selected-label" id="manageSelectedTreeLabel">선택된 트리</div>
                <div class="manage-selected-title" id="manageSelectedTreeName" style="font-size: 0.9rem;">트리를 골라보세요</div>
                <div class="manage-selected-meta" id="manageSelectedTreeMeta"></div>
              </div>
              <div class="manage-selected-actions" style="display: grid; grid-template-columns: 1fr; gap: 8px; width: 100%;">
                <button class="manage-action-btn secondary" id="manageOpenBtn" disabled>다시 열기</button>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                  <button class="manage-action-btn secondary" id="manageVisibilityBtn" disabled>공개 설정</button>
                  <button class="manage-action-btn primary" id="manageRenameBtn" disabled>이름 변경</button>
                </div>
                <button class="manage-action-btn danger" id="manageDeleteBtn" disabled>트리 삭제</button>
              </div>
            </div>
          </div>
        </aside>

        <section class="dashboard-main">
          <div id="treesContainer">
            <div id="state-loading" class="trees-loading" style="display: flex;"><div class="spinner"></div><span class="loading-text" data-i18n="myTrees.loading">러브트리 목록을 불러오는 중...</span></div>
            <div id="state-error" class="error-state" style="display: none;"><span class="material-symbols-outlined error-state-icon">error</span><h2 data-i18n="myTrees.error_title">불러오기에 실패했습니다</h2><p data-i18n="myTrees.error_desc">네트워크 연결을 확인하고 다시 시도해주세요.</p><button class="btn-round btn-primary" id="retryLoadBtn" data-i18n="myTrees.retry">다시 시도</button></div>
            <div id="state-empty" class="empty-state" style="display: none;"><span class="material-symbols-outlined empty-state-icon">account_tree</span><h2 data-i18n="empty_state_title">아직 러브트리가 없어요</h2><p data-i18n="empty_state_desc">첫 러브트리를 만들어 시작해보세요.</p><button class="btn-create-tree" id="createTreeBtn"><span class="material-symbols-outlined" style="font-size:20px;">add_circle</span><span data-i18n="create_tree_btn">새 러브트리 만들기</span></button></div>
            <div id="state-loaded" style="display: none;"></div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <div class="create-tree-modal-backdrop" id="createTreeModalBackdrop" aria-hidden="true">
    <div class="create-tree-modal" role="dialog" aria-modal="true" aria-labelledby="createTreeModalTitle">
      <div class="create-tree-modal-header">
        <div>
          <div class="create-tree-modal-kicker"><span class="material-symbols-outlined" style="font-size:14px;">favorite</span><span data-i18n="myTrees.create_modal_kicker">새 러브트리 시작</span></div>
          <h2 class="create-tree-modal-title" id="createTreeModalTitle" data-i18n="myTrees.create_modal_title">어떤 러브트리를 남길까요?</h2>
          <p class="create-tree-modal-desc" data-i18n="myTrees.create_modal_desc">이름을 정하고 첫 순간을 남겨요.</p>
        </div>
        <button type="button" class="create-tree-modal-close" id="createTreeModalCloseBtn" aria-label="닫기">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form class="create-tree-modal-form" id="createTreeModalForm">
        <div class="create-tree-field">
          <label class="create-tree-label" for="createTreeTitleInput" data-i18n="myTrees.create_modal_name_label">트리 제목</label>
          <input class="create-tree-input" id="createTreeTitleInput" type="text" maxlength="200" placeholder="예: 사랑하게 된 모든 순간" aria-describedby="createTreeTitleHelp createTreeModalError" />
          <div class="create-tree-help" id="createTreeTitleHelp" data-i18n="myTrees.create_modal_name_help">제목은 나중에 바꿀 수 있어요.</div>
          <div class="create-tree-error" id="createTreeModalError" aria-live="polite"></div>
        </div>
        <div class="create-tree-field">
          <div class="create-tree-label" data-i18n="myTrees.create_modal_visibility_label">공개 범위</div>
          <div class="create-tree-visibility">
