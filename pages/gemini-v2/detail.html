<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>순간의 기록 | LoveTree</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/gemini-v2/detail.css">
</head>
<body>
    <div class="canvas detail-canvas">
        <header class="topbar">
            <a href="index.html" class="logo">LoveTree</a>
            <nav class="nav">
                <a href="index.html" class="nav-link">첫 화면</a>
                <a href="intro.html" class="nav-link">소개</a>
                <a href="search.html" class="nav-link">둘러보기</a>
                <a href="../my-trees.html" class="nav-link">내 러브트리</a>
            </nav>
            <a href="../login.html" class="btn-login">로그인</a>
        </header>

        <nav class="back-bar">
            <a href="search.html" class="btn-back">← 돌아가기</a>
        </nav>

        <section class="media-stage">
            <div class="play-circle">▶</div>
        </section>

        <main class="narrative">
            <header class="meta-info">
                <span class="date-label">April 12, 2026</span>
                <h1 class="moment-title">이름도 모르던 그 영상</h1>
            </header>

            <article class="memo-paper">
                <div class="memo-text">
                    처음엔 그냥 유튜브 알고리즘에 떠서 우연히 클릭했어요. <br>
                    무대 위에서 저렇게 행복하게 웃는 사람이 누구지? 하는 호기심이 생겼던 순간입니다. <br>
                    그 웃음 하나가 제 일상의 풍경을 이렇게나 바꿀 줄은 몰랐어요. <br>
                    앞으로 이 트리가 어떻게 자라날지, 저도 참 기대가 됩니다.
                </div>
            </article>
        </main>

        <section class="connections">
            <span class="section-label">CONNECTED MOMENTS</span>
            <div class="node-scroll">
                <article class="polaroid" style="--r: -2deg;">
                    <div class="pol-img" style="background: #F2EBE5;"></div>
                    <div class="pol-cap">첫 설렘의 순간</div>
                </article>
                <article class="polaroid" style="--r: 3deg;">
                    <div class="pol-img" style="background: #E5E9F2;"></div>
                    <div class="pol-cap">밤새 보던 직캠</div>
                </article>
                <article class="polaroid" style="--r: -1deg;">
                    <div class="pol-img" style="background: #E5F2EA;"></div>
                    <div class="pol-cap">잊지 못할 가사</div>
                </article>
            </div>
        </section>

        <div class="action-bar">
            <a href="#" class="action-btn">
                <span class="action-icon">❤️</span>
                <span>공감하기</span>
            </a>
            <a href="#" class="action-btn">
                <span class="action-icon">💬</span>
                <span>이야기</span>
            </a>
            <a href="#" class="action-btn">
                <span class="action-icon">↗️</span>
                <span>공유</span>
            </a>
        </div>
