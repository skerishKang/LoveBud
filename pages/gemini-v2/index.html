<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveTree | 좋아하는 순간이 자라나는 곳</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/gemini-v2/home.css">
</head>
<body>
    <div class="canvas">
        <header class="topbar">
            <a href="index.html" class="logo">LoveTree</a>
            <nav class="nav">
                <a href="index.html" class="nav-link">첫 화면</a>
                <a href="intro.html" class="nav-link">소개</a>
                <a href="search.html" class="nav-link">둘러보기</a>
                <a href="../my-trees.html" class="nav-link">내 러브트리</a>
            </nav>
            <a href="../login.html" class="btn-login">로그인</a>
        </header>

        <main class="hero">
            <div class="hero-copy">
                <span class="eyebrow">MOMENT BY MOMENT</span>
                <h1 class="title">
                    좋아하는 순간을<br>
                    <span>하나의 러브트리로</span><br>
                    천천히 이어가세요
                </h1>
                <p class="subtitle">
                    입덕의 첫 설렘, 오래 남은 한 장면, 다시 듣게 되는 노래까지.<br>
                    러브트리는 흩어진 감정을 한곳에 모아 당신만의 흐름으로 자라게 합니다.
                </p>
                <div class="hero-actions">
                    <a href="../my-trees.html" class="btn-main">내 러브트리 시작하기</a>
                    <a href="search.html" class="btn-sub">공개 트리 둘러보기</a>
                </div>
            </div>

            <div class="visual">
                <!-- Decorative Sparkles -->
                <span class="sparkle" style="top: 10%; right: 20%;">✦</span>
                <span class="sparkle" style="bottom: 15%; left: 10%;">✦</span>
                
                <!-- Organic Tree Curve -->
                <svg class="tree-svg" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M150 300 C 300 300, 350 150, 450 150" stroke="#B37E6F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 8" />
                    <path d="M150 300 C 300 300, 350 450, 450 450" stroke="#B37E6F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 8" />
                    <path d="M450 150 C 550 150, 650 300, 750 300" stroke="#B37E6F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 8" />
                    <path d="M450 450 C 550 450, 650 300, 750 300" stroke="#B37E6F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 8" />
                </svg>

                <!-- Heart Connectors -->
                <span class="heart" style="left: 300px; top: 220px;">❤️</span>
                <span class="heart" style="left: 300px; top: 370px;">❤️</span>
                <span class="heart" style="left: 600px; top: 220px;">❤️</span>
                <span class="heart" style="left: 600px; top: 370px;">❤️</span>

                <!-- Floating Memory Nodes -->
                <div class="memory-node node-1">
                    <div class="node-img" style="background: #F2EBE5;"></div>
                    <div class="node-title">첫 설렘의 순간</div>
                </div>
                <div class="memory-node node-2">
                    <div class="node-img" style="background: #E5E9F2;"></div>
                    <div class="node-title">밤새 보던 직캠</div>
                </div>
                <div class="memory-node node-3">
                    <div class="node-img" style="background: #E5F2EA;"></div>
                    <div class="node-title">잊지 못할 가사</div>
                </div>
                <div class="memory-node node-4">
                    <div class="node-img" style="background: #F2E5ED;"></div>
                    <div class="node-title">우리의 성장</div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
