<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>러브트리 편집 | Lovetree</title>
    <link rel="stylesheet" href="../css/editor.css?v=20260415-7">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
</head>
<body>
    <div class="noise-overlay"></div>
    
    <!-- Shared Header -->
    <div id="shared-header"></div>

    <div class="editor-layout">
        <aside class="sidebar">
            <div class="tool-group">
                <h3>현재 상태</h3>
                <div class="tool-item active" title="러브트리를 보고 편집하는 모드입니다">
                    <span class="material-symbols-outlined">account_tree</span>
                    <span>트리 보기/편집</span>
                </div>
                <div class="tool-item disabled" title="준비 중인 기능입니다" style="opacity:0.4;cursor:not-allowed;pointer-events:none;">
                    <span class="material-symbols-outlined" style="background:var(--surface-container-low);color:var(--outline);">visibility</span>
                    <span>미리보기 (준비중)</span>
                </div>
            </div>

            <div class="tool-group" style="margin-top: auto;">
                <h3>추가</h3>
                <div class="tool-item" id="addMemoryBtn">
                    <span class="material-symbols-outlined" style="background: var(--primary); color: white;">add</span>
                    <span>영상 추가</span>
                </div>
            </div>
        </aside>

        <main class="canvas-area" id="canvasArea">
            <svg class="canvas-svg" id="canvasSvg"></svg>
            <!-- JS dynamic content -->

            <!-- 새 기억 입력 폼 (prompt 대체) -->
            <div id="addMemoryForm" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 32px; border-radius: 2rem; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 1px solid var(--outline-variant); width: 90%; max-width: 420px; z-index: 100;">
                <h3 class="headline" style="font-size: 1.4rem; margin-bottom: 24px; display: flex; align-items: center; gap: 8px;">
                    <span class="material-symbols-outlined" style="color: var(--primary);">add_circle</span>
                    새 기억 추가
                </h3>
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 12px; font-weight: 700; color: var(--on-surface-variant); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">YouTube 링크</label>
                    <input type="text" id="memoryUrlInput" placeholder="https://www.youtube.com/watch?v=..." style="width: 100%; padding: 12px 16px; border: 1px solid var(--outline-variant); border-radius: 1rem; font-size: 14px; font-family: inherit;">
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 12px; font-weight: 700; color: var(--on-surface-variant); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">제목</label>
                    <input type="text" id="memoryTitleInput" placeholder="이 기억의 제목을 입력하세요" style="width: 100%; padding: 12px 16px; border: 1px solid var(--outline-variant); border-radius: 1rem; font-size: 14px; font-family: inherit;">
                </div>
                <div style="margin-bottom: 24px;">
                    <label style="display: block; font-size: 12px; font-weight: 700; color: var(--on-surface-variant); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">메모 (선택)</label>
                    <textarea id="memoryMemoInput" placeholder="이 순간의 감정을 남겨보세요..." rows="3" style="width: 100%; padding: 12px 16px; border: 1px solid var(--outline-variant); border-radius: 1rem; font-size: 14px; font-family: inherit; resize: vertical;"></textarea>
                </div>
                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <button id="cancelAddMemory" class="btn-round btn-outline" style="padding: 10px 20px; font-size: 13px;">취소</button>
                    <button id="confirmAddMemory" class="btn-round btn-primary" style="padding: 10px 20px; font-size: 13px;">추가하기</button>
                </div>
            </div>
        </main>

        <aside class="detail-panel" id="detailPanel">
            <div class="panel-header">
                <h3 class="headline" style="font-size: 1.5rem;">순간 상세</h3>
                <button class="icon-btn" id="detailMoreBtn" style="display: none;"><span class="material-symbols-outlined">more_horiz</span></button>
            </div>

            <div class="detail-content" id="detailContent">
                <!-- 읽기 모드 -->
                <div id="detailViewMode">
                    <div class="detail-video">
                        <img id="detailImg" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJb2reehtYkk1tSupKcTenf09sFrI1MN_2H_orLdE8A1rOAlc27BWm62BVBav5qtwxTUJ7ctbr2bDNmU2EfruV9ajOc0QCzABvXJ5-qWXAeR8GOQumFqygnon2pN6L7Wc3UJvG-f9dh26hzO_bnWAoTverOtXlPKc4AqL95xSgqIwuVjm5Pb_eQ8gJI5kv4se7YvCHY5v3jZ5m1n6OzaavO3FKOfXk35Bs0O-w4R19eHXM2fn2Lr1bS2uizoWLcKYYZOKGHH6COFc" alt="Preview">
                        <div class="play-overlay"><span class="material-symbols-outlined">play_arrow</span></div>
                    </div>

                    <div class="detail-info-group">
                        <label>기억한 날</label>
                        <p id="detailDateText">2024.03.14</p>
                    </div>

                    <div class="detail-info-group">
                        <label>감정 태그</label>
                        <div class="tags-container" id="detailTags">
                            <span class="tag tag-primary">강렬한</span>
                            <span class="tag tag-secondary">환희</span>
                        </div>
                    </div>

                    <div class="detail-info-group">
                        <label>감정 메모</label>
                        <div class="diary-note" id="detailMemo">
                            "마지막 앙코르 곡이 울려 퍼질 때, 그 순간의 공기와 팬들의 함성 소리가 아직도 생생해."
                        </div>
                    </div>

                    <!-- 수정/삭제 버튼 영역 -->
                    <div class="detail-actions" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--outline-variant); display: flex; gap: 8px;">
                        <button id="editMemoryBtn" class="btn-round btn-outline" style="flex: 1; padding: 10px 16px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px;">
                            <span class="material-symbols-outlined" style="font-size: 16px;">edit</span>
                            순간 수정
                        </button>
                        <button id="deleteMemoryBtn" class="btn-round btn-outline" style="flex: 1; padding: 10px 16px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--error); border-color: var(--error);">
                            <span class="material-symbols-outlined" style="font-size: 16px;">delete</span>
                            순간 삭제
                        </button>
                    </div>
                </div>

                <!-- 편집 모드 -->
                <div id="detailEditMode" style="display: none;">
                    <div class="detail-info-group">
                        <label>제목</label>
                        <input type="text" id="editTitleInput" style="width: 100%; padding: 10px 12px; border: 1px solid var(--outline-variant); border-radius: 8px; font-size: 14px; font-family: inherit;" placeholder="순간의 제목을 입력하세요">
                    </div>

                    <div class="detail-info-group">
                        <label>감정 메모</label>
                        <textarea id="editMemoInput" rows="4" style="width: 100%; padding: 10px 12px; border: 1px solid var(--outline-variant); border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical;" placeholder="이 순간의 감정을 남겨보세요..."></textarea>
                    </div>

                    <div class="detail-info-group">
                        <label>감정 태그 (쉼표로 구분)</label>
                        <input type="text" id="editTagsInput" style="width: 100%; padding: 10px 12px; border: 1px solid var(--outline-variant); border-radius: 8px; font-size: 14px; font-family: inherit;" placeholder="#감동, #행복, #그리움">
                    </div>

                    <!-- 편집 모드 버튼 -->
                    <div class="detail-actions" style="margin-top: 24px; display: flex; gap: 8px;">
                        <button id="cancelEditBtn" class="btn-round btn-outline" style="flex: 1; padding: 10px 16px; font-size: 13px;">취소</button>
                        <button id="saveEditBtn" class="btn-round btn-primary" style="flex: 1; padding: 10px 16px; font-size: 13px;">저장하기</button>
                    </div>
                </div>
            </div>

            <div class="panel-footer" id="detailPanelFooter" style="display: none;">
                <button class="btn-round btn-primary" style="width: 100%;">내 러브트리에 기록하기</button>
            </div>
        </aside>
    </div>

    <script src="../js/mock-data.js?v=20260418-1"></script>
    <script src="../js/cache-utils.js?v=20260418-1"></script>
    <script src="../js/utils/normalize.js?v=20260418-1"></script>
    <script src="../js/utils/path.js?v=20260418-1"></script>
    <script src="../js/utils/ui.js?v=20260418-1"></script>
    <script src="../js/utils/media.js?v=20260418-1"></script>
    <script src="../js/editor/editor-root-helpers.js?v=20260418-1"></script>
    <script src="../js/postgres-client.js?v=20260418-1"></script>
    <script src="../js/editor.js?v=20260418-1"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="../js/firebase-config.js?v=20260417-31"></script>
    <script src="../js/i18n.js?v=20260417-31"></script>
    <script src="../js/shared-header.js?v=20260417-31"></script>
    <script src="../js/auth.js?v=20260417-31"></script>
    <script>renderSharedHeader();</script>
</body>
</html>
