<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>러브트리 편집 | LoveTree</title>
    <link rel="stylesheet" href="../css/editor.css?v=20260420-1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
</head>
<body class="editor-preload">
    <div class="noise-overlay"></div>

    <div id="shared-header"></div>

    <div class="editor-layout">
        <aside class="sidebar">
            <section class="editor-status-section">
                <h3 id="editorFlowHeading">러브트리</h3>
                <div class="editor-status-card">
                    <div class="editor-space-between-row">
                        <strong id="sidebarTreeTitle">LoveTree</strong>
                        <button type="button" id="renameTreeBtn" class="icon-menu-btn editor-rename-btn" aria-label="트리 제목 변경" title="트리 제목 변경">✎</button>
                    </div>
                    <p id="sidebarMomentCount"></p>
                    <p id="sidebarFlowSummary" class="editor-flow-summary"></p>
                    <span id="sidebarSelectionHint" class="editor-sidebar-meta"></span>
                </div>
                <div class="editor-sidebar-actions">
                    <button type="button" class="sidebar-btn" id="focusSelectedBtn" disabled style="opacity:0.5;cursor:not-allowed;">
                        <span class="btn-icon">→</span>
                        <span class="btn-label" id="focusSelectedBtnLabel">선택</span>
                    </button>
                    <button type="button" class="sidebar-btn" id="recenterCanvasBtn">
                        <span class="btn-icon">⌂</span>
                        <span class="btn-label" id="recenterCanvasBtnLabel">트리</span>
                    </button>
                </div>
            </section>

            <section class="editor-add-section" style="margin-top: auto;">
                <button type="button" class="sidebar-btn sidebar-btn-primary" id="addMemoryBtn">
                    <span class="btn-icon">+</span>
                    <span class="btn-label" id="addMemoryBtnLabel">추가</span>
                </button>
            </section>
        </aside>

        <main class="canvas-area" id="canvasArea">
            <svg class="canvas-svg" id="canvasSvg"></svg>

            <div id="addMemoryForm" class="memory-create-section editor-memory-form-modal">
                <h3 class="headline editor-modal-title" id="addMemoryFormTitle">...</h3>
                <div class="editor-form-field">
                    <label id="memoryUrlLabel" class="editor-form-label">...</label>
                    <input type="text" id="memoryUrlInput" placeholder="https://www.youtube.com/watch?v=..." class="editor-form-input">
                </div>
                <div class="editor-form-field">
                    <label id="memoryTitleLabel" class="editor-form-label">...</label>
                    <input type="text" id="memoryTitleInput" placeholder="..." class="editor-form-input">
                </div>
                <div class="editor-form-field-last">
                    <label id="memoryMemoLabel" class="editor-form-label">...</label>
                    <textarea id="memoryMemoInput" placeholder="..." rows="3" class="editor-form-textarea"></textarea>
                </div>
                <div class="editor-form-actions">
                    <button id="cancelAddMemory" class="btn-round btn-outline editor-form-action-btn">...</button>
                    <button id="confirmAddMemory" class="btn-round btn-primary editor-form-action-btn">...</button>
                </div>
            </div>
        </main>

        <aside class="detail-panel memory-detail-section" id="detailPanel">
            <div class="panel-header">
                <h3 class="headline editor-panel-headline"></h3>
                <button type="button" class="icon-menu-btn editor-hidden-initial" aria-label="더보기" id="detailMoreBtn">더보기</button>
            </div>

            <div class="detail-content" id="detailContent">
                <div id="detailEmptyState" class="editor-visible-initial">
                    <div class="editor-empty-state-box">
                        <span class="material-symbols-outlined editor-empty-state-icon">sentiment_satisfied</span>
                        <p id="detailEmptyTitle" class="editor-empty-state-title"></p>
                        <p id="detailEmptyDesc" class="editor-empty-state-desc"></p>
                    </div>
                </div>

                <div id="detailViewMode" class="editor-hidden-initial">
                    <div class="detail-video">
                        <img id="detailImg" src="" alt="">
                        <div class="memory-preview-overlay">
                            <button type="button" class="play-btn" aria-label="재생">재생</button>
                        </div>
                    </div>

                    <div class="detail-info-group">
                        <label id="detailDateLabel">...</label>
                        <p id="detailDateText"></p>
                    </div>

                    <div class="detail-info-group">
                        <label id="detailTagsLabel">...</label>
                        <div class="tags-container" id="detailTags"></div>
                    </div>

                    <div class="detail-info-group">
                        <label id="detailMemoLabel">...</label>
                        <div class="diary-note" id="detailMemo"></div>
                    </div>

                    <div class="memory-actions editor-memory-actions-row">
                        <button id="editMemoryBtn" class="btn-round btn-outline editor-memory-action-btn">...</button>
                        <button id="deleteMemoryBtn" class="btn-round btn-outline editor-memory-action-btn editor-memory-delete-btn">...</button>
                    </div>

                    <div id="saveStatusIndicator" class="save-status-indicator save-status editor-save-status-wrap" aria-live="polite">
                        <span id="saveStatusIcon" class="editor-save-status-icon-hidden"></span>
                        <span id="saveStatusText">저장됨</span>
                        <span id="lastSavedTime" class="last-saved-time"></span>
                    </div>
                </div>

                <div id="detailEditMode" class="editor-hidden-initial">
                    <div class="detail-info-group">
                        <label id="editTitleLabel">...</label>
                        <input type="text" id="editTitleInput" class="editor-edit-input" placeholder="...">
                    </div>

                    <div class="detail-info-group">
                        <label id="editMemoLabel">...</label>
                        <textarea id="editMemoInput" rows="4" class="editor-edit-textarea" placeholder="..."></textarea>
                    </div>

                    <div class="detail-info-group">
                        <label id="editTagsLabel">...</label>
                        <input type="text" id="editTagsInput" class="editor-edit-input" placeholder="...">
                    </div>

                    <div class="detail-actions editor-edit-actions-row">
                        <button id="cancelEditBtn" class="btn-round btn-outline editor-edit-action-btn">...</button>
                        <button id="saveEditBtn" class="btn-round btn-primary editor-edit-action-btn">...</button>
                    </div>
                </div>
            </div>

            <div class="panel-footer editor-submit-wrap editor-submit-footer" id="detailPanelFooter">
                <button type="submit" class="primary-btn editor-submit-btn-full" id="detailSubmitBtn">...</button>
            </div>
        </aside>
    </div>

    <script src="../js/mock-data.js?v=20260418-1"></script>
    <script src="../js/cache-utils.js?v=20260418-1"></script>
    <script src="../js/utils/normalize.js?v=20260418-1"></script>
    <script src="../js/utils/path.js?v=20260418-1"></script>
    <script src="../js/utils/ui.js?v=20260418-1"></script>
    <script src="../js/utils/media.js?v=20260418-1"></script>
    <script src="../js/editor/editor-root-helpers.js?v=20260418-1"></script>
    <script src="../js/editor/editor-canvas-layout.js?v=20260420-1"></script>
    <script src="../js/editor/editor-canvas-node.js?v=20260420-1"></script>
    <script src="../js/editor/editor-canvas-interaction.js?v=20260420-1"></script>
    <script src="../js/editor/editor-canvas.js?v=20260420-5"></script>
    <script src="../js/editor/editor-rename-ui.js?v=20260420-1"></script>
    <script src="../js/editor/editor-detail-ui.js?v=20260420-4"></script>
    <script src="../js/editor/editor-memory-actions.js?v=20260419-1"></script>
    <script src="../js/editor/editor-memory-form.js?v=20260419-1"></script>
    <script src="../js/api/auth-policy.js?v=20260420-1"></script>
    <script src="../js/api/base-api-fetch.js?v=20260420-1"></script>
    <script src="../js/postgres-client.js?v=20260420-2"></script>
    <script src="../js/editor/editor-helpers.js?v=20260420-1"></script>
    <script src="../js/editor/editor-save-status.js?v=20260420-1"></script>
    <script src="../js/editor/editor-page-helpers.js?v=20260420-1"></script>
    <script src="../js/editor/editor-tree-helpers.js?v=20260420-1"></script>
    <script src="../js/editor/editor-bindings.js?v=20260420-1"></script>
    <script src="../js/editor/editor-auth-helpers.js?v=20260420-1"></script>
    <script src="../js/editor/editor-data-loader.js?v=20260420-1"></script>
    <script src="../js/editor.js?v=20260420-10"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="../js/firebase-config.js?v=20260417-31"></script>
    <script src="../js/i18n/i18n-core.js?v=20260419-2"></script>
    <script src="../js/i18n/i18n-shared.js?v=20260419-2"></script>
    <script src="../js/i18n/i18n-login.js?v=20260419-2"></script>
    <script src="../js/i18n/i18n-intro.js?v=20260419-2"></script>
    <script src="../js/i18n/i18n-search.js?v=20260419-2"></script>
    <script src="../js/i18n/i18n-detail.js?v=20260419-2"></script>
    <script src="../js/i18n/i18n-editor.js?v=20260420-3"></script>
    <script src="../js/i18n/i18n-my-trees.js?v=20260419-2"></script>
    <script src="../js/i18n/i18n-index.js?v=20260419-2"></script>
    <script src="../js/i18n.js?v=20260419-2"></script>
    <script src="../js/shared-header.js?v=20260417-31"></script>
    <script src="../js/auth/auth-state.js?v=20260417-31"></script>
    <script src="../js/auth/auth-callbacks.js?v=20260417-31"></script>
    <script src="../js/auth/auth-cache.js?v=20260417-31"></script>
    <script src="../js/auth/auth-ui.js?v=20260417-31"></script>
    <script src="../js/auth/auth-session.js?v=20260417-31"></script>
    <script src="../js/auth/auth-firebase.js?v=20260420-1"></script>
    <script src="../js/auth.js?v=20260417-31"></script>
    <script>renderSharedHeader();</script>
</body>
</html>
