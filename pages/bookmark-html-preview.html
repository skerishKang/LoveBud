<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>북마크 미리보기 | LoveTree</title>
  <link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/global.css?v=20260817-4072-1">
  <link rel="stylesheet" href="../css/bookmark-html-preview.css?v=20260817-4072-1">
</head>
<body class="bokeh-bg">
  <div class="noise-overlay"></div>
  <main class="bh-surface">
    <h1 class="bh-title-heading">북마크 미리보기</h1>
    <p class="bh-help">브라우저(Chrome/Edge/Firefox)에서 내보낸 북마크 HTML 파일을 선택하면 <strong>로컬에서만</strong> 미리보기해요. 파일은 서버로 전송되지 않아요.</p>

    <div class="bh-controls">
      <input type="file" id="bookmarkHtmlFileInput" class="bh-file-input" accept=".html,.htm" />
      <label class="bh-file-label" for="bookmarkHtmlFileInput">북마크 HTML 파일 선택</label>
      <button type="button" class="bh-reset-btn" id="bookmarkHtmlResetBtn">초기화</button>
      <button type="button" class="bh-select-all-btn" id="bookmarkHtmlSelectAllBtn">지원 항목 모두 선택</button>
      <button type="button" class="bh-clear-btn" id="bookmarkHtmlClearBtn">선택 해제</button>
    </div>

    <p class="bh-status" id="bookmarkHtmlStatus" role="status" aria-live="polite" hidden></p>
    <p class="bh-selected-count" id="bookmarkHtmlSelectedCount" role="status" aria-live="polite" hidden></p>
    <p class="bh-error" id="bookmarkHtmlError" role="alert" aria-live="polite" hidden></p>
    <div class="bh-preview" id="bookmarkHtmlPreview" aria-label="북마크 미리보기 목록"></div>
  </main>

  <script src="../js/import/bookmark-html-preview-parser.js?v=20260817-4065-1"></script>
  <script src="../js/import/bookmark-html-preview-ui.js?v=20260817-4072-1"></script>
</body>
</html>
