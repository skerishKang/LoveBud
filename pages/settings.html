<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설정 | 러브트리</title>
    <link rel="stylesheet" href="../css/global.css?v=20260417-31">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
  <style>
    .settings-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .settings-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .settings-card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--outline-variant);
      box-shadow: var(--shadow-whisper);
      padding: 48px;
      position: relative;
    }

    .settings-close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(144, 73, 81, 0.18);
      background: rgba(255, 255, 255, 0.96);
      color: var(--on-surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 24px rgba(75, 64, 57, 0.08);
      z-index: 2;
      font-size: 24px;
      font-weight: 500;
      line-height: 1;
      padding: 0;
    }

    .settings-close-btn:hover {
      border-color: var(--primary-soft);
      color: var(--primary);
      background: var(--surface-container-low);
      transform: translateY(-1px);
    }

    .settings-close-glyph {
      display: inline-block;
      transform: translateY(-1px);
    }

    .settings-card h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--on-surface);
      margin-bottom: 8px;
      letter-spacing: -0.03em;
    }

    .settings-subtitle {
      color: var(--on-surface-variant);
      font-size: 0.95rem;
      margin-bottom: 40px;
      line-height: 1.5;
      max-width: 320px;
    }

    .settings-section {
      margin-bottom: 32px;
    }

    .settings-section:last-of-type {
      margin-bottom: 0;
    }

    .settings-section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--on-surface);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-section-title .material-symbols-outlined {
      font-size: 20px;
      color: var(--primary);
    }

    .settings-scope-note {
      margin: -6px 0 16px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--surface-container-low);
      color: var(--on-surface-variant);
      font-size: 13px;
      line-height: 1.55;
    }

    .settings-intro-card,
    .settings-plus-card {
      display: flex;
      gap: 14px;
      padding: 16px;
      border-radius: var(--radius-default);
      border: 1px solid rgba(144, 73, 81, 0.14);
      background: rgba(255, 248, 249, 0.72);
    }

    .settings-plus-card {
      margin-top: 12px;
      background: var(--surface-container-low);
      border-color: var(--outline-variant);
    }

    .settings-intro-icon,
    .settings-plus-icon {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      background: rgba(144, 73, 81, 0.10);
      color: var(--primary);
    }

    .settings-plus-icon {
      background: rgba(122, 139, 110, 0.10);
      color: var(--secondary);
    }

    .settings-intro-title,
    .settings-plus-title {
      display: block;
      margin-bottom: 6px;
      color: var(--on-surface);
      font-size: 0.95rem;
      font-weight: 800;
    }

    .settings-intro-desc,
    .settings-plus-desc {
      display: block;
      color: var(--on-surface-variant);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .settings-divider {
      height: 1px;
      background: var(--outline-variant);
      margin: 32px 0;
    }

    .logout-btn {
      width: 100%;
      padding: 16px 24px;
      border-radius: var(--radius-full);
      border: 1px solid var(--outline-variant);
      background: var(--surface);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .logout-btn:hover {
      background: var(--surface-container);
      border-color: var(--primary-soft);
    }

    .logout-btn .material-symbols-outlined {
      font-size: 20px;
    }

    /* Mobile */
    @media (max-width: 640px) {
      .settings-content {
        padding: 24px 16px;
      }

      .settings-card {
        padding: 32px 24px;
      }

      .settings-card h1 {
        font-size: 1.5rem;
      }

      .settings-close-btn {
        top: 14px;
        right: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="noise-overlay"></div>
  
  <div class="settings-layout">
    <div id="shared-header"></div>
    
    <main class="settings-content" id="settingsContent">
      <div class="settings-card" id="settingsCard" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <button type="button" class="settings-close-btn" id="settingsCloseBtn" aria-label="설정 닫기" title="닫기">
          <span class="settings-close-glyph" aria-hidden="true">×</span>
        </button>
        <h1 id="settingsTitle">설정</h1>
        <p class="settings-subtitle">러브트리를 어떻게 소개할지 살펴봅니다</p>
        
        <div class="settings-section">
          <div class="settings-section-title" id="settingsBrowseIntroTitle">
            <span class="material-symbols-outlined">travel_explore</span>
            둘러보기 소개
          </div>
          <div class="settings-intro-card" id="settingsBrowseIntroCard">
            <span class="settings-intro-icon material-symbols-outlined" aria-hidden="true">psychiatry</span>
            <span>
              <span class="settings-intro-title" id="settingsBrowseIntroCardTitle">둘러보기에 소개될 트리로 키우기</span>
              <span class="settings-intro-desc" id="settingsBrowseIntroDesc">좋아하는 순간을 3개 이상 남기면 이 트리를 둘러보기에 소개할 수 있어요. 소개 여부는 각 러브트리에서 조건을 채운 뒤 선택할 수 있어요.</span>
            </span>
          </div>
          <div class="settings-plus-card" id="settingsPlusCard">
            <span class="settings-plus-icon material-symbols-outlined" aria-hidden="true">lock</span>
            <span>
              <span class="settings-plus-title" id="settingsPlusTitle">프라이빗 보관</span>
              <span class="settings-plus-desc" id="settingsPlusDesc">나만 보는 러브트리를 조용히 보관하는 기능은 Plus에서 준비 중이에요.</span>
            </span>
          </div>
        </div>
        
        <div class="settings-divider"></div>
        
        <div class="settings-section">
          <button class="logout-btn" onclick="handleLogout()">
            <span class="material-symbols-outlined">logout</span>
            로그아웃
          </button>
        </div>
      </div>
    </main>
  </div>

    <script src="../js/i18n/i18n-core.js?v=20260421-1"></script>
    <script src="../js/i18n/i18n-shared.js?v=20260425-1"></script>
    <script src="../js/i18n/i18n-index.js?v=20260421-1"></script>
    <script src="../js/i18n.js?v=20260419-2"></script>
    <script src="../js/shared-header.js?v=20260421-2"></script>
     <script src="../js/auth/auth-state.js?v=20260417-31"></script>
     <script src="../js/auth/auth-callbacks.js?v=20260417-31"></script>
     <script src="../js/auth/auth-cache.js?v=20260417-31"></script>
     <script src="../js/auth/auth-ui.js?v=20260421-2"></script>
     <script src="../js/auth/auth-session.js?v=20260417-31"></script>
     <script src="../js/auth/auth-firebase.js?v=20260420-1"></script>
     <script src="../js/auth.js?v=20260417-31"></script>
    <script src="../js/settings.js?v=20260425-1"></script>
  <script>
    renderSharedHeader();
    initSettings();
  </script>
</body>
</html>
