<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설정 | 러브트리</title>
    <link rel="stylesheet" href="../css/global.css?v=20260618-2700-1">
  <link rel="stylesheet" href="../css/components/lovebud-ai-panel.css?v=20260616-ai-panel-1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
  <link rel="stylesheet" href="../css/settings.css?v=20260427-1">
</head>
<body>
  <div class="noise-overlay"></div>

  <div id="shared-header"></div>
  <div class="settings-layout">

    <main class="settings-content" id="settingsContent">
      <div class="settings-card" id="settingsCard" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <button type="button" class="settings-close-btn" id="settingsCloseBtn" aria-label="설정 닫기" title="닫기">
          <span class="settings-close-glyph" aria-hidden="true">×</span>
        </button>
        <h1 id="settingsTitle">설정</h1>
        <p class="settings-subtitle" id="settingsSubtitle"></p>

        <!-- Profile section -->
        <section class="settings-section" id="settingsProfileSection" aria-labelledby="settingsProfileTitle">
          <div class="settings-section-title" id="settingsProfileTitle">
            <span class="material-symbols-outlined">person</span>
            프로필
          </div>
          <div class="settings-profile-card" id="settingsProfileCard">
            <div class="settings-profile-avatar" id="settingsProfileAvatar" role="img" aria-label="프로필 이미지">
            </div>
            <div class="settings-profile-info">
              <div class="settings-profile-name" id="settingsProfileName"></div>
              <div class="settings-profile-email" id="settingsProfileEmail"></div>
            </div>
          </div>
          <p class="settings-deferred-note" id="settingsProfileDeferredNote">프로필 변경 기능은 다음 단계에서 제공됩니다.</p>
        </section>

        <div class="settings-divider"></div>

        <!-- Account section -->
        <section class="settings-section" id="settingsAccountSection" aria-labelledby="settingsAccountTitle">
          <div class="settings-section-title" id="settingsAccountTitle">
            <span class="material-symbols-outlined">manage_accounts</span>
            계정
          </div>
          <dl class="settings-account-list">
            <div class="settings-account-row">
              <dt class="settings-account-label" id="settingsAccountEmailLabel"></dt>
              <dd class="settings-account-value" id="settingsAccountEmailValue"></dd>
            </div>
            <div class="settings-account-row">
              <dt class="settings-account-label" id="settingsAccountIdLabel"></dt>
              <dd class="settings-account-value settings-account-id" id="settingsAccountIdValue"></dd>
            </div>
            <div class="settings-account-row">
              <dt class="settings-account-label" id="settingsAccountSignInLabel"></dt>
              <dd class="settings-account-value" id="settingsAccountSignInValue"></dd>
            </div>
            <div class="settings-account-row">
              <dt class="settings-account-label" id="settingsAccountPasswordLabel"></dt>
              <dd class="settings-account-value settings-account-password" id="settingsAccountPasswordValue"></dd>
            </div>
          </dl>
        </section>

        <div class="settings-divider"></div>

        <!-- Logout section -->
        <section class="settings-section" aria-label="로그아웃">
          <button type="button" class="logout-btn" id="logout-btn">
            <span class="material-symbols-outlined">logout</span>
            로그아웃
          </button>
        </section>

        <div class="settings-divider"></div>

        <p class="settings-deferred-note" id="settingsPlusNote">프라이빗 보관 기능은 Plus에서 준비 중이에요.</p>
      </div>
    </main>
  </div>

    <script src="../js/i18n/i18n-core.js?v=20260421-1"></script>
    <script src="../js/i18n/i18n-shared.js?v=20260425-1"></script>
    <script src="../js/i18n/i18n-index.js?v=20260421-1"></script>
    <script src="../js/i18n.js?v=20260419-2"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="../js/firebase-config.js?v=20260417-31"></script>
    <script src="../js/shared-header.js?v=20260718-3577-1"></script>
     <script src="../js/auth/auth-state.js?v=20260417-31"></script>
     <script src="../js/auth/auth-callbacks.js?v=20260417-31"></script>
     <script src="../js/auth/auth-cache.js?v=20260417-31"></script>
     <script src="../js/auth/auth-ui.js?v=20260421-2"></script>
     <script src="../js/auth/auth-session.js?v=20260417-31"></script>
     <script src="../js/auth/auth-firebase.js?v=20260622-google-mode-1"></script>
     <script src="../js/auth/auth-ui-templates.js?v=20260522-1283"></script>
     <script src="../js/auth.js?v=20260422-3"></script>
     <script src="../js/auth/auth-protected-route.js?v=20260505-828"></script>
    <script src="../js/settings.js?v=20260504-639-stay"></script>
  <script>
    renderSharedHeader();
    initSettings();
  </script>
</body>
</html>
