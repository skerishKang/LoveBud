<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설정 | 러브트리</title>
    <link rel="stylesheet" href="../css/global.css?v=20260417-31">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
  <style>
    .settings-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .settings-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .settings-card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--outline-variant);
      box-shadow: var(--shadow-whisper);
      padding: 48px;
    }

    .settings-card h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--on-surface);
      margin-bottom: 8px;
      letter-spacing: -0.03em;
    }

    .settings-subtitle {
      color: var(--on-surface-variant);
      font-size: 0.95rem;
      margin-bottom: 40px;
      line-height: 1.5;
    }

    .settings-section {
      margin-bottom: 32px;
    }

    .settings-section:last-of-type {
      margin-bottom: 0;
    }

    .settings-section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--on-surface);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-section-title .material-symbols-outlined {
      font-size: 20px;
      color: var(--primary);
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .radio-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
      border-radius: var(--radius-default);
      border: 2px solid var(--outline-variant);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .radio-option:hover {
      border-color: var(--primary-soft);
      background: var(--surface-container-low);
    }

    .radio-option.selected {
      border-color: var(--primary);
      background: rgba(144, 73, 81, 0.04);
    }

    .radio-option input[type="radio"] {
      width: 20px;
      height: 20px;
      margin: 0;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .radio-content {
      flex: 1;
    }

    .radio-label {
      font-weight: 600;
      font-size: 1rem;
      color: var(--on-surface);
      display: block;
      margin-bottom: 4px;
    }

    .radio-description {
      font-size: 0.85rem;
      color: var(--on-surface-variant);
      line-height: 1.4;
    }

    .settings-divider {
      height: 1px;
      background: var(--outline-variant);
      margin: 32px 0;
    }

    .logout-btn {
      width: 100%;
      padding: 16px 24px;
      border-radius: var(--radius-full);
      border: 1px solid var(--outline-variant);
      background: var(--surface);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .logout-btn:hover {
      background: var(--surface-container);
      border-color: var(--primary-soft);
    }

    .logout-btn .material-symbols-outlined {
      font-size: 20px;
    }

    /* Mobile */
    @media (max-width: 640px) {
      .settings-content {
        padding: 24px 16px;
      }

      .settings-card {
        padding: 32px 24px;
      }

      .settings-card h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="noise-overlay"></div>
  
  <div class="settings-layout">
    <div id="shared-header"></div>
    
    <main class="settings-content">
      <div class="settings-card">
        <h1>설정</h1>
        <p class="settings-subtitle">러브트리를 어떻게 공개할지 정합니다</p>
        
        <div class="settings-section">
          <div class="settings-section-title">
            <span class="material-symbols-outlined">visibility</span>
            기본 공개 범위
          </div>
          
          <div class="radio-group">
            <label class="radio-option" id="radio-private">
              <input type="radio" name="visibility" value="private" checked>
              <div class="radio-content">
                <span class="radio-label">비공개</span>
                <span class="radio-description">새로 만드는 러브트리는 기본적으로 나만 볼 수 있어요</span>
              </div>
            </label>
            
            <label class="radio-option" id="radio-public">
              <input type="radio" name="visibility" value="public">
              <div class="radio-content">
                <span class="radio-label">공개</span>
                <span class="radio-description">다른 팬들과 내 러브트리를 공유할 수 있어요</span>
              </div>
            </label>
          </div>
        </div>
        
        <div class="settings-divider"></div>
        
        <div class="settings-section">
          <button class="logout-btn" onclick="handleLogout()">
            <span class="material-symbols-outlined">logout</span>
            로그아웃
          </button>
        </div>
      </div>
    </main>
  </div>

    <script src="../js/shared-header.js?v=20260417-31"></script>
    <script src="../js/auth/auth-state.js?v=20260417-31"></script>
    <script src="../js/auth/auth-callbacks.js?v=20260417-31"></script>
    <script src="../js/auth/auth-cache.js?v=20260417-31"></script>
    <script src="../js/auth/auth-ui.js?v=20260417-31"></script>
    <script src="../js/auth.js?v=20260417-31"></script>
    <script src="../js/settings.js?v=20260417-31"></script>
  <script>
    renderSharedHeader();
    initSettings();
  </script>
</body>
</html>
