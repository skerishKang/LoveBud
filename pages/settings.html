<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설정 | 러브트리</title>
  <link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="stylesheet" href="../css/global.css?v=20260509-994-1">
  <link rel="stylesheet" href="../css/components/lovebud-ai-panel.css?v=20260616-ai-panel-1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
  <link rel="stylesheet" href="../css/settings.css?v=20260427-1">
</head>
<body class="bokeh-bg settings-page">
  <div class="noise-overlay"></div>
  <div id="shared-header"></div>

  <main class="settings-main">
    <div class="settings-card">
      <button class="settings-close" id="settingsClose" aria-label="닫기">
        <span class="material-symbols-outlined">close</span>
      </button>

      <h1 class="settings-title" data-i18n="settings.title">설정</h1>
      <p class="settings-subtitle" data-i18n="settings.subtitle">러브트리를 어떻게 소개할지 살펴봅니다</p>

      <section class="settings-section">
        <h2 class="settings-section-title">
          <span class="material-symbols-outlined">explore</span>
          <span data-i18n="settings.browseSection">둘러보기 소개</span>
        </h2>
        <div class="settings-item">
          <div class="settings-item-icon">
            <span class="material-symbols-outlined">potted_plant</span>
          </div>
          <div class="settings-item-content">
            <strong data-i18n="settings.growTreeTitle">둘러보기에 소개될 트리로 키우기</strong>
            <p data-i18n="settings.growTreeDesc">좋아하는 순간을 3개 이상 남기면 이 트리를 둘러보기에 소개할 수 있어요. 소개 여부는 각 러브트리에서 조건을 채운 뒤 선택할 수 있어요.</p>
          </div>
        </div>
        <div class="settings-item">
          <div class="settings-item-icon">
            <span class="material-symbols-outlined">lock</span>
          </div>
          <div class="settings-item-content">
            <strong data-i18n="settings.privateTitle">프라이빗 보관</strong>
            <p data-i18n="settings.privateDesc">나만 보는 러브트리를 조용히 보관하는 기능은 Plus에서 준비 중이에요.</p>
          </div>
        </div>
      </section>

      <div class="settings-actions">
        <button class="settings-logout-btn" id="settingsLogout">
          <span class="material-symbols-outlined">logout</span>
          <span data-i18n="settings.logout">로그아웃</span>
        </button>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="../js/firebase-config.js?v=20260417-31"></script>
  <script src="../js/i18n/i18n-core.js?v=20260421-1"></script>
  <script src="../js/i18n/i18n-shared.js?v=20260421-4"></script>
  <script src="../js/i18n/i18n-settings.js?v=20260421-1"></script>
  <script src="../js/i18n.js?v=20260419-2"></script>
  <script src="../js/shared-header.js?v=20260421-2"></script>
  <script src="../js/auth/auth-state.js?v=20260417-31"></script>
  <script src="../js/auth/auth-callbacks.js?v=20260417-31"></script>
  <script src="../js/auth/auth-cache.js?v=20260417-31"></script>
  <script src="../js/auth/auth-ui.js?v=20260421-2"></script>
  <script src="../js/auth/auth-session.js?v=20260417-31"></script>
  <script src="../js/auth/auth-firebase.js?v=20260420-1"></script>
  <script src="../js/auth/auth-ui-templates.js?v=20260522-1283"></script>
  <script src="../js/auth.js?v=20260422-3"></script>
  <script src="../js/settings.js?v=20260427-1"></script>
</body>
</html>
