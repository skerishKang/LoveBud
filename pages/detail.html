<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기억 상세 | 러브트리</title>
    <link rel="stylesheet" href="../css/global.css?v=20260415-10">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
    <style>
        .detail-page-shell {
            max-width: 1400px;
            margin: 0 auto;
            padding: 28px 48px 60px;
        }

        .detail-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .detail-back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--on-surface-variant);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: color 0.2s ease;
        }

        .detail-back-link:hover { color: var(--primary); }
        .detail-back-link .material-symbols-outlined { font-size: 18px; }

        .detail-view-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.78);
            border: 1px solid rgba(144, 73, 81, 0.08);
            color: var(--on-surface-variant);
            font-size: 12px;
            font-weight: 700;
        }

        .detail-view-chip .material-symbols-outlined {
            font-size: 16px;
            color: var(--primary);
        }

.detail-hero {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
  padding: 20px 24px;
  border-radius: 1.5rem;
  background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(249,245,242,0.94));
  border: 1px solid rgba(144, 73, 81, 0.08);
  box-shadow: 0 12px 30px rgba(75, 64, 57, 0.04);
}

        .detail-hero-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--primary);
        }

        .detail-hero-title {
            margin: 0;
            font-size: 2.2rem;
            line-height: 1.2;
            color: var(--on-surface);
        }

        .detail-hero-desc {
            margin: 0;
            max-width: 760px;
            font-size: 1rem;
            line-height: 1.7;
            color: var(--on-surface-variant);
        }

        .detail-layout {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 72px;
        }

        .detail-main-media { margin-bottom: 28px; }

        .video-main {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 2.5rem;
            overflow: hidden;
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.2);
            margin-bottom: 24px;
        }

        .detail-memory-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 13px;
            color: var(--on-surface-variant);
        }

        .detail-meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.78);
            border: 1px solid rgba(144, 73, 81, 0.08);
        }

        .detail-meta-pill .material-symbols-outlined {
            font-size: 16px;
            color: var(--primary);
        }

        .connected-section { margin-top: 72px; }
.connected-section.is-empty .growth-visualization,
.connected-section.is-empty .growth-line { display: none; }
.connected-section.is-solo .moment-card { max-width: 480px; }
.connected-section.is-solo .connected-summary { display: none; }
.connected-section.is-threaded .moment-card { grid-column: span 1; }

        .connected-heading {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        .connected-kicker {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--primary);
        }

        .connected-section h3 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .connected-summary {
            margin: 0;
            color: var(--on-surface-variant);
            font-size: 0.96rem;
            line-height: 1.6;
        }

        .moment-card {
            background: white;
            padding: 24px;
            border-radius: 2rem;
            border: 1px solid rgba(0,0,0,0.03);
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .moment-card:hover {
            transform: translateY(-4px);
            border-color: var(--outline-variant);
            box-shadow: var(--shadow-whisper);
        }

        .detail-side-intro { margin-bottom: 28px; }

        .detail-side-kicker {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            font-weight: 900;
            margin-bottom: 12px;
        }

        .detail-side-summary {
            font-size: 0.98rem;
            color: var(--on-surface-variant);
            line-height: 1.7;
            margin-top: 18px;
        }

.diary-container {
  background: white;
  padding: 40px 48px;
  border-radius: 2rem;
  box-shadow: 0 16px 48px rgba(0,0,0,0.04);
  border: 1px solid rgba(144,73,81,0.06);
  position: relative;
  overflow: hidden;
}

        .diary-container::before {
            content: "“";
            position: absolute;
            top: 20px;
            left: 30px;
            font-size: 120px;
            font-family: var(--font-heading);
            color: var(--primary);
            opacity: 0.05;
            line-height: 1;
        }

        .growth-visualization {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 48px;
        }

        .growth-line {
            width: 4px; height: 60px;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            opacity: 0.2;
            border-radius: 99px;
            margin-bottom: 12px;
        }

        .growth-dot {
            width: 20px; height: 20px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 0 8px rgba(144, 73, 81, 0.1);
        }

        @media (max-width: 1024px) {
            .detail-page-shell { padding: 24px 24px 40px; }
            .detail-layout { grid-template-columns: 1fr; gap: 48px; }
            .connected-section { margin-top: 48px; }
            .diary-container { padding: 48px; }
            #memoryTitle { font-size: 2.5rem !important; }
        }

        @media (max-width: 768px) {
            .detail-page-shell { padding: 18px 16px 32px; }
            .detail-topbar { align-items: flex-start; flex-direction: column; margin-bottom: 14px; }
            .detail-hero { padding: 22px 20px; border-radius: 1.5rem; margin-bottom: 24px; }
            .detail-hero-title { font-size: 1.8rem; line-height: 1.25; }
            .detail-layout { gap: 32px; }
            .video-main { border-radius: 1.5rem; margin-bottom: 20px; }
            .diary-container { padding: 32px 24px; border-radius: 2rem; }
            #memoryTitle { font-size: 2rem !important; line-height: 1.2; }
            .moment-card { padding: 16px; gap: 16px; }
            .moment-card img { width: 60px !important; height: 60px !important; }
            .growth-visualization { margin-top: 40px; }
            #connectedFragments { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body class="paper-grain">
    <div class="noise-overlay"></div>
    <div id="shared-header"></div>

    <div class="detail-page-shell">
        <div class="detail-topbar">
            <a id="backButton" class="detail-back-link" href="search.html">
                <span class="material-symbols-outlined">arrow_back</span>
                <span>...</span>
            </a>
            <div class="detail-view-chip">
                <span class="material-symbols-outlined">visibility</span>
                <span id="detailViewChipLabel">&nbsp;</span>
            </div>
        </div>

        <section id="detailHero" class="detail-hero">
            <div id="detailHeroKicker" class="detail-hero-kicker">&nbsp;</div>
            <h2 id="detailHeroTitle" class="headline detail-hero-title">...</h2>
            <p id="detailHeroDesc" class="detail-hero-desc">...</p>
            <div id="treeContext"></div>
        </section>

        <main class="detail-layout">
            <section class="detail-main-media">
                <div id="videoMain" class="video-main"></div>
                <div class="detail-memory-meta">
                    <span class="detail-meta-pill">
                        <span class="material-symbols-outlined">artist</span>
                        <span id="detailArtist">&nbsp;</span>
                    </span>
                    <span class="detail-meta-pill">
                        <span class="material-symbols-outlined">calendar_today</span>
                        <span id="detailDate">&nbsp;</span>
                    </span>
                </div>

                <div class="connected-section">
                    <div class="connected-heading">
                        <span id="connectedKicker" class="connected-kicker">&nbsp;</span>
                        <h3 id="connectedTitle" class="headline">&nbsp;</h3>
                        <p id="connectedSummary" class="connected-summary">&nbsp;</p>
                    </div>
                    <div id="connectedFragments" style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;"></div>
                </div>
            </section>

            <section class="diary-section">
                <div class="detail-side-intro">
                    <p id="detailSubtitle" class="detail-side-kicker">&nbsp;</p>
                    <h1 class="headline" id="memoryTitle" style="font-size: clamp(2rem, 5vw, 2.8rem); color: var(--on-surface); line-height: 1.15; margin-bottom: 20px;">&nbsp;</h1>
                    <div style="display: flex; gap: 10px;">
                        <div class="tags-container" id="tagsContainer"></div>
                    </div>
                    <p id="detailSideSummary" class="detail-side-summary">&nbsp;</p>
                </div>

                <div class="diary-container">
                    <p id="diaryQuote" style="font-size: 1.25rem; color: var(--on-surface); font-weight: 500; font-style: italic; line-height: 1.6; margin-bottom: 32px;">&nbsp;</p>
                    <div id="diaryContent" style="line-height: 2; color: var(--on-surface-variant); font-size: 1.05rem;">&nbsp;</div>
                </div>

                <div class="growth-visualization">
                    <div class="growth-line"></div>
                    <div class="growth-dot"></div>
                    <p id="growthLabel" style="margin-top: 16px; font-weight: 800; color: var(--primary); font-size: 12px; text-transform: uppercase; letter-spacing: 2px;">&nbsp;</p>
                </div>
            </section>
        </main>
    </div>
