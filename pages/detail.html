<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기억 상세 | 러브트리</title>
    <link rel="stylesheet" href="../css/global.css?v=20260415-10">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
    <style>
        .detail-page-shell {
            max-width: 1480px;
            margin: 0 auto;
            padding: 22px 40px 56px;
        }

        .detail-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
        }

        .detail-back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--on-surface-variant);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: color 0.2s ease;
        }

        .detail-back-link:hover { color: var(--primary); }
        .detail-back-link .material-symbols-outlined { font-size: 18px; }

        .detail-view-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.78);
            border: 1px solid rgba(144, 73, 81, 0.08);
            color: var(--on-surface-variant);
            font-size: 12px;
            font-weight: 700;
        }

        .detail-view-chip .material-symbols-outlined {
            font-size: 16px;
            color: var(--primary);
        }

        .detail-hero {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            padding: 18px 22px;
            border-radius: 1.35rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(249,245,242,0.94));
            border: 1px solid rgba(144, 73, 81, 0.08);
            box-shadow: 0 10px 24px rgba(75, 64, 57, 0.04);
        }

        .detail-hero-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--primary);
        }

        .detail-hero-title {
            margin: 0;
            font-size: 1.95rem;
            line-height: 1.15;
            color: var(--on-surface);
        }

        .detail-hero-desc {
            margin: 0;
            max-width: 680px;
            font-size: 0.94rem;
            line-height: 1.62;
            color: var(--on-surface-variant);
        }

        .detail-layout {
            max-width: 1480px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1.28fr) minmax(340px, 0.72fr);
            gap: 36px;
            align-items: start;
        }

        .detail-primary-stack {
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-width: 0;
        }

        .detail-title-block {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 6px 0 0;
        }

        .detail-side-kicker {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--primary);
            font-weight: 900;
            margin: 0;
        }

        .detail-title-main {
            margin: 0;
            font-size: clamp(2rem, 4vw, 2.8rem);
            color: var(--on-surface);
            line-height: 1.12;
        }

        .detail-tag-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .detail-main-media {
            margin-bottom: 0;
        }

        .video-main {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 28px 72px -20px rgba(0,0,0,0.18);
            margin-bottom: 16px;
        }

        .detail-memory-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 12px;
            color: var(--on-surface-variant);
        }

        .detail-meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 11px;
            border-radius: 999px;
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(144, 73, 81, 0.07);
        }

        .detail-meta-pill .material-symbols-outlined {
            font-size: 15px;
            color: var(--primary);
        }

        .diary-section {
            min-width: 0;
        }

        .diary-container {
            background: white;
            padding: 34px 38px;
            border-radius: 1.8rem;
            box-shadow: 0 14px 40px rgba(0,0,0,0.04);
            border: 1px solid rgba(144,73,81,0.06);
            position: relative;
            overflow: hidden;
        }

        .diary-container::before {
            content: "“";
            position: absolute;
            top: 16px;
            left: 24px;
            font-size: 104px;
            font-family: var(--font-heading);
            color: var(--primary);
            opacity: 0.05;
            line-height: 1;
        }

        .connected-section {
            margin-top: 10px;
        }

        .connected-section.is-empty .growth-visualization,
        .connected-section.is-empty .growth-line { display: none; }
        .connected-section.is-solo .moment-card { max-width: 520px; }
        .connected-section.is-solo .connected-summary { display: none; }
        .connected-section.is-threaded .moment-card { grid-column: span 1; }

        .connected-heading {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        .connected-kicker {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--primary);
        }

        .connected-section h3 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.18;
        }

        .connected-summary {
            margin: 0;
            color: var(--on-surface-variant);
            font-size: 0.92rem;
            line-height: 1.55;
            max-width: 620px;
        }

        .moment-card {
            background: white;
            padding: 18px;
            border-radius: 1.55rem;
            border: 1px solid rgba(0,0,0,0.03);
            box-shadow: 0 10px 28px rgba(0,0,0,0.02);
            display: flex;
            gap: 18px;
            align-items: center;
            margin-bottom: 16px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .moment-card:hover {
            transform: translateY(-4px);
            border-color: var(--outline-variant);
            box-shadow: var(--shadow-whisper);
        }

        .growth-visualization {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
        }

        .growth-line {
            width: 4px; height: 48px;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            opacity: 0.18;
            border-radius: 99px;
            margin-bottom: 10px;
        }

        .growth-dot {
            width: 18px; height: 18px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 0 8px rgba(144, 73, 81, 0.08);
        }

        @media (max-width: 1180px) {
            .detail-page-shell { padding: 22px 24px 40px; }
            .detail-layout { grid-template-columns: 1fr; gap: 28px; }
            .connected-section { margin-top: 0; }
            .diary-container { padding: 32px 30px; }
            .detail-title-main { font-size: 2.25rem; }
        }

        @media (max-width: 768px) {
            .detail-page-shell { padding: 16px 16px 30px; }
            .detail-topbar { align-items: flex-start; flex-direction: column; margin-bottom: 12px; }
            .detail-hero { padding: 16px 16px; border-radius: 1.2rem; margin-bottom: 14px; gap: 8px; }
            .detail-hero-title { font-size: 1.55rem; line-height: 1.2; }
            .detail-hero-desc { font-size: 0.9rem; line-height: 1.55; }
            .detail-layout { gap: 22px; }
            .detail-title-block { gap: 10px; }
            .detail-title-main { font-size: 1.85rem; line-height: 1.16; }
            .video-main { border-radius: 1.3rem; margin-bottom: 14px; }
            .diary-container { padding: 26px 20px; border-radius: 1.5rem; }
            .moment-card { padding: 14px; gap: 14px; }
            .moment-card img { width: 60px !important; height: 60px !important; }
            .growth-visualization { margin-top: 24px; }
            #connectedFragments { grid-template-columns: 1fr !important; gap: 14px !important; }
        }
    </style>
</head>
<body class="paper-grain">
    <div class="noise-overlay"></div>
    <div id="shared-header"></div>

    <div class="detail-page-shell">
        <div class="detail-topbar">
            <a id="backButton" class="detail-back-link" href="search.html">
                <span class="material-symbols-outlined">arrow_back</span>
                <span>...</span>
            </a>
            <div class="detail-view-chip">
                <span class="material-symbols-outlined">visibility</span>
                <span id="detailViewChipLabel">&nbsp;</span>
            </div>
        </div>

        <section id="detailHero" class="detail-hero">
            <div id="detailHeroKicker" class="detail-hero-kicker">&nbsp;</div>
            <h2 id="detailHeroTitle" class="headline detail-hero-title">...</h2>
            <p id="detailHeroDesc" class="detail-hero-desc">...</p>
            <div id="treeContext"></div>
        </section>

        <main class="detail-layout">
            <section class="detail-primary-stack">
                <section class="detail-main-media">
                    <div id="videoMain" class="video-main"></div>
                    <div class="detail-memory-meta">
                        <span class="detail-meta-pill">
                            <span class="material-symbols-outlined">artist</span>
                            <span id="detailArtist">&nbsp;</span>
                        </span>
                        <span class="detail-meta-pill">
                            <span class="material-symbols-outlined">calendar_today</span>
                            <span id="detailDate">&nbsp;</span>
                        </span>
                    </div>
                </section>

                <section class="diary-section">
                    <div class="detail-title-block">
                        <p id="detailSubtitle" class="detail-side-kicker">&nbsp;</p>
                        <h1 class="headline detail-title-main" id="memoryTitle">&nbsp;</h1>
                        <div class="detail-tag-row">
                            <div class="tags-container" id="tagsContainer"></div>
                        </div>
                    </div>

                    <div class="diary-container">
                        <p id="diaryQuote" style="font-size: 1.18rem; color: var(--on-surface); font-weight: 500; font-style: italic; line-height: 1.55; margin-bottom: 24px;">&nbsp;</p>
                        <div id="diaryContent" style="line-height: 1.9; color: var(--on-surface-variant); font-size: 1rem;">&nbsp;</div>
                    </div>
                </section>
            </section>

            <aside class="detail-secondary-stack">
                <div class="connected-section">
                    <div class="connected-heading">
                        <span id="connectedKicker" class="connected-kicker">&nbsp;</span>
                        <h3 id="connectedTitle" class="headline">&nbsp;</h3>
                        <p id="connectedSummary" class="connected-summary">&nbsp;</p>
                    </div>
                    <div id="connectedFragments" style="display: grid; grid-template-columns: 1fr; gap: 16px;"></div>
                </div>

                <div class="growth-visualization">
                    <div class="growth-line"></div>
                    <div class="growth-dot"></div>
                    <p id="growthLabel" style="margin-top: 14px; font-weight: 800; color: var(--primary); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;">&nbsp;</p>
                </div>
            </aside>
        </main>
    </div>
