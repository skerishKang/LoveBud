<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공개 러브트리 둘러보기 | 러브트리</title>
    <link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="stylesheet" href="../css/global.css?v=20260415-10">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" />
    <style>
        .search-container {
            max-width: var(--page-shell-max);
            margin: 0 auto;
            padding: 28px var(--page-pad-desktop) 58px;
            display: grid;
            grid-template-columns: minmax(0, 1.62fr) 420px;
            gap: var(--hero-gap);
        }

        .search-container .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1em;
            min-width: 1em;
            overflow: hidden;
        }

        .browse-curation-shell {
            margin-bottom: 20px;
            padding: 0;
            background: transparent;
            border: 0;
            box-shadow: none;
        }

        .search-panel-header {
            margin-bottom: 10px;
        }

        .search-panel-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 34px;
            padding: 0 14px;
            border-radius: 999px;
            background: rgba(144, 73, 81, 0.08);
            color: var(--primary);
            font-size: 12px;
            font-weight: 900;
            margin-bottom: 14px;
        }

        .search-panel-header h2 {
            font-size: clamp(2.28rem, 4.2vw, 3.4rem);
            margin-bottom: 8px;
            line-height: 1.04;
            letter-spacing: -0.035em;
        }

        .search-panel-header p {
            color: var(--on-surface-variant);
            font-size: 0.98rem;
            font-weight: 400;
            line-height: 1.55;
            max-width: 420px;
            margin: 0;
        }

        .search-input-wrapper {
            position: relative;
            margin-bottom: 0;
            max-width: 420px;
            flex: 1 1 auto;
            min-width: 0;
        }

        .search-input {
            width: 100%;
            box-sizing: border-box;
            padding: 15px 18px 15px 48px;
            border-radius: 999px;
            border: 1px solid rgba(144, 73, 81, 0.09);
            background: rgba(255,255,255,0.82);
            box-shadow: 0 10px 22px rgba(0,0,0,0.022);
            font-size: 0.96rem;
            font-family: var(--font-body);
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: rgba(144,73,81,0.18);
            box-shadow: 0 12px 28px rgba(141, 71, 79, 0.06);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 20px;
            opacity: 0.72;
        }

        .tag-chip {
            padding: 8px 14px;
            border-radius: 99px;
            background: rgba(255,255,255,0.76);
            color: var(--on-surface-variant);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(144, 73, 81, 0.08);
        }

        .tag-chip.active {
            background: rgba(144, 73, 81, 0.12);
            color: var(--primary);
            border-color: rgba(144, 73, 81, 0.16);
        }

        .search-intent-note {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 12px;
            color: var(--on-surface-variant);
            font-size: 0.92rem;
            font-weight: 700;
            line-height: 1.55;
        }

        .filter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 0;
            flex-wrap: wrap;
            justify-content: flex-end;
            min-width: 0;
        }

        .browse-utility-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 18px;
            min-width: 0;
        }

        .browse-guidance-strip {
            display: none;
        }

        .browse-results-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .browse-results-head h3 {
            margin: 0;
            font-size: 1.7rem;
            font-weight: 900;
            color: var(--on-surface);
            letter-spacing: -0.02em;
        }

        .browse-results-head p {
            margin: 8px 0 0;
            font-size: 0.95rem;
            line-height: 1.58;
            color: var(--on-surface-variant);
        }

        .browse-results-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 32px;
            padding: 0 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.86);
            border: 1px solid rgba(144, 73, 81, 0.08);
            color: var(--primary);
            font-size: 12px;
            font-weight: 900;
            white-space: nowrap;
            box-shadow: 0 8px 18px rgba(75,64,57,0.03);
        }

        #resultsList,
        #growingTreesList {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            align-items: stretch;
            min-width: 0;
        }

        .search-skeleton-card {
            pointer-events: none;
            cursor: default;
            box-shadow: 0 16px 32px rgba(75, 64, 57, 0.035);
        }

        .search-skeleton-card::before {
            opacity: 0;
        }

        .search-skeleton-block,
        .search-skeleton-line,
        .search-skeleton-chip {
            display: block;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(144,73,81,0.07), rgba(255,255,255,0.72), rgba(122,139,110,0.07));
            background-size: 220% 100%;
            animation: searchSkeletonPulse 1.35s ease-in-out infinite;
        }

        .search-skeleton-block {
            border-radius: 1.35rem;
            width: 100%;
        }

        .search-skeleton-title {
            width: 72%;
            height: 18px;
        }

        .search-skeleton-copy {
            width: 92%;
            height: 13px;
            opacity: 0.75;
        }

        .search-skeleton-chip {
            width: 96px;
            height: 28px;
        }

        .search-skeleton-count {
            width: 82px;
            height: 13px;
        }

        @keyframes searchSkeletonPulse {
            0%, 100% { opacity: 0.58; }
            50% { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .search-skeleton-block,
            .search-skeleton-line,
            .search-skeleton-chip { animation: none; }
        }

        /* Growing Trees Section */
        .growing-trees-section {
            margin-top: 50px;
            margin-bottom: 44px;
            padding: 28px;
            background: 
                radial-gradient(circle at 20% 20%, rgba(255, 248, 245, 0.62), transparent 48%),
                rgba(255, 255, 255, 0.38);
            border: 1px solid rgba(144, 73, 81, 0.08);
            border-radius: 2.25rem;
            box-shadow: 
                inset 0 0 40px rgba(255, 255, 255, 0.52),
                0 12px 32px rgba(75, 64, 57, 0.03);
        }

        .growing-trees-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 22px;
            gap: 16px;
        }

        .growing-trees-head h3 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--on-surface);
            letter-spacing: -0.025em;
        }

        .growing-trees-head p {
            color: var(--on-surface-variant);
            font-size: 0.94rem;
            margin: 0;
            line-height: 1.48;
        }

        .growing-trees-badge {
            display: inline-flex;
            align-items: center;
            padding: 7px 14px;
            background: rgba(144, 73, 81, 0.06);
            color: var(--on-surface-variant);
            border: 1px solid rgba(144, 73, 81, 0.1);
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 800;
            white-space: nowrap;
            letter-spacing: 0.01em;
        }

        .tree-card {
            display: flex;
            flex-direction: column;
            padding: 14px;
            background: 
                radial-gradient(circle at 30% 20%, rgba(255, 248, 245, 0.92), transparent 52%),
                rgba(255, 255, 255, 0.82);
            border-radius: 1.85rem;
            border: 1px solid rgba(144, 73, 81, 0.08);
            margin-bottom: 0;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 20px 48px rgba(75, 64, 57, 0.1),
                0 0 0 1px rgba(255, 255, 255, 0.62) inset;
            min-width: 0;
        }

        .tree-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, rgba(200,116,128,0.6), rgba(240,193,198,0.6));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .tree-card:hover {
            transform: translateY(-3px);
            border-color: rgba(144,73,81,0.16);
            box-shadow: 
                0 24px 56px rgba(75, 64, 57, 0.14),
                0 0 0 1px rgba(255, 255, 255, 0.82) inset;
        }

        .tree-card.is-active {
            border-color: rgba(144, 73, 81, 0.22);
            box-shadow: 
                0 26px 60px rgba(144, 73, 81, 0.12),
                0 0 0 1px rgba(255, 255, 255, 0.42) inset;
        }

        .tree-card:hover::before,
        .tree-card.is-active::before {
            opacity: 1;
        }

        .tree-card-featured .tree-card-media {
            min-height: 210px;
        }

        .tree-card-media {
            position: relative;
            min-height: 182px;
            margin: 0 0 16px;
            overflow: hidden;
            border-radius: 1.45rem;
            background: 
                radial-gradient(circle at 20% 15%, rgba(255, 245, 246, 0.95), rgba(255,255,255,0.18) 46%),
                linear-gradient(135deg, rgba(144, 73, 81, 0.12), rgba(122, 139, 110, 0.12));
            isolation: isolate;
        }

        .tree-card-media img {
            width: 100%;
            height: 100%;
            min-height: inherit;
            object-fit: cover;
            display: block;
        }

        .tree-card-media::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(50, 38, 35, 0.22), rgba(50, 38, 35, 0.03) 58%, rgba(255,255,255,0));
            pointer-events: none;
        }

        .tree-card-media-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 34px;
            font-weight: 900;
            background: 
                radial-gradient(circle at 18% 16%, rgba(255, 245, 246, 0.92), rgba(255,255,255,0.12) 48%),
                linear-gradient(135deg, rgba(144, 73, 81, 0.09), rgba(122, 139, 110, 0.11));
        }

        .tree-card-media-fallback[hidden] {
            display: none !important;
        }

        .tree-card-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 4px 6px 6px;
            height: 100%;
            min-width: 0;
        }

        .tree-title {
            font-size: 1.46rem;
            font-weight: 900;
            line-height: 1.18;
            letter-spacing: -0.02em;
        }

        .tree-subtitle {
            font-size: 0.92rem;
            color: var(--on-surface-variant);
            line-height: 1.58;
            margin: 0;
        }

        .tree-meta-row {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(144,73,81,0.08);
            font-size: 13px;
            color: var(--on-surface-variant);
        }

        .tree-meta-left,
        .tree-meta-right {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .tree-meta-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 28px;
            padding: 0 10px;
            border-radius: 999px;
            background: rgba(250,244,245,0.92);
            color: var(--primary);
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .tree-meta-chip .material-symbols-outlined {
            font-size: 14px;
        }

        .preview-sidebar {
            position: sticky;
            top: 96px;
            height: fit-content;
            background: 
                radial-gradient(circle at 28% 12%, rgba(255, 248, 246, 0.96), transparent 38%),
                radial-gradient(circle at 80% 22%, rgba(242, 234, 228, 0.72), transparent 28%),
                linear-gradient(180deg, rgba(255, 249, 245, 0.92), rgba(244, 248, 238, 0.96));
            padding: 30px 24px;
            border-radius: 2.25rem;
            border: 1px solid rgba(144, 73, 81, 0.1);
            box-shadow: 
                0 24px 60px rgba(75, 64, 57, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(14px);
            min-width: 0;
        }

        .preview-sidebar h3 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--on-surface);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            min-width: 0;
        }

        .preview-panel-header h3 {
            font-size: 1.68rem;
            font-weight: 900;
            color: var(--on-surface);
            margin: 0;
            letter-spacing: -0.02em;
        }

        .preview-panel-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .preview-mobile-close {
            display: none;
            appearance: none;
            border: 1px solid rgba(144, 73, 81, 0.10);
            background: rgba(255,255,255,0.92);
            color: var(--primary);
            width: 40px;
            height: 40px;
            border-radius: 999px;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 18px rgba(75,64,57,0.05);
            cursor: pointer;
            flex: 0 0 auto;
        }

        .preview-mobile-close .material-symbols-outlined {
            font-size: 20px;
        }

        .preview-badge {
            font-size: 11px;
            font-weight: 900;
            color: var(--primary);
            background: rgba(144, 73, 81, 0.08);
            padding: 6px 11px;
            border-radius: 99px;
            white-space: nowrap;
        }

        .preview-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--on-surface-variant);
            font-size: 14px;
            padding: 20px;
        }

        .preview-empty-state p {
            margin: 0;
            line-height: 1.7;
        }

        .tree-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--on-surface-variant);
            padding: 14px 0;
            border-top: 1px solid rgba(144,73,81,0.08);
            border-bottom: 1px solid rgba(144,73,81,0.08);
            margin: 18px 0;
        }

        .tree-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .emotion-tags-label {
            font-size: 12px;
            font-weight: 800;
            color: var(--on-surface-variant);
            margin-bottom: 12px;
            text-transform: none;
            letter-spacing: 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, rgba(144, 73, 81, 0.08), rgba(122, 139, 110, 0.08));
            border-radius: 1.55rem;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(144,73,81,0.06);
            box-shadow: none;
        }

        @media (max-width: 1240px) {
            .search-container {
                grid-template-columns: minmax(0, 1fr) 380px;
                gap: 24px;
                padding: 24px var(--page-pad-tablet) 48px;
            }

            #resultsList,
            #growingTreesList {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px;
            }
        }

        @media (max-width: 1024px) {
            .search-container {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            .preview-sidebar {
                position: sticky;
                top: 92px;
                z-index: 5;
                align-self: start;
            }
        }

        @media (max-width: 768px) {
            .search-container {
                padding: 20px var(--page-pad-mobile) 36px;
                gap: 22px;
            }

            .browse-curation-shell {
                margin-bottom: 16px;
            }

            .search-panel-header h2 {
                font-size: 2.0rem;
                line-height: 1.08;
                margin-bottom: 7px;
            }

            .search-panel-header p {
                font-size: 0.94rem;
                max-width: 100%;
            }

            .search-input {
                font-size: 0.94rem;
                padding: 14px 16px 14px 44px;
            }

            .search-icon {
                font-size: 18px;
                left: 14px;
            }

            #resultsList,
            #growingTreesList {
                grid-template-columns: 1fr;
            }

            .growing-trees-section {
                padding: 22px 16px;
                margin-top: 40px;
                border-radius: 1.6rem;
            }

            .growing-trees-head {
                flex-direction: column;
                margin-bottom: 18px;
                gap: 10px;
            }

            .preview-sidebar {
                order: -1;
                display: none;
                position: static;
                z-index: auto;
                padding: 22px 18px;
                border-radius: 1.5rem;
            }

            .preview-sidebar.is-open {
                display: block;
            }

            .preview-panel-header {
                align-items: flex-start;
                gap: 8px;
            }

            .preview-panel-title-group {
                min-width: 0;
                flex: 1 1 auto;
            }

            .preview-panel-header h3 {
                font-size: 1.42rem;
            }

            .preview-mobile-close {
                display: inline-flex;
            }

            .tag-chip {
                font-size: 11px;
                padding: 7px 11px;
            }

            .browse-results-head {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .browse-results-head h3 {
                font-size: 1.45rem;
            }

            .browse-utility-row {
                gap: 10px;
                margin-top: 14px;
            }
        }
    </style>
</head>
<body class="bokeh-bg">
    <div class="noise-overlay"></div>

    <!-- Shared Header -->
    <div id="shared-header"></div>

    <main class="search-container">
        <section>
            <div class="browse-curation-shell">
                <div class="search-panel-header">
                    <h2 class="headline" data-i18n="search.title">러브트리 둘러보기</h2>
                    <p data-i18n="search.subtitle">조용히 자라는 마음들</p>
                </div>
            </div>

            <div id="resultsList">
                <div class="tree-card tree-card-featured search-skeleton-card" aria-hidden="true">
                    <div class="tree-card-media search-skeleton-block" style="min-height:210px;"></div>
                    <div class="tree-card-body">
                        <div class="search-skeleton-line search-skeleton-title"></div>
                        <div class="search-skeleton-line search-skeleton-copy"></div>
                        <div class="tree-meta-row">
                            <div class="tree-meta-left"><span class="tree-meta-chip search-skeleton-chip"></span></div>
                            <div class="tree-meta-right"><span class="search-skeleton-line search-skeleton-count"></span></div>
                        </div>
                    </div>
                </div>
                <div class="tree-card search-skeleton-card" aria-hidden="true">
                    <div class="tree-card-media search-skeleton-block"></div>
                    <div class="tree-card-body">
                        <div class="search-skeleton-line search-skeleton-title"></div>
                        <div class="search-skeleton-line search-skeleton-copy"></div>
                        <div class="tree-meta-row">
                            <div class="tree-meta-left"><span class="tree-meta-chip search-skeleton-chip"></span></div>
                            <div class="tree-meta-right"><span class="search-skeleton-line search-skeleton-count"></span></div>
                        </div>
                    </div>
                </div>
                <div class="tree-card search-skeleton-card" aria-hidden="true">
                    <div class="tree-card-media search-skeleton-block"></div>
                    <div class="tree-card-body">
                        <div class="search-skeleton-line search-skeleton-title"></div>
                        <div class="search-skeleton-line search-skeleton-copy"></div>
                        <div class="tree-meta-row">
                            <div class="tree-meta-left"><span class="tree-meta-chip search-skeleton-chip"></span></div>
                            <div class="tree-meta-right"><span class="search-skeleton-line search-skeleton-count"></span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 새로 자라는 러브트리 섹션 -->
            <section id="growingTreesSection" class="growing-trees-section" hidden>
                <div class="growing-trees-head">
                    <div>
                        <h3>새로 자라는 러브트리</h3>
                        <p>막 자라기 시작한 마음들</p>
                    </div>
                    <span class="growing-trees-badge">자라는 중</span>
                </div>
                <div id="growingTreesList">
                    <!-- Populated by JS -->
                </div>
            </section>

            <div class="browse-utility-row">
                <div class="search-input-wrapper">
                    <span class="material-symbols-outlined search-icon">search</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="아티스트, 첫 순간, 감정으로 찾아보기" required>
                </div>

                <div class="filter-row" aria-label="감상 보조 필터">
                    <span class="tag-chip active" data-category="전체">전체</span>
