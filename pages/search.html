<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공개 러브트리 둘러보기 | 러브트리</title>
    <link rel="stylesheet" href="../css/global.css?v=20260415-10">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
    <style>
        .search-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 60px 48px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 64px;
        }

        .search-input-wrapper {
            position: relative;
            margin-bottom: 32px;
        }

        .search-input {
            width: 100%;
            padding: 28px 28px 28px 68px;
            border-radius: 1.5rem;
            border: 1px solid var(--outline-variant);
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            font-size: 1.25rem;
            font-family: var(--font-body);
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(141, 71, 79, 0.08);
        }

        .search-icon {
            position: absolute;
            left: 28px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 28px;
        }

        .tag-chip {
            padding: 8px 18px;
            border-radius: 99px;
            background: var(--surface-container-low);
            color: var(--on-surface-variant);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-chip.active {
            background: var(--primary);
            color: white;
        }

        /* Tree Card Styles - 감상 공간 느낌 강화 */
        .tree-card {
            display: flex;
            flex-direction: column;
            padding: 24px;
            background: white;
            border-radius: 1.5rem;
            border: 1px solid rgba(0,0,0,0.04);
            margin-bottom: 20px;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .tree-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-soft), var(--accent-rose));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .tree-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-soft);
            box-shadow: 0 20px 50px rgba(144, 73, 81, 0.08);
        }

        .tree-card:hover::before {
            opacity: 1;
        }

        /* 순차적 애니메이션 */
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tree-card {
            animation: cardFadeIn 0.4s ease-out forwards;
            opacity: 0;
        }

        .tree-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .tree-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary-soft) 0%, var(--accent-rose) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .tree-title-group {
            flex: 1;
        }

        .tree-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--on-surface);
        }

        .tree-subtitle {
            font-size: 0.85rem;
            color: var(--on-surface-variant);
        }

        .tree-path-preview {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding: 16px;
            background: var(--surface-container-low);
            border-radius: 1rem;
        }

        .path-node {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .path-node img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .path-arrow {
            color: var(--on-surface-variant);
            opacity: 0.4;
            font-size: 20px;
        }

        .path-more {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: var(--surface-container);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--on-surface-variant);
            flex-shrink: 0;
        }

        .tree-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--on-surface-variant);
        }

        .tree-stats {
            display: flex;
            gap: 16px;
        }

        .tree-emotions {
            display: flex;
            gap: 6px;
        }

        .emotion-tag {
            padding: 4px 10px;
            border-radius: 99px;
            background: var(--surface-container-low);
            font-size: 11px;
            font-weight: 700;
            color: var(--on-surface-variant);
        }

        .result-card {
            display: flex;
            gap: 28px;
            padding: 24px;
            background: white;
            border-radius: 2rem;
            border: 1px solid rgba(0,0,0,0.03);
            margin-bottom: 24px;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
        }

        .result-card:hover {
            transform: scale(1.02);
            border-color: var(--outline-variant);
            box-shadow: var(--shadow-whisper);
        }

        .thumbnail-wrapper {
            width: 240px;
            height: 140px;
            border-radius: 1rem;
            overflow: hidden;
            background: #000;
        }

        .thumbnail-wrapper img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .preview-sidebar {
            position: sticky;
            top: 120px;
            height: fit-content;
            background: linear-gradient(135deg, white 0%, var(--surface-container-low) 100%);
            padding: 32px;
            border-radius: 2rem;
            border: 1px solid var(--outline-variant);
            box-shadow: var(--shadow-whisper);
        }

        .preview-sidebar h3 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--on-surface);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-panel-header {
            margin-bottom: 40px;
        }

        .search-panel-header h2 {
            font-size: 2.5rem;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .search-panel-header p {
            color: var(--on-surface-variant);
            font-size: 1.1rem;
            font-weight: 400;
            line-height: 1.6;
        }

        .preview-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .preview-panel-header h3 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--on-surface);
            margin: 0;
        }

        .preview-badge {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            background: var(--surface-container-low);
            padding: 6px 12px;
            border-radius: 99px;
        }

        .preview-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--on-surface-variant);
            font-size: 14px;
            padding: 20px;
        }

        .preview-empty-state p {
            margin: 0;
            line-height: 1.5;
        }

        .tree-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--on-surface-variant);
            padding: 12px 0;
            border-top: 1px solid var(--outline-variant);
            border-bottom: 1px solid var(--outline-variant);
            margin: 16px 0;
        }

        .tree-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .emotion-tags-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--on-surface-variant);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 1.2rem;
            overflow: hidden;
            margin-bottom: 24px;
        }

        /* Tablet and below */
        @media (max-width: 1024px) {
            .search-container {
                grid-template-columns: 1fr;
                gap: 48px;
                padding: 40px 24px;
            }

            .preview-sidebar {
                position: static;
            }

            .thumbnail-wrapper {
                width: 180px;
                height: 120px;
            }
        }

        @media (max-width: 768px) {
            .search-container {
                padding: 24px 16px;
                gap: 32px;
            }

            .search-input {
                font-size: 1rem;
                padding: 20px 20px 20px 56px;
            }

            .search-icon {
                font-size: 24px;
                left: 20px;
            }

            .result-card {
                padding: 16px;
                gap: 16px;
            }

            .thumbnail-wrapper {
                width: 140px;
                height: 100px;
            }

            .preview-sidebar {
                padding: 24px;
                border-radius: 1.5rem;
            }

            .video-container {
                border-radius: 1rem;
            }

            .result-card h3 {
                font-size: 1.1rem !important;
            }

            .tag-chip {
                font-size: 12px;
                padding: 6px 14px;
            }
        }

        @media (max-width: 480px) {
            .thumbnail-wrapper {
                width: 100px;
                height: 75px;
            }

            .result-card {
                flex-direction: column;
            }
        }
    </style>
</head>
<body class="paper-grain">
    <div class="noise-overlay"></div>
    
    <!-- Shared Header -->
    <div id="shared-header"></div>

        <main class="search-container">
            <section>
                <div class="search-panel-header">
                    <h2 class="headline" data-i18n="search.title">공개 러브트리 둘러보기</h2>
                    <p data-i18n="search.subtitle">다른 팬들이 정성껏 가꾼 공개 러브트리들을 둘러보고 함께 추억을 나누어 보세요.</p>
                </div>

            <div class="search-input-wrapper">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" id="searchInput" class="search-input" placeholder="예: 아티스트명 · 러브트리 주제 · 감정 태그" data-i18n-placeholder="search.placeholder" required>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 48px;">
<span class="tag-chip active" data-category="전체" data-i18n="search.filter.all">전체 경로</span>
            <span class="tag-chip" data-category="입덕" data-i18n="search.filter.newbie">입덕 순간</span>
            <span class="tag-chip" data-category="성장" data-i18n="search.filter.growing">성장 과정</span>
            <span class="tag-chip" data-category="최애" data-i18n="search.filter.fan">최애 확정</span>
            </div>

            <div id="resultsList">
                <!-- Populated by JS -->
            </div>
        </section>

        <aside class="preview-sidebar" id="previewSidebar">
            <div class="preview-panel-header">
                <h3 data-i18n="search.previewTitle">러브트리 미리보기</h3>
                <span class="preview-badge" data-i18n="search.previewBadge">대표 순간 보기</span>
            </div>
            <div id="previewVideoContainer" class="video-container" style="margin-bottom: 24px;">
                <div class="preview-empty-state" style="width:100%; height:100%; display:flex; flex-direction: column; align-items:center; justify-content:center; color: var(--on-surface-variant); font-size: 14px; text-align: center; padding: 20px;">
                    <p style="margin-bottom: 8px;" data-i18n="search.previewEmptyLead">왼쪽 목록에서 공개 러브트리를 선택하면</p>
                    <p data-i18n="search.previewEmptyBody">해당 트리의 감정 흐름과 대표 순간을 여기서 미리 볼 수 있어요.</p>
                </div>
            </div>
            <div id="previewDetails">
                <div id="previewTitle" class="headline" style="font-size: 1.1rem; margin-bottom: 12px; font-weight: 800; color: var(--on-surface);" data-i18n="search.previewPlaceholder">트리를 선택하여 감상하기</div>
                <div id="previewDesc" style="color: var(--on-surface-variant); font-size: 14px; line-height: 1.5;">
                    <p style="margin-bottom: 16px;" data-i18n="search.previewDescriptionPlaceholder">카드를 선택하면 감정의 흐름과 대표 순간을 미리 볼 수 있어요.</p>
                </div>
                <div id="previewTreeStats" class="tree-meta" hidden>
                    <span class="tree-meta-item">
                        <span class="material-symbols-outlined" style="font-size: 14px; vertical-align: middle;">account_tree</span>
                        <span id="previewMemoriesCount">0</span>
                        <span data-i18n="search.previewMomentCountSuffix">개 순간</span>
                    </span>
                    <span class="tree-meta-item">
                        <span class="material-symbols-outlined" style="font-size: 14px; vertical-align: middle;">schedule</span>
                        <span id="previewTreeDuration" data-i18n="search.previewDurationPending">업데이트 정보 준비 중</span>
                    </span>
                </div>
                <div>
                    <div class="emotion-tags-label">
                        <span class="material-symbols-outlined" style="font-size: 14px;">tag</span>
                        <span data-i18n="search.previewEmotionTagsLabel">감정 태그</span>
                    </div>
                    <div id="previewEmotionTags" style="display: flex; flex-wrap: wrap; gap: 8px;">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </aside>
    </main>
